description_en: |
  Kitty Krush is a grid-based turn-based strategy game inspired by Konkr.io, implemented in C++20 using the SDL2 library (including SDL2_ttf, SDL2_gfx, and SDL2_image) and styled around adorable cat characters. In Kitty Krush, you command cat units to expand your borders, claim neutral lands, and defeat rival cat factions on various tactical maps. The game features a complete economy system where coins are generated by your provinces, stored in your treasury, and spent on recruiting and upgrading cat units or erecting defensive buildings. If your province's treasury falls below zero, your neglected cats will rebel and become bandit units! The project adheres to a strict Model-View-Controller (MVC) architecture, featuring custom UI systems, interactive event polling, dynamic pathfinding and connection algorithms, and a complete map creator/random generator.
description_fr: |
  Kitty Krush est un jeu de stratégie au tour par tour sur grille inspiré de Konkr.io, développé en C++20 à l'aide de la bibliothèque SDL2 (incluant SDL2_ttf, SDL2_gfx et SDL2_image) et articulé autour d'adorables personnages félins. Dans Kitty Krush, vous commandez des unités de chats pour étendre vos frontières, revendiquer des terres neutres et vaincre les factions félines rivales sur diverses cartes tactiques. Le jeu propose un système économique complet où les pièces sont générées par vos provinces, stockées dans votre trésorerie et dépensées pour recruter et améliorer vos chats ou construire des bâtiments défensifs. Si la trésorerie de votre province tombe en dessous de zéro, vos chats négligés se rebelleront et deviendront des bandits ! Le projet respecte une architecture Modèle-Vue-Contrôleur (MVC) stricte, intégrant des systèmes d'interface utilisateur personnalisés, une gestion interactive des événements, des algorithmes de recherche de chemin et de connexion dynamique, ainsi qu'un créateur de cartes et un générateur aléatoire complets.
