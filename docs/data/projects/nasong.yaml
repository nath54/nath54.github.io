description_en: |
  **NaSong** is a highly innovative, modular Python-based music synthesizer, sequencer, and live-coding platform that treats **"Code as Music"**. Instead of relying on traditional graphical DAWs with fixed tracks and plugin systems, NaSong allows developers and electronic music composers to build fully custom, mathematically precise, and highly composable audio synthesis graphs entirely in Python.

  ### 🔊 Key Features & Architectural Capabilities

  *   **"Everything is a Value" Architecture:** At the core of NaSong is the `Value` system. An audio waveform, an LFO, an ADSR envelope, or a constant value are all modeled as time-varying signal graphs. These graphs leverage fast, vectorized **NumPy** operations (`getitem_np`) to render complex multi-voice orchestrations in record time.
  *   **Differentiable Audio Synthesis & Deep Learning:** Under the hood, NaSong integrates with **PyTorch** to define trainable instruments. By comparing synthesized waveforms with target audio samples (.wav), the framework uses gradient descent (Adam) and spectral STFT loss to learn optimal synthesizer parameters (such as ADSR envelope values, FM index, or vocal formant frequencies).
  *   **Algo-Rave Terminal User Interface (TUI):** A complete live-coding environment built using **Textual**. It features an integrated code editor with hot-reloading (saving compiles and hot-swaps the audio graph without playback interruption), live BPM/volume controls, and an API documentation browser.
  *   **Advanced Multi-Threaded Audio Engine:** Features a background `RenderEngine` that computes audio chunks using a priority queue, double-buffering, and version tracking to ensure glitch-free audio playback even during complex real-time script reloads.
  *   **Expressive Domain-Specific Language (DSL):** Offers syntactic sugar for signal chaining via the `>>` operator (e.g., `Chainable(Sin) >> Gain(0.5)`), decorators like `@instrument` and `@effect`, and typed musical units (`BPM`, `Ms`, `Bars`, `Hz`).
  *   **Global Music Theory Engine:** Native support for scale systems, chords, progressions, and rhythm patterns, extending from Western modes (major, minor, Phrygian, etc.) to Non-Western traditions like Indian **Ragas**, Arabic **Maqams**, and Indonesian **Gamelan**. Includes pre-built style generators for **Jazz**, **EDM**, and **Lofi**.
description_fr: |
  **NaSong** est un synthétiseur, séquenceur et outil de live-coding musical révolutionnaire basé sur Python qui applique la philosophie du **"Code en tant que Musique"**. Au lieu d'utiliser des stations de travail audio numériques (DAW) graphiques traditionnelles, NaSong permet aux développeurs et compositeurs de concevoir des graphes de synthèse audio complexes, mathématiquement précis et hautement modulables en écrivant du code Python.

  ### 🔊 Fonctionnalités et Architecture Clés

  *   **Architecture "Tout est une Valeur" (Value) :** Le cœur du système repose sur des signaux variant dans le temps. Que ce soit une onde sinusoïdale, un LFO, une enveloppe ADSR ou une constante, chaque élément est un nœud de calcul. Les graphes s'appuient sur des opérations vectorisées **NumPy** (`getitem_np`) pour un rendu extrêmement rapide.
  *   **Synthèse Différentiable et Deep Learning :** NaSong s'intègre avec **PyTorch** pour définir des instruments programmables intelligents. En comparant les signaux synthétisés à des échantillons audio cibles (.wav), le framework utilise la descente de gradient (Adam) et des pertes spectrales (STFT) pour apprendre les paramètres optimaux d'enveloppe, d'index FM ou de formants vocaux.
  *   **Interface Terminale Algo-Rave (TUI) :** Un environnement de live-coding immersif développé avec **Textual**. Il propose un éditeur intégré avec rechargement à chaud (la sauvegarde compile et injecte le nouveau graphe sans couper le son), des contrôles de volume/BPM en temps réel, et un explorateur de documentation d'API.
  *   **Moteur Audio Multi-Threadé Résilient :** Le `RenderEngine` en arrière-plan pré-calcule les blocs audio via une file d'attente prioritaire, un système de double-buffering et un suivi des versions pour éliminer tout artefact sonore ou interruption lors du rechargement de scripts complexes.
  *   **Langage Dédié Expressif (DSL) :** Fournit une syntaxe fluide de chaînage de signaux via l'opérateur de flux `>>` (ex: `Chainable(Sin) >> Gain(0.5)`), des décorateurs `@instrument` et `@effect`, et des unités musicales typées (`BPM`, `Ms`, `Bars`, `Hz`).
  *   **Moteur de Théorie Musicale Avancé :** Support natif complet des gammes, accords, progressions et rythmes, s'étendant des modes occidentaux classiques aux systèmes microtonaux et ethniques tels que les **Ragas** indiens, les **Maqams** arabes et le **Gamelan** indonésien. Inclut des générateurs de styles **Jazz**, **EDM** et **Lofi**.
