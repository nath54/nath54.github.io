description_en: |
  Developed during a 3-month engineering internship at Alcatel-Lucent Enterprise, this project focuses on **topical segmentation (conversation cutting)** and **semantic search** within the **Rainbow** collaboration platform logs. When users engage in continuous conversation streams, extracting separate discussions is highly challenging; this project resolves that by using advanced NLP techniques to segment the history into structured discussion threads and indexing them for fast semantic queries.

  ### Key Pillars & Capabilities:
  1. **Topical Segmentation (Conversation Cutting)**: Combines sequential clustering (`ClusteringSeq_ConversationAlgorithm`) based on time differences between messages, user interactions, embeddings similarity, and matched named entities to slice continuous message flows into cohesive threads.
  2. **Multi-criteria Semantic Search**: Integrates multiple search strategies into a combined score:
     - **SimpleEmbedding_SearchAlgorithm**: Calculates cosine distance using state-of-the-art transformer embeddings (e.g., `all-MiniLM-L6-v2`, `e5-large-v2`, `sentence-camembert-large`). Optimized with `optimum` and ONNX Runtime to dramatically improve CPU performance.
     - **SimpleSearchByTime**: Temporal proximity ranking.
     - **SearchByUsers**: Interactor-focused query boosting.
     - **SearchWith_NER_Engine**: Elevates search results containing specific entities.
  3. **Named Entity Recognition (NER)**: Features syntax-rule-based extraction, standard spaCy pipelines, a custom date recognizer, and a textual number-to-integer converter (e.g. converting "quatre cent quatre-vingt-dix-neuf" to 499).
  4. **Local Translation Engine**: Utilizes EasyNMT to translate French logs to English on the fly before generating embeddings, enabling multilingual searches on compact English models.
  5. **Optimized Caching & Threading**: Implements robust local caching for translations and embeddings, alongside a multi-threaded queue-based server architecture (`threads_tasks_server.py`) to reduce query latency.
  6. **Benchmarks & Hyperparameter Tuning**: Features an automated test suite analyzing algorithms across different configurations, with a dedicated web visualization interface for hyperparameter optimization and benchmark charting.
  7. **C# Rainbow SDK Integration**: Includes a C# socket client (`Rainbow_App`) to directly ingest chat messages from the official Rainbow SDK API.
description_fr: |
  Développé dans le cadre d'un stage de premier année d'école d'ingénieur de 3 mois chez Alcatel-Lucent Enterprise, ce projet porte sur le **découpage thématique** et la **recherche sémantique** dans les historiques de conversations de la plateforme de collaboration **Rainbow**. Face aux flux continus de messages dans les canaux de discussion, isoler des conversations distinctes est difficile ; ce projet résout cette problématique en structurant l'historique en fils de discussion cohérents et en les indexant pour permettre des recherches sémantiques rapides.

  ### Piliers technologiques & Fonctionnalités :
  1. **Découpage des Conversations (Conversation Cutting)** : Allie un algorithme de clustering séquentiel basé sur l'intervalle de temps entre les messages, l'interaction des utilisateurs, la similarité des embeddings et la présence d'entités nommées pour découper le flux continu de messages en sessions de discussion distinctes.
  2. **Moteur de Recherche Sémantique Multi-critères** : Combine plusieurs approches de recherche pour calculer un score de pertinence hybride :
     - **SimpleEmbedding_SearchAlgorithm** : Calcule la distance cosinus à l'aide d'embeddings de phrases (via des modèles de sentence-transformers comme `all-MiniLM-L6-v2`, `e5-large-v2`, `sentence-camembert-large`), optimisés sous format ONNX via `optimum` pour d'excellentes performances sur CPU.
     - **SimpleSearchByTime** : Pondération temporelle.
     - **SearchByUsers** : Boost de pertinence basé sur les participants.
     - **SearchWith_NER_Engine** : Valorise les messages contenant les entités nommées recherchées.
  3. **Moteur de Reconnaissance d'Entités Nommées (NER)** : Propose une reconnaissance d'entités basée sur des règles syntaxiques et des modèles spaCy. Comprend un système sur mesure de détection de dates et un convertisseur textuel de nombres (ex: convertit "quatre cent vingt-trois" en 423).
  4. **Pipeline de Traduction Localisé** : Utilise EasyNMT pour traduire les messages français en anglais avant le calcul d'embeddings, permettant d'exploiter de petits modèles anglais très performants sur des conversations francophones.
  5. **Système de Cache et de Threading** : Met en œuvre des systèmes de cache locaux persistants pour les embeddings et les traductions afin de minimiser les temps de calcul, ainsi qu'un serveur multi-threadé basé sur des files d'attente pour traiter les requêtes en parallèle.
  6. **Visualisation de Benchmarks et Optimisation** : Inclut une suite de tests automatisés générant des rapports interactifs complets en HTML statique pour analyser la pertinence de la recherche, du NER et du découpage, ainsi qu'une interface web d'optimisation automatique des hyperparamètres.
  7. **Intégration C# SDK Rainbow** : Comprend un client socket en C# (`Rainbow_App`) qui se connecte au serveur Python pour ingérer et indexer directement les conversations en temps réel depuis le SDK Rainbow officiel.
