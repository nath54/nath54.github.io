description_en: |
  A specialized **Python Discord Bot** designed to fetch, parse, and search through Discord channel chat logs. The bot enables users to execute **hybrid queries** that combine deep learning **sentence embeddings** with keyword-based **syntactic overlap**. Users can easily deploy it on any server to retrieve contextually relevant historical messages that standard word-search fails to discover.

  ### Key Components & Architecture:
  1. **Discord Bot Engine (`discord_bot.py`)**: Built on `discord.py` (`commands.Bot`), it monitors guild channels and intercepts command prefixes (e.g. `!`). Features dynamic message pagination using asynchronous streams (`aiostream.stream`) to retrieve large channel histories, respecting user-specific read permissions.
  2. **Hybrid Search Pipeline (`distance_calculator.py`)**: Calculates similarity using three primary algorithms:
     - **Semantic Distance (`calculate_distance_embed`)**: Generates 512-dimensional embeddings via Hugging Face Models and computes L2 (Euclidean) distance (`np.linalg.norm`).
     - **Keyword Matching (`calculate_distance_common_words`)**: Scores messages based on case-insensitive token set intersections.
     - **Weighted Combination (`calculate_distance_both`)**: Blends semantic vector distance with syntactic keyword counts to offer a robust hybrid search score.
  3. **Transformer Embedding Processor (`embedding_calculator.py`)**: Integrates Hugging Face `transformers` (`AutoModel` and `AutoTokenizer`). It features CUDA support for GPU acceleration and runs dynamically batched sentence embedding inferences using mean pooling of the last hidden states.
  4. **Experimental Attention Weighting**: Implements a highly advanced similarity method (`find_common_tokens_with_attention`) that extracts query and key weight matrices (`self.model.encoder.layer[0].attention.self.query` / `key`) directly from the first encoder layer to compute token-level relevance scores.
  5. **Performance Profiling & Optimization Benchmarks**:
     - Includes a custom-built execution timing engine (`profiling.py`) to monitor latency across API queries, tokenization, and model inference loops.
     - Features an active research and benchmarking suite (`test_research_improve_speed_and_performance.py`) evaluating various speed optimizations, such as skipping late transformer encoder layers.
     - **Key Research Finding**: Benchmarks demonstrated that skipping encoder layers (up to 20 layers) degraded semantic search precision drastically without improving latency (and sometimes worsening it due to truncated PyTorch graph overhead), proving that the full-depth model is necessary for accurate vector representations.
description_fr: |
  Un **bot Discord en Python** spécialisé conçu pour récupérer, analyser et effectuer des recherches dans l'historique des salons de discussion Discord. Le bot permet aux utilisateurs d'exécuter des **requêtes hybrides** combinant des **embeddings de phrases** issus du deep learning avec des correspondances de mots-clés de type **chevauchement syntaxique**. Les utilisateurs peuvent facilement le déployer sur n'importe quel serveur pour retrouver des messages passés pertinents sur le plan contextuel, là où les recherches par mot-clé classiques échouent.

  ### Composants clés & Architecture :
  1. **Moteur du Bot Discord (`discord_bot.py`)** : Basé sur `discord.py` (`commands.Bot`), il écoute les salons des serveurs et détecte le préfixe de commande configuré (ex. `!`). Il intègre une pagination dynamique des messages via des flux asynchrones (`aiostream.stream`) pour récupérer les historiques de salons de manière fluide tout en respectant les permissions de lecture des utilisateurs.
  2. **Pipeline de Recherche Hybride (`distance_calculator.py`)** : Évalue la similarité selon trois algorithmes :
     - **Distance Sémantique (`calculate_distance_embed`)** : Calcule la distance L2 (euclidienne via `np.linalg.norm`) à partir d'embeddings générés par des transformers de Hugging Face.
     - **Recherche par Mots-clés (`calculate_distance_common_words`)** : Évalue le nombre de mots communs insensibles à la casse entre la requête et le message.
     - **Combinaison Hybride (`calculate_distance_both`)** : Mélange la distance vectorielle sémantique avec la fréquence des mots-clés syntaxiques pour proposer un score de pertinence hybride très robuste.
  3. **Processeur d'Embeddings par Transformer (`embedding_calculator.py`)** : Intègre `transformers` de Hugging Face (`AutoModel` et `AutoTokenizer`). Supporte l'accélération matérielle CUDA pour exécuter efficacement les inférences d'embeddings par lots (mean pooling sur le dernier état caché).
  4. **Pondération par Attention Expérimentale** : Propose une méthode de similarité avancée (`find_common_tokens_with_attention`) qui extrait les matrices d'attention query et key (`self.model.encoder.layer[0].attention.self.query` / `key`) de la première couche de l'encodeur pour évaluer la pertinence au niveau des tokens.
  5. **Profilage de Performance & Recherche sur l'Optimisation** :
     - Comprend un module de profilage sur mesure (`profiling.py`) mesurant précisément les temps d'exécution à chaque étape (tokenisation, inférence, requêtes API Discord).
     - Intègre un script complet de recherche et de benchmark de vitesse (`test_research_improve_speed_and_performance.py`) testant des stratégies de raccourcissement du modèle par omission de couches de l'encodeur.
     - **Résultat de recherche majeur** : Les benchmarks ont mis en évidence que l'omission de couches (jusqu'à 20 couches) dégrade l'exactitude sémantique de manière critique sans apporter de gain de temps d'inférence significatif (parfois même plus lent en raison de la désoptimisation du graphe PyTorch), prouvant ainsi qu'utiliser l'intégralité des couches du modèle est essentiel pour garantir la fidélité des vecteurs sémantiques.
