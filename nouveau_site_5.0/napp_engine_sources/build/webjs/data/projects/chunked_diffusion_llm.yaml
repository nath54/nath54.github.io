description_en: "Chunked Diffusion LLM is an experimental PyTorch-based machine learning project aiming to revolutionize long-context management and generation capabilities in large language models. The project proposes a novel hybrid architecture integrating three distinct innovations:\n\n1. **Intelligent Chunking System**: Splitting input text into cohesive chunks managed with both localized, high-resolution context and a global, summarized context. When processing within a specific chunk, the model sees a compressed representation of the other chunks to keep active memory requirements small.\n2. **Permission-based Attention Control**: Implementing custom permission masks concatenated directly into the hidden state embedding space. The model remains aware of what each token space represents (system prompt, read-only document, chunk inside read-and-write, etc.) to enforce strict and fine-grained attention boundaries at the hardware/attention level.\n3. **Textual Diffusion**: Moving beyond standard autoregressive generation by performing textual diffusion denoising directly within the hidden state embedding space.\n\nThe training pipeline is structured as a comprehensive 6-stage process ranging from initial representation alignment (SFT encoding) and embedding-level diffusion training, up to next-word prediction and RLHF. Although the project has been officially paused ('Aborted') due to the sheer scale of the engineering requirements for a single developer, it stands as an exceptional showcase of deep learning research, architectural exploration, and customization of the attention layers in standard transformer models (such as Qwen, Llama, and Mistral)."
description_fr: "Chunked Diffusion LLM est un projet expérimental d'apprentissage automatique basé sur PyTorch, visant à révolutionner la gestion des longs contextes et les capacités de génération des grands modèles de langage. Le projet propose une nouvelle architecture hybride intégrant trois innovations majeures :\n\n1. **Système de fragmentation intelligent (Chunking)** : Découpage du texte d'entrée en fragments gérés à la fois avec un contexte local haute résolution et un contexte global résumé. Lors du traitement d'un fragment spécifique, le modèle ne voit qu'une représentation compressée des autres fragments afin de limiter l'empreinte mémoire active.\n2. **Contrôle d'attention basé sur des permissions** : Implémentation de masques de permissions personnalisés concaténés directement dans l'espace d'encodage de l'état caché (hidden state). Le modèle sait ce que chaque espace de jeton représente (invite système, document en lecture seule, fragment en lecture-écriture, etc.) afin d'imposer des limites strictes et granulaires au niveau de l'attention.\n3. **Diffusion textuelle** : Dépassement de la génération autorégressive classique en effectuant des étapes de diffusion et de débruitage directement au sein de l'espace d'encodage des états cachés.\n\nLe pipeline d'entraînement est structuré en un processus complet de 6 étapes, allant de l'alignement initial des représentations (encodage SFT) et de l'entraînement à la diffusion au niveau de l'encodage, jusqu'à la prédiction du mot suivant et à l'apprentissage par renforcement (RLHF). Bien que le projet ait été officiellement suspendu ('Aborted') en raison de l'ampleur des besoins d'ingénierie pour un seul développeur, il constitue une démonstration exceptionnelle de recherche en deep learning, d'exploration architecturale et de personnalisation des couches d'attention dans des modèles de transformeurs standards (tels que Qwen, Llama et Mistral)."
