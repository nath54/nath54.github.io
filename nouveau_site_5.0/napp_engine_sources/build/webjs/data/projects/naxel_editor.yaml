description_en: |
  Naxel Editor is a sophisticated, browser-based 3D voxel modeling and rendering ecosystem designed to maximize creative expressivity while maintaining incredibly compact, highly optimized file sizes. At the heart of the system is the **Naxel JSON specification**, a custom data format that supports high-level procedural primitives (such as spheres, cylinders, lines, rectangles, and polygons), advanced multi-stop color gradients, and color zones.

  The ecosystem consists of three core components:
  1. **Naxel Editor Webpage**: A static, fully serverless web application that enables users to import, edit, visualize, and export Naxel objects directly in the browser. It features a responsive layout with a 3D viewport, a custom palette system, and a 2D slice editor with isometric previews and adjustable ghost layers for seamless workflow efficiency.
  2. **JavaScript Library (`lib_naxel`)**: A lightweight, self-contained rendering engine designed to dynamically parse and render interactive 3D Naxel objects within any HTML page—perfect for static sites and portfolios (like GitHub Pages).
  3. **Python Renderer**: A backend script capable of generating high-fidelity static images and animated GIFs from Naxel configurations.

  The editor features a custom **Simple Diffusion** lighting algorithm where light behaves as an additive, multi-channel (RGB) multiplier that propagates through empty space and is blocked by opaque voxels, achieving realistic light propagation and soft shadows without heavy GPU requirements.
description_fr: |
  Naxel Editor est un écosystème sophistiqué de modélisation et de rendu de voxels 3D dans le navigateur, conçu pour maximiser l'expressivité créative tout en conservant des fichiers extrêmement compacts et optimisés. Au cœur du système se trouve la **spécification JSON Naxel**, un format de données personnalisé qui prend en charge des primitives procédurales de haut niveau (telles que des sphères, des cylindres, des lignes, des rectangles et des polygones), des dégradés de couleurs complexes et des zones de couleur dynamiques.

  L'écosystème se compose de trois éléments principaux :
  1. **L'éditeur Naxel Web**: Une application web statique et sans serveur qui permet d'importer, d'éditer, de visualiser et d'exporter des objets Naxel directement dans le navigateur. Elle intègre un viewport 3D réactif, un système de palette personnalisée et un éditeur de tranches 2D avec prévisualisations isométriques et couches fantômes réglables.
  2. **La bibliothèque JavaScript (`lib_naxel`)**: Un moteur de rendu léger et autonome conçu pour analyser et afficher dynamiquement des objets Naxel 3D interactifs sur n'importe quelle page HTML, idéal pour les sites statiques et portfolios (comme GitHub Pages).
  3. **Le moteur de rendu Python**: Un script backend capable de générer des images statiques haute fidélité et des GIFs animés à partir des configurations Naxel.

  L'éditeur implémente un algorithme propriétaire de **diffusion simple de la lumière (Simple Diffusion)**, où la lumière se propage de manière additive dans les espaces vides et est bloquée par les voxels opaques, offrant des jeux de lumière réalistes et des ombres douces sans nécessiter de ressources GPU massives.
