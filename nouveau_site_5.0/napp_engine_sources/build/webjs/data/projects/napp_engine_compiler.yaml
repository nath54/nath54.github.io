    text_en: "The GPS locator always returns (0, 0). Perfect for avoiding git blame and bug reports."
    text_fr: "Le localisateur GPS renvoie toujours (0, 0). Parfait pour éviter le git blame et les rapports de bogues."
  - user: "CacheIsKing"
