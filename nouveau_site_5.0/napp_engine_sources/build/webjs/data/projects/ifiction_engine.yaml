description_en: "iFiction Engine is a complete, modular, and lightweight interactive fiction game engine built entirely in Python's standard library. It parses complex natural language command structures (like 'take key', 'put book in shelf with hands', or 'ask merchant about potion') using an intelligent custom tokenizer. The engine is powered by an event-driven scene execution framework that handles conditions, branch jumps, local/global variables, and custom actions. Additionally, a priority queue-based scheduler governs game-time progression and turns, allowing realistic schedules, NPC behaviors, and world ticks. World blueprints use a unified, fully serializable JSON format, meaning there is no functional difference between a game initialization file and a game save file."
description_fr: "iFiction Engine est un moteur de jeu de fiction interactive complet, modulaire et léger, entièrement développé en Python avec la bibliothèque standard. Il analyse des structures de commandes complexes en langage naturel (comme 'prendre clé', 'mettre livre dans étagère avec les mains' ou 'demander au marchand à propos de la potion') grâce à un analyseur syntaxique personnalisé. Le moteur repose sur un framework d'exécution de scènes piloté par événements, gérant les conditions, les sauts de branchement, les variables locales/globales et les actions personnalisées. De plus, un ordonnanceur basé sur une file d'attente à priorité régit la progression temporelle du jeu et les tours, permettant des comportements de PNJ et des événements d'arrière-plan réalistes. Les configurations de mondes utilisent un format JSON unifié et sérialisable, de sorte qu'il n'y a aucune différence fonctionnelle entre un fichier d'initialisation de jeu et une sauvegarde."
