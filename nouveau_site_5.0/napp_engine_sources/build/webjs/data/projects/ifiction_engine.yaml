name_en: "iFiction Engine"
name_fr: "iFiction Engine"
short_description_en: "A highly modular, event-driven, turn-based Interactive Fiction (text adventure) game engine in Python, featuring a custom natural language parser, time scheduling, and dynamic scripts."
short_description_fr: "Un moteur de fiction interactive (aventure textuelle) hautement modulaire, piloté par événements et au tour par tour en Python, avec un analyseur de langage naturel personnalisé."
