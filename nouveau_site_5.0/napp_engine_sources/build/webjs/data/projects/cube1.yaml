description_en: "Cube1 is a nostalgic 2D procedural arcade game developed in Python using the classic Tkinter interface. The core concept revolves around navigating a tiny white cube through an auto-generated maze towards a red target. The game features a unique maze generation algorithm: it performs a random walk of a configurable number of steps to define a valid path, and converts all unvisited areas of the screen into walls. Players can collect bonus brown points, but must be extremely cautious—touching walls costs a life, resets position, and subtracts points. Cube1 includes a visual difficulty mode: in 'Easy' mode, walls are colored in vibrant hues, while in 'Hard' mode, the wall colors intentionally blend with the dark background, the player, or the target to test your visual perception and memory. Fully compatible with both Python 2.x and Python 3.x."
description_fr: "Cube1 est un jeu d'arcade 2D rétro et procédural développé en Python avec l'interface classique Tkinter. Le concept consiste à guider un petit cube blanc à travers un labyrinthe auto-généré pour atteindre une cible rouge. Le jeu intègre un algorithme de génération unique : il simule une marche aléatoire d'un nombre de pas configurable pour tracer le chemin, transformant toutes les cases non visitées en murs. Les joueurs peuvent ramasser des bonus marron, mais doivent rester vigilants — toucher un mur coûte une vie, réinitialise la position et retire des points. Cube1 propose un système de difficulté de couleurs : en mode 'Facile', les murs ont des teintes vives, tandis qu'en mode 'Difficile', les couleurs des murs se confondent volontairement avec le fond sombre, le joueur ou la cible, mettant à l'épreuve vos réflexes et votre perception visuelle. Entièrement compatible avec Python 2.x et Python 3.x."
funny_comments:
