    text_fr: "J'ai perdu mes 5 vies en difficulté hardcore en 2 secondes parce que j'ai oublié de relâcher les flèches. Design visuel 10/10, les murs invisibles en mode difficile sont diaboliques !"
  - user: "TkinterEnthusiast"
    rating: 4
    text_en: "I accidentally clicked the hidden dark red square on the main menu, and my entire UI got deleted. 10/10, best canvas clear simulation I've ever experienced."
    text_fr: "J'ai accidentellement cliqué sur le carré rouge caché du menu principal, et toute mon interface a disparu. 10/10, meilleure simulation de nettoyage de canvas !"
  - user: "ColorBlindGamer"
    rating: 2
    text_en: "Played on 'Difficult' color mode. The walls were #101010, the background was #000000. I spent 40 minutes navigating a pitch-black screen. 100% psychological horror, 0% visibility."
    text_fr: "J'ai joué en mode de couleur 'Difficile'. Les murs étaient #101010, le fond était noir. J'ai passé 40 minutes à naviguer sur un écran noir. 100% horreur psychologique, 0% visibilité."
  - user: "Python2Survivor"
    rating: 5
    text_en: "The game literally called me 'nul' in French in the terminal when I ran out of lives. Hurt my feelings but it worked perfectly on my ancient Python 2.7 installation!"
    text_fr: "Le jeu m'a littéralement traité de 'nul' dans le terminal quand je n'avais plus de vies. Ça a blessé mes sentiments, mais ça a fonctionné à merveille sur mon vieux Python 2.7 !"
  - user: "BonusHunter"
    rating: 4
    text_en: "Spent three hours trying to collect all three brown squares on hardcore difficulty, only to die on the final red square because of my shaky finger. My keyboard is now in two pieces."
    text_fr: "J'ai passé trois heures à essayer de ramasser les trois carrés marron en difficulté hardcore, pour finalement mourir sur le dernier carré rouge à cause d'un doigt tremblant. Mon clavier est maintenant en deux morceaux."
  - user: "SpeedrunnerPro"
    rating: 5
    text_en: "The scoring algorithm is a mathematical masterpiece. It calculates step count, seconds, and path difficulty. I completed a 6000-step hardcore maze in 9 seconds and ascended to another plane of existence."
    text_fr: "L'algorithme de score est un chef-d'œuvre mathématique. Il calcule le nombre de pas, les secondes et la difficulté du chemin. J'ai fini un labyrinthe hardcore de 6000 pas en 9 secondes et j'ai transcendé."
  - user: "BabyModeEnjoyer"
