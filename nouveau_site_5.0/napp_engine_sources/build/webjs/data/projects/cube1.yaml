    text_en: "I only play on baby difficulty (10 steps). The path is literally a straight line. I still managed to hit a wall. Don't judge me, 5 stars."
    text_fr: "Je joue uniquement en difficulté 'baby' (10 pas). Le chemin est littéralement une ligne droite. J'ai quand même réussi à me prendre un mur. Ne me jugez pas, 5 étoiles."
  - user: "NoKeyboardRelease"
    rating: 3
    text_en: "The 'Astuces' section said: 'relachez le clavier pour eviter de perdre des vies betement'. I didn't listen. Spawned, died, spawned, died, game over in 0.8 seconds. Read the instructions, people!"
    text_fr: "La section 'Astuces' disait : 'relachéz le clavier pour éviter de perdre des vies bètement'. Je n'ai pas écouté. Apparu, mort, apparu, mort, game over en 0,8 seconde. Lisez les instructions !"
  - user: "RetroPurist"
