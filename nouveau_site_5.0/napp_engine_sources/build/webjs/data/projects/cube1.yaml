    text_en: "Thank goodness this uses raw Tkinter and not Pygame. No bloated external dependencies to install, just pure, unadulterated standard library power and extreme visual minimalism."
    text_fr: "Dieu merci, cela utilise du pur Tkinter et non Pygame. Pas de dépendances externes lourdes à installer, juste la puissance de la bibliothèque standard et un minimalisme visuel extrême."

