description_en: |
  **PyTorch ModelBlock Intermediate Layer Conversion** is a specialized, AST-driven compiler toolchain designed to extract, analyze, and execute PyTorch model architectures without requiring dynamic execution or tracing.

  Standard deep learning serialization and compilation toolchains (such as ONNX, TorchScript, or generic tracer-based export tools) capture the model as a flattened, static computation graph. While highly optimized for server-class GPUs, static graphs throw away the rich control flow (such as dynamic `for` loops, conditional `if/else` paths) and hierarchical modular structures (like sub-blocks or custom modules) originally defined in Python. This project bridges that gap by parsing the model's source code directly using Python's **Abstract Syntax Tree (AST)** parser.

  ### Core Architecture & Features:
  1. **AST-Based Extraction (`lib_extract_model_architecture.py`)**: By visiting AST nodes recursively within the model's class and `forward` method, the parser reconstructs the control flow and operations into a high-level **Intermediate Representation (IR)**.
  2. **Custom Intermediate Representation (`core/lib_impl/lib_classes.py`)**: Models are represented as structured, modular `Language_Model` instances consisting of `FlowControlInstructions`, algebraic/logical `Expressions`, and high-level `Layer` definitions.
  3. **Weight Linking Engine (`lib_weights_link.py`)**: Provides a mapper that links pre-trained weights from standard PyTorch `.pt` or state dictionary files directly to the corresponding layers within the extracted IR.
  4. **Pure Python Forward Interpreter (`core/lib_impl/lib_interpretor.py`)**: Features a modular simulation interpreter that allows developers to trace, debug, and execute the extracted IR step-by-step in pure Python, enabling immediate behavior validation.
  5. **Embedded C++ Target Design**: Designed from the ground up for low-power embedded deployment. The portable C++ operator interface (`core/cpp_modules/op_backend.h`) and tensor structure (`core/cpp_modules/tensor_header.h`) pave the way for cross-compiling the IR into tight, hardware-optimized C++ code targeting high-performance libraries like **CMSIS-NN** (for ARM Cortex-M microcontrollers) and **Fastor** (for compile-time optimized tensor math).
description_fr: |
  **PyTorch ModelBlock Intermediate Layer Conversion** est une chaîne d'outils de compilation spécialisée, pilotée par l'AST, conçue pour extraire, analyser et exécuter des architectures de modèles PyTorch sans nécessiter d'exécution dynamique ou de traçage.

  Les outils standards de sérialisation et de compilation en deep learning (tels qu'ONNX, TorchScript ou les exportateurs basés sur le traçage) capturent les modèles sous forme de graphes de calcul statiques et aplatis. Bien qu'efficaces pour les GPU de serveurs, ces graphes statiques sacrifient le flux de contrôle riche (comme les boucles `for` dynamiques, les conditions `if/else`) et les structures hiérarchiques (comme les sous-blocs ou les modules personnalisés) définis en Python. Ce projet comble ce fossé en analysant directement le code source du modèle à l'aide de l'**arbre de syntaxe abstraite (AST)** de Python.

  ### Architecture et Fonctionnalités Clés :
  1. **Extraction basée sur l'AST (`lib_extract_model_architecture.py`)** : En visitant de manière récursive les nœuds de l'AST dans la classe et la méthode `forward` du modèle, l'extracteur reconstruit la logique algorithmique sous forme d'une **représentation intermédiaire (IR)** de haut niveau.
  2. **Représentation Intermédiaire Personnalisée (`core/lib_impl/lib_classes.py`)** : Les modèles sont traduits en instances de `Language_Model` structurées et modulaires, composées d'instructions de contrôle de flux (`FlowControlInstructions`), d'expressions algébriques (`Expressions`) et de couches neuronales (`Layer`).
  3. **Moteur de Liaison des Poids (`lib_weights_link.py`)** : Fournit un mécanisme robuste pour associer directement les poids pré-entraînés issus de fichiers PyTorch `.pt` standard aux couches de l'IR extraite.
  4. **Interpréteur Forward Pur Python (`core/lib_impl/lib_interpretor.py`)** : Propose un interpréteur de simulation permettant de tracer, déboguer et valider l'exécution de l'IR étape par étape en pur Python, garantissant une conformité comportementale parfaite par rapport au modèle d'origine.
  5. **Cible de Déploiement C++ Embarqué** : Conçu spécifiquement pour le déploiement sur cibles à faible consommation. L'interface d'opérateurs C++ portable (`core/cpp_modules/op_backend.h`) et les structures de tenseurs (`core/cpp_modules/tensor_header.h`) préparent la génération automatique de code C++ optimisé pour des microcontrôleurs via **CMSIS-NN** (ARM Cortex-M) ou pour des calculs tensoriels performants via **Fastor**.
