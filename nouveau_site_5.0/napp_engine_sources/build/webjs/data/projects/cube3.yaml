    text_en: "I spent two games mastering 2D grids only for the developer to add a Z-axis and make me realize I have zero spatial awareness. 11/10 depth perception is a lie."
    text_fr: "J'ai passé deux jeux à maîtriser les grilles 2D pour que le développeur ajoute un axe Z et me fasse réaliser que j'ai une perception spatiale de zéro. 11/10 la profondeur est un mensonge."
  - user: "SuperSaiyanSquare"
    rating: 5
    text_en: "Unlocked the 'ssj' skin, turned the glow intensity to maximum, and literally blinded myself in real life. My living room now shines brighter than the sun."
    text_fr: "J'ai débloqué le skin 'ssj', mis l'intensité du bloom au maximum, et je me suis littéralement aveuglé dans la vraie vie. Mon salon brille plus fort que le soleil."
  - user: "MinecraftMigrant"
    rating: 4
    text_en: "Equipped the Furnace skin and tried to smelt my iron ore. I fell into procedural lava instead. Very realistic, would bake again."
    text_fr: "J'ai équipé le skin Fourneau et j'ai essayé de faire fondre mon minerai de fer. À la place, je suis tombé dans de la lave procédurale. Très réaliste, je recuirais volontiers."
  - user: "ArrowBeliever"
