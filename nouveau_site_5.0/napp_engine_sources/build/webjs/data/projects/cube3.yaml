    text_en: "Easy mode: 'Just follow the giant arrow, buddy!' Hell mode: 'Figure it out yourself, you are now a blind pixel in a neon void.' I love the emotional roller coaster."
    text_fr: "Mode Facile : 'Suis juste la grosse flèche, mon pote !' Mode Enfer : 'Débrouille-toi tout seul, tu n'es qu'un pixel aveugle dans un vide de néons. J'adore l'ascenseur émotionnel."
  - user: "DiceyBusiness"
