description_en: "Cube3 is the third installment in the ultimate Cube platformer series, elevating the franchise to a glorious, neon-drenched 3D dimension. Built entirely in Godot Engine 3 using C# (Mono), Cube3 combines precision physics, dynamic platforming, and gorgeous retro-futuristic visuals. Take control of a custom 3D cube and navigate challenging environments across two distinct game modes: Adventure Mode, featuring handcrafted tutorial and story levels that test your reflexes, and Arcade Mode, utilizing advanced procedural generation to spawn endless custom mazes and platform structures on the fly. Players must reach the level portal without falling into the dark void below, managing their momentum and jumping across shifting spatial layouts. The game features a multi-perspective camera system, allowing players to instantly toggle between an immersive 3rd-person chase camera and a strategic top-down tactical view. Earn n-cubes as in-game currency by completing levels and survival challenges, and spend them in the skin shop to unlock over 16 unique cubic skins. Custom skins are divided into rarity tiers (Common, Rare, Epic, Legendary, Divine, Mythical), ranging from funny homages like a Minecraft-style 'Furnace' and 'Pumpkin', a glowing 'ssj' (Super Saiyan), a rollable 'Dice', to rare animated presets. Customize your experience with four demanding difficulty tiers—from Easy (featuring an automatic HUD arrow pointing to the exit) to Hell (where platforms shrink to a fraction of their size, jumping physics tighten, and no navigational guides exist). Backed by premium post-processing settings including bloom, saturation sliders, custom draw distances, and Screen Space Ambient Occlusion (SAO), Cube3 is a high-octane 3D challenge that pushes cubic platforming to its absolute peak."
description_fr: "Cube3 est le troisième volet de la célèbre série de jeux de plateforme Cube, élevant la franchise vers une glorieuse troisième dimension baignée de néons. Développé entièrement sous Godot Engine 3 en C# (Mono), Cube3 associe physique de précision, plateforme dynamique et graphismes rétro-futuristes saisissants. Prenez le contrôle d'un cube tridimensionnel et parcourez des environnements périlleux à travers deux modes de jeu majeurs : le Mode Aventure, avec ses tutoriels et ses niveaux narratifs faits main testant vos réflexes, et le Mode Arcade, s'appuyant sur une génération procédurale avancée pour concevoir des structures de plateformes et des labyrinthes 3D infinis à la volée. Les joueurs doivent atteindre le portail de fin sans basculer dans le vide abyssal en dessous, tout en gérant l'inertie et la hauteur des sauts. Le titre intègre un système de double caméra dynamique, permettant de commuter instantanément entre une vue à la troisième personne immersive et une vue tactique de dessus (top-down). Gagnez des n-cubes en terminant des niveaux et dépensez-les dans la boutique pour débloquer plus de 16 skins cubiques uniques. Les skins sont répartis en plusieurs catégories de rareté (Commun, Rare, Épique, Légendaire, Divin, Mythique), allant d'hommages amusants comme le 'Four' (Furnace) ou la 'Citrouille' (Pumpkin), un skin rayonnant 'ssj' (Super Saiyan), un dé à jouer fonctionnel ('de'), jusqu'à des modèles divins animés. Personnalisez votre défi grâce à quatre modes de difficulté — de Facile (avec une flèche directionnelle pointant vers la sortie) jusqu'à l'Enfer (où les plateformes rétrécissent drastiquement, les physiques de saut se durcissent et aucun guide n'est fourni). Sublimé par des réglages post-traitement de premier choix comprenant du bloom (glow), des filtres de saturation, une distance d'affichage ajustable et de l'occlusion ambiante (SAO), Cube3 est un défi 3D effréné qui repousse les limites de la plateforme géométrique."
funny_comments:
