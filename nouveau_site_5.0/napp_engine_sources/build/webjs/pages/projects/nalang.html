        <div class="app-page"><div class="component"><div class="row os-title-bar"><a icon="fas fa-arrow-left" data-langcode="fr" data-translation_en="Projects" data-translation_fr="Projets" href="../../pages/projects.html" class="link link-page os-btn-back to_translate" onclick="NApp.navigate(&#x27;../../pages/projects.html&#x27;); return false;" id="napp_gen_1"><span class="btn-icon" data-icon="fas fa-arrow-left"></span><span class="btn-text" data-translation_en="&quot;Projects&quot;" data-translation_fr="&quot;Projets&quot;">&quot;Projects&quot;</span></a><p class="text os-title">Projects - Nathan&#x27;s website</p><div class="row os-controls"><div class="os-btn-max"></div><div class="os-btn-min"></div><div class="os-btn-close"></div></div></div></div><div class="main-container"><div class="project-detail-page"><header class="product-header"><div class="header-main"><img src="../../res/icons/icon_project_nalang.png" class="icon product-icon-large" /><div class="header-info"><div data-translation_en="NaLang" data-translation_fr="NaLang" class="h1 product-title to_translate">NaLang</div><div class="p product-developer">Nathan Cerisara</div><div class="header-actions"><div id="napp_gen_2" class="napp-repeat-container"></div></div></div></div></header><div class="stat-group"><div class="stat-item"><div data-langcode="fr" data-translation_en="Importance" data-translation_fr="Importance" class="stat-label to_translate">Importance</div><div class="stat-value">4</div></div><div class="separator-v"></div><div class="stat-item"><div data-langcode="fr" data-translation_en="Category" data-translation_fr="Catégorie" class="stat-label to_translate">Category</div><div class="stat-value">Personal</div></div><div class="separator-v"></div><div class="stat-item"><div data-langcode="fr" data-translation_en="Version" data-translation_fr="Version" class="stat-label to_translate">Version</div><div class="stat-value">0.9.4.4</div></div><div class="separator-v"></div><div class="stat-item"><div data-langcode="fr" data-translation_en="Size" data-translation_fr="Taille" class="stat-label to_translate">Size</div><div class="stat-value">71.7 MB</div></div></div><section class="section gallery-section"><div data-langcode="fr" data-translation_en="Gallery" data-translation_fr="Galerie" class="h2 section-title to_translate">Gallery</div><div class="image-carousel"><div id="napp_gen_3" class="napp-repeat-container"></div></div></section><hr class="separator-h" /><section class="section description-section"><div data-langcode="fr" data-translation_en="About" data-translation_fr="À propos" class="h2 section-title to_translate">About</div><div class="description-content"><div data-langcode="fr" data-translation_en="&lt;p&gt;NaLang is a professional, feature-rich multi-language learning dashboard built on Godot 4.2. Designed to facilitate language acquisition through structured lessons, active recall flashcards, and interactive testing, it offers a comprehensive system for learners. The app features structured lesson pages with rich BBCode-formatted layouts for grammar, pronunciation, and conjugation; customizable vocabulary flashcards (fiches) that users can create, edit, and organize locally; a dual-mode testing engine offering either visual flashcard reviews or written answers; an advanced evaluation algorithm employing a custom Levenshtein distance check with Unicode-aware text normalization; and multi-lingual conversation guides for real-world scenarios. Supported target languages include Spanish, English, German, Mandarin Chinese, Japanese, Korean, and Russian.&lt;/p&gt;" data-translation_fr="&lt;p&gt;NaLang est un tableau de bord complet et professionnel d&#x27;apprentissage multi-langues conçu sous Godot 4.2. Pensé pour faciliter l&#x27;apprentissage par le biais de leçons structurées, de flashcards à rappel actif et d&#x27;exercices interactifs, l&#x27;application propose un système extrêmement robuste. Elle intègre des fiches de cours structurées avec un rendu BBCode riche pour la grammaire, la prononciation et la conjugaison ; des fiches de vocabulaire personnalisables (fiches) que les utilisateurs peuvent créer, éditer et organiser localement ; un moteur de quiz double proposant des révisions visuelles de cartes ou des réponses écrites ; un algorithme d&#x27;évaluation avancé utilisant la distance de Levenshtein avec normalisation de texte pour tolérer les fautes de frappe mineures ; et des guides de conversation parallèles multi-langues pour des situations réelles. Les langues cibles prises en charge incluent l&#x27;espagnol, l&#x27;anglais, l&#x27;allemand, le chinois mandarin, le japonais, le coréen et le russe.&lt;/p&gt;" class="long-description markdown-render to_translate" id="napp_gen_4"></div></div><div class="tags-list"><div id="napp_gen_5" class="napp-repeat-container"></div></div></section><hr class="separator-h" /><section class="reviews-section"><div class="reviews-header"><div data-langcode="fr" data-translation_en="Ratings &amp; Reviews" data-translation_fr="Notes et avis" class="h2 section-title to_translate">Ratings &amp; Reviews</div><div data-langcode="fr" data-translation_en="See All" data-translation_fr="Tout afficher" class="see-all to_translate">See All</div></div><div class="comments-grid"><div id="napp_gen_6" class="napp-repeat-container"></div></div></section></div></div></div>

    <script>
        window.addEventListener('DOMContentLoaded', () => {

            NApp.init({"state": {"current_page": "nalang", "language": "en", "app_theme": "light"}, "data": {"about_me": {"My_Hobbies.md": {"title_en": "My Hobbies", "title_fr": "Mes Hobbies", "sections": [{"sub_title_en": "Board games and Game of Roles", "content_en": "<p>I like playing board games and game of roles with my friends and my family.</p>\n<p>Example of board games I like:</p>\n<h3><strong>Classic and Traditional Card Games</strong></h3>\n<p>Traditional trick-taking and betting games played with standard decks.</p>\n<ul>\n<li>Examples:<ul>\n<li>Belote</li>\n<li>Tarot</li>\n<li>Poker</li>\n</ul>\n</li>\n</ul>\n<h3><strong>Fast-Paced Deck and Hand Management</strong></h3>\n<p>Modern card games focused on card combinations, set collection, and hand clearing.</p>\n<ul>\n<li>Examples:<ul>\n<li>Gang of 4</li>\n<li>President</li>\n<li>7 Yokai</li>\n</ul>\n</li>\n</ul>\n<h3><strong>Social Deduction and Communication</strong></h3>\n<p>Games centered on word association, hidden information, and collective interpretation.</p>\n<ul>\n<li>Examples:<ul>\n<li>Codenames</li>\n<li>Dixit</li>\n<li>Blanc Manger Coco</li>\n<li>Danny</li>\n</ul>\n</li>\n</ul>\n<h3><strong>Tactical Engine Building</strong></h3>\n<p>Resource management games where players optimize actions to build an efficient scoring system.</p>\n<ul>\n<li>Examples:<ul>\n<li>Azul</li>\n<li>Splendor</li>\n<li>Rebirth</li>\n</ul>\n</li>\n</ul>\n<h3><strong>Tile-Laying and Territorial Expansion</strong></h3>\n<p>Strategic placement games focused on building landscapes and claiming space on a shared board.</p>\n<ul>\n<li>Examples:<ul>\n<li>Carcassonne</li>\n<li>Kingdomino</li>\n</ul>\n</li>\n</ul>\n<h3><strong>Area Control and Strategy</strong></h3>\n<p>Macro-strategy games involving territorial dominance, resource competition, and conflict management.</p>\n<ul>\n<li>Examples:<ul>\n<li>Risk</li>\n<li>Scythe</li>\n</ul>\n</li>\n</ul>\n<h3><strong>Cooperative and Puzzle Solving</strong></h3>\n<p>Team-based or logic-driven games centered on shared objectives and mechanical problem-solving.</p>\n<ul>\n<li>Examples:<ul>\n<li>The Gang</li>\n<li>Take Time</li>\n</ul>\n</li>\n</ul>\n<h3><strong>Competitive Duel and Confrontation</strong></h3>\n<p>Strictly 1v1 formats featuring hidden movement, tactical positioning, or collectible deck building.</p>\n<ul>\n<li>Examples:<ul>\n<li>Tag Team</li>\n<li>Zenith</li>\n<li>Stratego</li>\n<li>Magic: The Gathering</li>\n</ul>\n</li>\n</ul>", "sub_title_fr": "Jeux de soci\u00e9t\u00e9 et jeux de r\u00f4les", "content_fr": "<p>J'aime jouer \u00e0 des jeux de soci\u00e9t\u00e9 et des jeux de r\u00f4les avec mes amis et ma famille.</p>\n<p>Voici des exemples de jeux de soci\u00e9t\u00e9 que j'aime bien :</p>\n<h3><strong>Jeux de cartes classiques et traditionnels</strong></h3>\n<p>Jeux de plis et de paris traditionnels jou\u00e9s avec des jeux de cartes standards.</p>\n<ul>\n<li>Exemples :<ul>\n<li>Belote</li>\n<li>Tarot</li>\n<li>Poker</li>\n</ul>\n</li>\n</ul>\n<h3><strong>Jeux de cartes modernes rapides</strong></h3>\n<p>Jeux de cartes modernes ax\u00e9s sur la combinaison de cartes, la collection de sets et le vidage de main.</p>\n<ul>\n<li>Exemples :<ul>\n<li>Gang of 4</li>\n<li>Pr\u00e9sident</li>\n<li>7 Yokai</li>\n</ul>\n</li>\n</ul>\n<h3><strong>Jeux de d\u00e9duction sociale et de communication</strong></h3>\n<p>Jeux centr\u00e9s sur l'association de mots, l'information cach\u00e9e et l'interpr\u00e9tation collective.</p>\n<ul>\n<li>Exemples :<ul>\n<li>Codenames</li>\n<li>Dixit</li>\n<li>Blanc Manger Coco</li>\n<li>Danny</li>\n</ul>\n</li>\n</ul>\n<h3><strong>Jeux de construction de moteur tactique</strong></h3>\n<p>Jeux de gestion de ressources o\u00f9 les joueurs optimisent les actions pour construire un syst\u00e8me de score efficace.</p>\n<ul>\n<li>Exemples :<ul>\n<li>Azul</li>\n<li>Splendor</li>\n<li>Rebirth</li>\n</ul>\n</li>\n</ul>\n<h3><strong>Jeux de placement de tuiles et d'expansion territoriale</strong></h3>\n<p>Jeux de placement strat\u00e9gique ax\u00e9s sur la construction de paysages et la revendication d'espace sur un plateau partag\u00e9.</p>\n<ul>\n<li>Exemples :<ul>\n<li>Carcassonne</li>\n<li>Kingdomino</li>\n</ul>\n</li>\n</ul>\n<h3><strong>Jeux de contr\u00f4le de zone et de strat\u00e9gie</strong></h3>\n<p>Jeux de macro-strat\u00e9gie impliquant la domination territoriale, la comp\u00e9tition pour les ressources et la gestion des conflits.</p>\n<ul>\n<li>Exemples :<ul>\n<li>Risk</li>\n<li>Scythe</li>\n</ul>\n</li>\n</ul>\n<h3><strong>Jeux coop\u00e9ratifs et de r\u00e9solution de probl\u00e8mes</strong></h3>\n<p>Jeux d'\u00e9quipe ou bas\u00e9s sur la logique, centr\u00e9s sur des objectifs communs et la r\u00e9solution de probl\u00e8mes m\u00e9caniques.</p>\n<ul>\n<li>Exemples :<ul>\n<li>The Gang</li>\n<li>Take Time</li>\n</ul>\n</li>\n</ul>\n<h3><strong>Jeux comp\u00e9titifs et de confrontation</strong></h3>\n<p>Formats strictement 1v1 mettant en sc\u00e8ne des mouvements cach\u00e9s, un positionnement tactique ou la construction de decks \u00e0 collectionner.</p>\n<ul>\n<li>Exemples :<ul>\n<li>Tag Team</li>\n<li>Zenith</li>\n<li>Stratego</li>\n<li>Magic: The Gathering</li>\n</ul>\n</li>\n</ul>"}, {"sub_title_en": "Sports", "content_en": "<p>I love playing and watching some sports, especially:</p>\n<h3><strong>Basket-ball</strong>:</h3>\n<p>I practiced in club, and now regularly outdoor, and I like following the NBA.</p>\n<h3><strong>Volley-ball</strong>:</h3>\n<p>I practiced, especially when I was in CPGE.</p>\n<h3><strong>Cycling</strong>:</h3>\n<p>I like doing bike, and following the Tour de France, Paris-Nice, La Vuelta, Le Giro, Les classiques...</p>", "sub_title_fr": "Sports", "content_fr": "<p>J'aime jouer et regarder certains sports, en particulier :</p>\n<h3><strong>Basket-ball</strong>:</h3>\n<p>J'ai pratiqu\u00e9 en club, et maintenant r\u00e9guli\u00e8rement en ext\u00e9rieur, et j'aime suivre la NBA.</p>\n<h3><strong>Volley-ball</strong>:</h3>\n<p>J'ai pratiqu\u00e9, surtout quand j'\u00e9tais en CPGE.</p>\n<h3><strong>Cyclisme</strong>:</h3>\n<p>J'aime faire du v\u00e9lo, et suivre le Tour de France, Paris-Nice, La Vuelta, Le Giro, Les classiques...</p>"}, {"sub_title_en": "Computer Science and Development", "content_en": "<p>I started programming when I was very young, and started with Python and basic web development (HTML, CSS, JS).\nI started trying to programming my own video-games, and created random websites, until I did more serious projects during my studies.</p>", "sub_title_fr": "Informatique et d\u00e9veloppement", "content_fr": "<p>J'ai commenc\u00e9 \u00e0 programmer quand j'\u00e9tais tr\u00e8s jeune, et j'ai commenc\u00e9 avec Python et le d\u00e9veloppement web de base (HTML, CSS, JS).\nJ'ai commenc\u00e9 \u00e0 essayer de programmer mes propres jeux vid\u00e9o, et j'ai cr\u00e9\u00e9 des sites web al\u00e9atoires, jusqu'\u00e0 ce que je fasse des projets plus s\u00e9rieux pendant mes \u00e9tudes.</p>"}, {"sub_title_en": "Creation and Art", "content_en": "<p>I like creating and making art. I like drawing, and I like making music (writing lyrics or composing music).\nI also like writing stories, poems, and novels.\nI also like making 3d renderings, pixel/voxel art, and other forms of digital art.</p>", "sub_title_fr": "Cr\u00e9ativit\u00e9 et art", "content_fr": "<p>J'aime cr\u00e9er et faire de l'art. J'aime dessiner, et j'aime faire de la musique (\u00e9crire des paroles ou composer de la musique).\nJ'aime aussi \u00e9crire des histoires, des po\u00e8mes et des romans.\nJ'aime aussi faire des rendus 3D, du pixel/voxel art, et d'autres formes d'art num\u00e9rique.</p>"}, {"sub_title_en": "Listening Music", "content_en": "<h3><strong>Dark Folk / Ethereal Pop</strong></h3>\n<p>Atmospheric music utilizing organic instrumentation, unique vocal timbres, and narrative-focused lyrics.</p>\n<ul>\n<li><strong>Key Artists</strong>:<ul>\n<li>AURORA <a href=\"https://music.youtube.com/channel/UCNjHgaLpdy1IMNK57pYiKiQ\"><i class=\"fa-brands fa-youtube\"></i></a> <a href=\"https://open.spotify.com/intl-fr/artist/1WgXqy2Dd70QQOU7Ay074N\"><i class=\"fa-brands fa-spotify\"></i></a></li>\n<li>Wardruna <a href=\"https://music.youtube.com/channel/UCoK2X3nnuG7ug-Kk75r5rJQ\"><i class=\"fa-brands fa-youtube\"></i></a> <a href=\"https://open.spotify.com/intl-fr/artist/0NJ6wlOAsAJ1PN4VRdTPKA\"><i class=\"fa-brands fa-spotify\"></i></a></li>\n<li>Kiki Rockwell <a href=\"https://music.youtube.com/channel/UCe1-VmcTA_819-tJb1Z3nKA\"><i class=\"fa-brands fa-youtube\"></i></a> <a href=\"https://open.spotify.com/intl-fr/artist/5HuKMWteBRI09tWyKeQE1F\"><i class=\"fa-brands fa-spotify\"></i></a></li>\n<li>East-Duo <a href=\"https://music.youtube.com/channel/UCxSP05H8BEdpu3Q0RYeGOrA\"><i class=\"fa-brands fa-youtube\"></i></a> <a href=\"https://open.spotify.com/intl-fr/artist/42v0kfdXXwjA3cLRr4DTyY\"><i class=\"fa-brands fa-spotify\"></i></a></li>\n<li>...</li>\n</ul>\n</li>\n<li><strong>Example Tracks</strong>:<ul>\n<li>AURORA - Running With The Wolves <a href=\"https://music.youtube.com/watch?v=06ht9MyJLT4\"><i class=\"fa-brands fa-youtube\"></i></a> <a href=\"https://open.spotify.com/intl-fr/track/6r6n5OmXkdsOxN2iCj5UE0\"><i class=\"fa-brands fa-spotify\"></i></a></li>\n<li>AURORA - Everything Matters <a href=\"https://music.youtube.com/watch?v=U0qHsWAZ4xU\"><i class=\"fa-brands fa-youtube\"></i></a> <a href=\"https://open.spotify.com/intl-fr/track/1rMlnD8S0hX7IHZXZDt3gH\"><i class=\"fa-brands fa-spotify\"></i></a></li>\n<li>...</li>\n</ul>\n</li>\n</ul>\n<h3><strong>Modern Dark Pop / Electropop</strong></h3>\n<p>High-fidelity pop featuring moody synths, atmospheric production, and non-traditional vocal styles.</p>\n<ul>\n<li><strong>Key Artists</strong>:<ul>\n<li>Billie Eilish <a href=\"https://music.youtube.com/channel/UCiGm_E4ZwYSHV3bcW1pnSeQ\"><i class=\"fa-brands fa-youtube\"></i></a> <a href=\"https://open.spotify.com/intl-fr/artist/6qqNVTkY8uBg9cP3Jd7DAH\"><i class=\"fa-brands fa-spotify\ yles <a href=\"https://music.youtube.com/channel/UCZFWPqqPkFlNwIxcpsLOwew\"><i class=\"fa-brands fa-youtube\"></i></a> <a href=\"https://open.spotify.com/intl-fr/artist/6KImCVD70vtIoJWnq6nGn3\"><i class=\"fa-brands fa-spotify\"></i></a></li>\n<li>Benson Boone <a href=\"https://music.youtube.com/channel/UCvILah8hAWYhYOmAG3ZjvBA\"><i class=\"fa-brands fa-youtube\"></i></a> <a href=\"https://open.spotify.com/intl-fr/artist/22wbnEMDvgVIAGdFeek6ET\"><i class=\"fa-brands fa-spotify\"></i></a></li>\n<li>...</li>\n</ul>\n</li>\n<li><strong>Example Tracks</strong>:<ul>\n<li>Alexander Stewart - all these years  <a href=\"https://music.youtube.com/watch?v=OdD-kpWW3ko\"><i class=\"fa-brands fa-youtube\"></i></a> <a href=\"https://open.spotify.com/intl-fr/track/0FtwNRIbtna2kdrOKUV5o2\"><i class=\"fa-brands fa-spotify\"></i></a></li>\n<li>Harry Styles - As It Was <a href=\"https://music.youtube.com/watch?v=nujn6wbr-e8\"><i class=\"fa-brands fa-youtube\"></i></a> <a href=\"https://open.spotify.com/intl-fr/track/4Dvkj6JhhA12EX05fT7y2e\"><i class=\"fa-brands fa-spotify\"></i></a></li>\n<li>...</li>\n</ul>\n</li>\n</ul>\n<h3><strong>Anthemic Alt-Rock / Gaming Tie-ins</strong></h3>\n<p>Large-scale rock production often used for competitive gaming events or narrative trailers.</p>\n<ul>\n<li><strong>Key Artists</strong>:<ul>\n<li>Imagine Dragons <a href=\"https://music.youtube.com/channel/UCT9zcQNlyht7fRlcjmflRSA\"><i class=\"fa-brands fa-youtube\"></i></a> <a href=\"https://open.spotify.com/intl-fr/artist/53XhwfbYqKCa1cC15pYq2q\"><i class=\"fa-brands fa-spotify\"></i></a></li>\n<li>Against the Current <a href=\"https://music.youtube.com/channel/UCxMsgwldMZiuFTD6jjv32yQ\"><i class=\"fa-brands fa-youtube\"></i></a> <a href=\"https://open.spotify.com/intl-fr/artist/6yhD1KjhLxIETFF7vIRf8B\"><i class=\"fa-brands fa-spotify\"></i></a></li>\n<li>...</li>\n</ul>\n</li>\n<li><strong>Example Tracks</strong>:<ul>\n<li>Imagine Dragons - Enemy <a href=\"https://music.youtube.com/watch?v=D9G1VOjN_8 e reading webtoons.</p>\n<p>Here are some of my favorites:</p>\n<ul>\n<li>\n<p><strong>Classical shonen:</strong></p>\n<ul>\n<li>Hunter X Hunter</li>\n<li>Dragon Ball</li>\n</ul>\n</li>\n<li>\n<p><strong>Dark Fantasy / seinen:</strong></p>\n<ul>\n<li>Vinland Saga</li>\n<li>Berserk</li>\n<li>Tokyo Ghoul</li>\n<li>Fate Series</li>\n</ul>\n</li>\n<li>\n<p><strong>System Fantasy / Isekai:</strong></p>\n<ul>\n<li>Solo Leveling</li>\n<li>Re:Zero</li>\n<li>The Beginning After the End</li>\n<li>The Rising of the Shield Hero</li>\n</ul>\n</li>\n<li>\n<p><strong>Contemplative Fantasy:</strong></p>\n<ul>\n<li>Frieren</li>\n</ul>\n</li>\n<li>\n<p><strong>Strategic Thriller:</strong></p>\n<ul>\n<li>Death Note</li>\n<li>Code Geass</li>\n<li>Psycho-Pass</li>\n</ul>\n</li>\n<li>\n<p><strong>Psychological:</strong></p>\n<ul>\n<li>Orb: On the Movements of the Earth</li>\n<li>To your eternity</li>\n<li>The Darwin Incident</li>\n<li>Lazarus</li>\n<li>Oshi No Ko</li>\n<li>Promised Neverland</li>\n<li>Parasyte</li>\n<li>Guilty Crown</li>\n</ul>\n</li>\n<li>\n<p><strong>Music:</strong></p>\n<ul>\n<li>Beck</li>\n<li>Bocchi the Rock!</li>\n<li>Nana</li>\n<li>Blue Orchestra</li>\n<li>Carole and Tuesday</li>\n<li>Your Lie in April</li>\n<li>KPop Demon Hunter</li>\n</ul>\n</li>\n<li>\n<p><strong>Sport:</strong></p>\n<ul>\n<li>Kuroko no basket</li>\n<li>Slam Dunk</li>\n<li>Haikyu!!</li>\n<li>Blue Lock</li>\n</ul>\n</li>\n<li>\n<p><strong>Romance:</strong></p>\n<ul>\n<li>Kaguya-sama: Love is War</li>\n<li>Golden Time</li>\n<li>Blue Box</li>\n</ul>\n</li>\n<li>\n<p><strong>Sci-fi:</strong></p>\n<ul>\n<li>Cyberpunk: Edgerunners</li>\n</ul>\n</li>\n</ul>", "sub_title_fr": "Manga / Animes / Webtoons", "content_fr": "<p>J'aime lire des mangas et regarder des animes. J'aime aussi lire des webtoons.</p>\n<p>Voici quelques-uns de mes pr\u00e9f\u00e9r\u00e9s:</p>\n<ul>\n<li>\n<p><strong>Shonen classique:</strong></p>\n<ul>\n<li>Hunter X Hunter</li>\n<li>Dragon Ball</li>\n</ul>\n</li>\n<li>\n<p><strong>Fa b</em></li>\n</ul>\n<p>My to-read pile is currently composed of:</p>\n<ul>\n<li><em>The Dark Tower - Stephen King (ep1 - The Gunslinger)</em></li>\n<li><em>The Hitchhiker's Guide to the Galaxy - Douglas Adams</em></li>\n<li><em>The wandering inn - Pirateaba</em></li>\n</ul>", "sub_title_fr": "Lecture de livres", "content_fr": "<p>J'aime lire des livres.</p>\n<p>Voici quelques-uns de mes pr\u00e9f\u00e9r\u00e9s:</p>\n<ul>\n<li><em>Les Hauts-Conteurs - Olivier Peru and Patrick McSpare</em></li>\n<li><em>Blood song - Anthony Ryan</em></li>\n<li><em>The Witcher - Andrzej Sapkowski</em></li>\n<li><em>Foundation - Isaac Asimov</em></li>\n<li><em>Misery - Stephen King</em></li>\n</ul>\n<p>Je suis actuellement en train de lire:</p>\n<ul>\n<li><em>La guilde des ombres - Anna Triss</em></li>\n<li><em>L'assassin royal - Robin Hobb</em></li>\n</ul>\n<p>Ma pile de livres \u00e0 lire est actuellement compos\u00e9e de:</p>\n<ul>\n<li><em>La tour sombre - Stephen King (ep1 - le pistolero)</em></li>\n<li><em>H2G2 - Douglas Adams</em></li>\n<li><em>The wandering inn - Pirateaba</em></li>\n</ul>"}, {"sub_title_en": "Watching Series / Movies", "content_en": "<p>I like watching series and movies. Here are some of my favorites:</p>\n<h3><strong>Series:</strong></h3>\n<ul>\n<li><em>The good place - Michael Schur</em></li>\n<li><em>Mercredi (Wednesday) - Tim Burton</em></li>\n<li><em>The walking dead - Frank Darabont</em></li>\n<li><em>Doctor Who</em></li>\n<li><em>Kaamelott - Alexandre Astier</em></li>\n<li><em>Squid Game - Hwang Dong-hyeok</em></li>\n<li><em>Hot Shot (\u7c43\u7403\u706b) (2008) - Lin He Long</em></li>\n</ul>\n<h3><strong>C-dramas:</strong></h3>\n<ul>\n<li><em>Always Home - Zhang Xiao An</em></li>\n<li><em>When I fly towards you - Mao Deshu</em></li>\n<li><em>Our generation - Zhang Kaizhou</em></li>\n<li><em>Summit of Youth - Cai Cong</em></li>\n</ul>\n<h3><strong>K-dramas:</strong></h3>\n<ul>\n<li><em>Doctors - Oh Choong-hwan</em></li>\n<li><em>Resident Playbook - Lee Min-soo</em></li>\n<li><em>I am not a robot - Jung Dae-yoon</em></li>\n</ul>\n<h3><strong>Movies:</strong></h3>\n<ul>\n<li><em>Matrix - Lana and Lilly Wachowski</em></li>\n<li><em>Men in Black - Barry Sonnenfeld</em></li>\n<li><em>Interstellar - Christopher Nolan</em></li>\n<li><em>The Fugitives / The Goat - Francis Veber</em></li>\n<li><em>OSS 117 - Michel Hazanavicius</em></li>\n<li><em>Planet of the Apes - Tim Burton</em></li>\n<li><em>Vertigo - Alfred Hitchcock</em></li>\n<li><em>The Wave - Dennis Gansel</em></li>\n<li><em>Persepolis - Marjane Satrapi and Vincent Paronnaud</em></li>\n<li><em>Wolf Children - Mamoru Hosoda</em></li>\n<li><em>My Neighbor Totoro - Hayao Miyazaki</em></li>\n<li><em>Kiki's Delivery Service - Hayao Miyazaki</em></li>\n<li><em>Howl's Moving Castle - Hayao Miyazaki</em></li>\n<li><em>Your Name - Makoto Shinkai</em></li>\n<li><em>The Girl Who Leapt Through Time - Mamoru Hosoda</em></li>\n</ul>", "sub_title_fr": "S\u00e9ries et films que j'ai aim\u00e9s", "content_fr": "<p>J'aime regarder des s\u00e9ries et des films. Voici quelques-uns de mes pr\u00e9f\u00e9r\u00e9s:</p>\n<h3><strong>S\u00e9ries:</strong></h3>\n<ul>\n<li><em>The good place - Michael Schur</em></li>\n<li><em>Mercredi (Wednesday) - Tim Burton</em></li>\n<li><em>The walking dead - Frank Darabont</em></li>\n<li><em>Doctor Who</em></li>\n<li><em>Kaamelott - Alexandre Astier</em></li>\n<li><em>Squid Game - Hwang Dong-hyeok</em></li>\n<li><em>Hot Shot (\u7c43\u7403\u706b) (2008) - Lin He Long</em></li>\n</ul>\n<h3><strong>C-dramas:</strong></h3>\n<ul>\n<li><em>Always Home - Zhang Xiao An</em></li>\n<li><em>When I fly towards you - Mao Deshu</em></li>\n<li><em>Our generation - Zhang Kaizhou</em></li>\n<li><em>Summit of Youth - Cai Cong</em></li>\n</ul>\n<h3><strong>K-dramas:</strong></h3>\n<ul>\n<li><em>Doctors - Oh Choong-hwan</em></li>\n<li><em>Resident Playbook - Lee Min-soo</em></li>\n<li><em>I am not a robot - Jung Dae-yoon</em></li>\n</ul>\n<h3><strong>Films:</strong></h3>\n<ul>\n<li><em>Matrix - Lana and Lilly Wachowski</em></li>\n<li><em>Men in Black - Barry Sonnenfeld</em></li>\n<li><em>Interstellar - Christopher Nolan</em></li>\n<li><em>Les fugitifs / La ch\u00e8vre - Francis Veber</em></li>\n<li><em>OSS 117 - Michel Hazanavicius</em></li>\n<li><em>La plan\u00e8te des singes - Tim Burton</em></li>\n<li><em>Vertigo - Alfred Hitchcock</em></li>\n<li><em>La vague - Dennis Gansel</em></li>\n<li><em>Persepolis - Marjane Satrapi and Vincent Paronnaud</em></li>\n<li><em>Les enfants loups - Mamoru Hosoda</em></li>\n<li><em>Mon voisin totoro - Hayao Miyazaki</em></li>\n<li><em>Kiki la petite sorci\u00e8re - Hayao Miyazaki</em></li>\n<li><em>Le chateau ambulant - Hayao Miyazaki</em></li>\n<li><em>Your Name - Makoto Shinkai</em></li>\n<li><em>La travers\u00e9e du temps - Mamoru Hosoda</em></li>\n</ul>"}], "_source_file": "My_Hobbies", "_source_name": "My_Hobbies"}, "My_Hobbies": {"title_en": "My Hobbies", "title_fr": "Mes Hobbies", "sections": [{"sub_title_en": "Board games and Game of Roles", "content_en": "<p>I like playing board games and game of roles with my friends and my family.</p>\n<p>Example of board games I like:</p>\n<h3><strong>Classic and Traditional Card Games</strong></h3>\n<p>Traditional trick-taking and betting games played with standard decks.</p>\n<ul>\n<li>Examples:<ul>\n<li>Belote</li>\n<li>Tarot</li>\n<li>Poker</li>\n</ul>\n</li>\n</ul>\n<h3><strong>Fast-Paced Deck and Hand Management</strong></h3>\n<p>Modern card games focused on card combinations, set collection, and hand clearing.</p>\n<ul>\n<li>Examples:<ul>\n<li>Gang of 4</li>\n<li>President</li>\n<li>7 Yokai</li>\n</ul>\n</li>\n</ul>\n<h3><strong>Social Deduction and Communication</strong></h3>\n<p>Games centered on word association, hidden information, and collective interpretation.</p>\n<ul>\n<li>Examples:<ul>\n<li>Codenames</li>\n<li>Dixit</li>\n<li>Blanc Manger Coco</li>\n<li>Danny</li>\n</ul>\n</li>\n</ul>\n<h3><strong>Tactical Engine Building</strong></h3>\n<p>Resource management games where players optimize actions to build an efficient scoring system.</p>\n<ul>\n<li>Examples:<ul>\n<li>Azul</li>\n<li>Splendor</li>\n<li>Rebirth</li>\n</ul>\n</li>\n</ul>\n<h3><strong>Tile-Laying and Territorial Expansion</strong></h3>\n<p>Strategic placement games focused on building landscapes and claiming space on a shared board.</p>\n<ul>\n<li>Examples:<ul>\n<li>Carcassonne</li>\n<li>Kingdomino</li>\n</ul>\n</li>\n</ul>\n<h3><strong>Area Control and Strategy</strong></h3>\n<p>Macro-strategy games involving territorial dominance, resource competition, and conflict management.</p>\n<ul>\n<li>Examples:<ul>\n<li>Risk</li>\n<li>Scythe</li>\n</ul>\n</li>\n</ul>\n<h3><strong>Cooperative and Puzzle Solving</strong></h3>\n<p>Team-based or logic-driven games centered on shared objectives and mechanical problem-solving.</p>\n<ul>\n<li>Examples:<ul>\n<li>The Gang</li>\n<li>Take Time</li>\n</ul>\n</li>\n</ul>\n<h3><strong>Competitive Duel and Confrontation</strong></h3>\n<p>Strictly 1v1 formats featuring hidden movement, tactical positioning, or collectible deck building.</p>\n<ul>\n<li>Examples:<ul>\n<li>Tag Team</li>\n<li>Zenith</li>\n<li>Stratego</li>\n<li>Magic: The Gathering</li>\n</ul>\n</li>\n</ul>", "sub_title_fr": "Jeux de soci\u00e9t\u00e9 et jeux de r\u00f4les", "content_fr": "<p>J'aime jouer \u00e0 des jeux de soci\u00e9t\u00e9 et des jeux de r\u00f4les avec mes amis et ma famille.</p>\n<p>Voici des exemples de jeux de soci\u00e9t\u00e9 que j'aime bien :</p>\n<h3><strong>Jeux de cartes classiques et traditionnels</strong></h3>\n<p>Jeux de plis et de paris traditionnels jou\u00e9s avec des jeux de cartes standards.</p>\n<ul>\n<li>Exemples :<ul>\n<li>Belote</li>\n<li>Tarot</li>\n<li>Poker</li>\n</ul>\n</li>\n</ul>\n<h3><strong>Jeux de cartes modernes rapides</strong></h3>\n<p>Jeux de cartes modernes ax\u00e9s sur la combinaison de cartes, la collection de sets et le vidage de main.</p>\n<ul>\n<li>Exemples :<ul>\n<li>Gang of 4</li>\n<li>Pr\u00e9sident</li>\n<li>7 Yokai</li>\n</ul>\n</li>\n</ul>\n<h3><strong>Jeux de d\u00e9duction sociale et de communication</strong></h3>\n<p>Jeux centr\u00e9s sur l'association de mots, l'information cach\u00e9e et l'interpr\u00e9tation collective.</p>\n<ul>\n<li>Exemples :<ul>\n<li>Codenames</li>\n<li>Dixit</li>\n<li>Blanc Manger Coco</li>\n<li>Danny</li>\n</ul>\n</li>\n</ul>\n<h3><strong>Jeux de construction de moteur tactique</strong></h3>\n<p>Jeux de gestion de ressources o\u00f9 les joueurs optimisent les actions pour construire un syst\u00e8me de score efficace.</p>\n<ul>\n<li>Exemples :<ul>\n<li>Azul</li>\n<li>Splendor</li>\n<li>Rebirth</li>\n</ul>\n</li>\n</ul>\n<h3><strong>Jeux de placement de tuiles et d'expansion territoriale</strong></h3>\n<p>Jeux de placement strat\u00e9gique ax\u00e9s sur la construction de paysages et la revendication d'espace sur un plateau partag\u00e9.</p>\n<ul>\n<li>Exemples :<ul>\n<li>Carcassonne</li>\n<li>Kingdomino</li>\n</ul>\n</li>\n</ul>\n<h3><strong>Jeux de contr\u00f4le de zone et de strat\u00e9gie</strong></h3>\n<p>Jeux de macro-strat\u00e9gie impliquant la domination territoriale, la comp\u00e9tition pour les ressources et la gestion des conflits.</p>\n<ul>\n<li>Exemples :<ul>\n<li>Risk</li>\n<li>Scythe</li>\n</ul>\n</li>\n</ul>\n<h3><strong>Jeux coop\u00e9ratifs et de r\u00e9solution de probl\u00e8mes</strong></h3>\n<p>Jeux d'\u00e9quipe ou bas\u00e9s sur la logique, centr\u00e9s sur des objectifs communs et la r\u00e9solution de probl\u00e8mes m\u00e9caniques.</p>\n<ul>\n<li>Exemples :<ul>\n<li>The Gang</li>\n<li>Take Time</li>\n</ul>\n</li>\n</ul>\n<h3><strong>Jeux comp\u00e9titifs et de confrontation</strong></h3>\n<p>Formats strictement 1v1 mettant en sc\u00e8ne des mouvements cach\u00e9s, un positionnement tactique ou la construction de decks \u00e0 collectionner.</p>\n<ul>\n<li>Exemples :<ul>\n<li>Tag Team</li>\n<li>Zenith</li>\n<li>Stratego</li>\n<li>Magic: The Gathering</li>\n</ul>\n</li>\n</ul>"}, {"sub_title_en": "Sports", "content_en": "<p>I love playing and watching some sports, especially:</p>\n<h3><strong>Basket-ball</strong>:</h3>\n<p>I practiced in club, and now regularly outdoor, and I like following the NBA.</p>\n<h3><strong>Volley-ball</strong>:</h3>\n<p>I practiced, especially when I was in CPGE.</p>\n<h3><strong>Cycling</strong>:</h3>\n<p>I like doing bike, and following the Tour de France, Paris-Nice, La Vuelta, Le Giro, Les classiques...</p>", "sub_title_fr": "Sports", "content_fr": "<p>J'aime jouer et regarder certains sports, en particulier :</p>\n<h3><strong>Basket-ball</strong>:</h3>\n<p>J'ai pratiqu\u00e9 en club, et maintenant r\u00e9guli\u00e8rement en ext\u00e9rieur, et j'aime suivre la NBA.</p>\n<h3><strong>Volley-ball</strong>:</h3>\n<p>J'ai pratiqu\u00e9, surtout quand j'\u00e9tais en CPGE.</p>\n<h3><strong>Cyclisme</strong>:</h3>\n<p>J'aime faire du v\u00e9lo, et suivre le Tour de France, Paris-Nice, La Vuelta, Le Giro, Les classiques...</p>"}, {"sub_title_en": "Computer Science and Development", "content_en": "<p>I started programming when I was very young, and started with Python and basic web development (HTML, CSS, JS).\nI started trying to programming my own video-games, and created random websites, until I did more serious projects during my studies.</p>", "sub_title_fr": "Informatique et d\u00e9veloppement", "content_fr": "<p>J'ai commenc\u00e9 \u00e0 programmer quand j'\u00e9tais tr\u00e8s jeune, et j'ai commenc\u00e9 avec Python et le d\u00e9veloppement web de base (HTML, CSS, JS).\nJ'ai commenc\u00e9 \u00e0 essayer de programmer mes propres jeux vid\u00e9o, et j'ai cr\u00e9\u00e9 des sites web al\u00e9atoires, jusqu'\u00e0 ce que je fasse des projets plus s\u00e9rieux pendant mes \u00e9tudes.</p>"}, {"sub_title_en": "Creation and Art", "content_en": "<p>I like creating and making art. I like drawing, and I like making music (writing lyrics or composing music).\nI also like writing stories, poems, and novels.\nI also like making 3d renderings, pixel/voxel art, and other forms of digital art.</p>", "sub_title_fr": "Cr\u00e9ativit\u00e9 et art", "content_fr": "<p>J'aime cr\u00e9er et faire de l'art. J'aime dessiner, et j'aime faire de la musique (\u00e9crire des paroles ou composer de la musique).\nJ'aime aussi \u00e9crire des histoires, des po\u00e8mes et des romans.\nJ'aime aussi faire des rendus 3D, du pixel/voxel art, et d'autres formes d'art num\u00e9rique.</p>"}, {"sub_title_en": "Listening Music", "content_en": "<h3><strong>Dark Folk / Ethereal Pop</strong></h3>\n<p>Atmospheric music utilizing organic instrumentation, unique vocal timbres, and narrative-focused lyrics.</p>\n<ul>\n<li><strong>Key Artists</strong>:<ul>\n<li>AURORA <a href=\"https://music.youtube.com/channel/UCNjHgaLpdy1IMNK57pYiKiQ\"><i class=\"fa-brands fa-youtube\"></i></a> <a href=\"https://open.spotify.com/intl-fr/artist/1WgXqy2Dd70QQOU7Ay074N\"><i class=\"fa-brands fa-spotify\"></i></a></li>\n<li>Wardruna <a href=\"https://music.youtube.com/channel/UCoK2X3nnuG7ug-Kk75r5rJQ\"><i class=\"fa-brands fa-youtube\"></i></a> <a href=\"https://open.spotify.com/intl-fr/artist/0NJ6wlOAsAJ1PN4VRdTPKA\"><i class=\"fa-brands fa-spotify\"></i></a></li>\n<li>Kiki Rockwell <a href=\"https://music.youtube.com/channel/UCe1-VmcTA_819-tJb1Z3nKA\"><i class=\"fa-brands fa-youtube\"></i></a> <a href=\"https://open.spotify.com/intl-fr/artist/5HuKMWteBRI09tWyKeQE1F\"><i class=\"fa-brands fa-spotify\"></i></a></li>\n<li>East-Duo <a href=\"https://music.youtube.com/channel/UCxSP05H8BEdpu3Q0RYeGOrA\"><i class=\"fa-brands fa-youtube\"></i></a> <a href=\"https://open.spotify.com/intl-fr/artist/42v0kfdXXwjA3cLRr4DTyY\"><i class=\"fa-brands fa-spotify\"></i></a></li>\n<li>...</li>\n</ul>\n</li>\n<li><strong>Example Tracks</strong>:<ul>\n<li>AURORA - Running With The Wolves <a href=\"https://music.youtube.com/watch?v=06ht9MyJLT4\"><i class=\"fa-brands fa-youtube\"></i></a> <a href=\"https://open.spotify.com/intl-fr/track/6r6n5OmXkdsOxN2iCj5UE0\"><i class=\"f > <a href=\"https://open.spotify.com/intl-fr/track/38T0tPVZHcPZyhtOcCP7pF\"><i class=\"fa-brands fa-spotify\"></i></a></li>\n<li>...</li>\n</ul>\n</li>\n</ul>\n<h3><strong>Sad Emotional Pop</strong></h3>\n<ul>\n<li><strong>Key Artists</strong>:<ul>\n<li>Alexander Stewart <a href=\"https://music.youtube.com/channel/UCOnuUddDN2ssa2q__2OW6qg\"><i class=\"fa-brands fa-youtube\"></i></a> <a href=\"https://open.spotify.com/intl-fr/artist/0znpFLuaey34oJTE1jHSnT\"><i class=\"fa-brands fa-spotify\"></i></a></li>\n<li>Alex Warren <a href=\"https://music.youtube.com/channel/UCX2Pm1JoWF3chsVOR9e1hbQ\"><i class=\"fa-brands fa-youtube\"></i></a> <a href=\"https://open.spotify.com/intl-fr/artist/0fTSzq9jAh4c36UVb4V7CB\"><i class=\"fa-brands fa-spotify\"></i></a></li>\n<li>Harry Styles <a href=\"https://music.youtube.com/channel/UCZFWPqqPkFlNwIxcpsLOwew\"><i class=\"fa-brands fa-youtube\"></i></a> <a href=\"https://open.spotify.com/intl-fr/artist/6KImCVD70vtIoJWnq6nGn3\"><i class=\"fa-brands fa-spotify\"></i></a></li>\n<li>Benson Boone <a href=\"https://music.youtube.com/channel/UCvILah8hAWYhYOmAG3ZjvBA\"><i class=\"fa-brands fa-youtube\"></i></a> <a href=\"https://open.spotify.com/intl-fr/artist/22wbnEMDvgVIAGdFeek6ET\"><i class=\"fa-brands fa-spotify\"></i></a></li>\n<li>...</li>\n</ul>\n</li>\n<li><strong>Example Tracks</strong>:<ul>\n<li>Alexander Stewart - all these years  <a href=\"https://music.youtube.com/watch?v=OdD-kpWW3ko\"><i class=\"fa-brands fa-youtube\"></i></a> <a href=\"https://open.spotify.com/intl-fr/track/0FtwNRIbtna2kdrOKUV5o2\"><i class=\"fa-brands fa-spotify\"></i></a></li>\n<li>Harry Styles - As It Was <a href=\"https://music.youtube.com/watch?v=nujn6wbr-e8\"><i class=\"fa-brands fa-youtube\"></i></a> <a href=\"https://open.spotify.com/intl-fr/track/4Dvkj6JhhA12EX05fT7y2e\"><i class=\"fa-brands fa-spotify\"></i></a></li>\n<li>...</li>\n</ul>\n</li>\n</ul>\n<h3><strong>Anthemic Alt-Rock / Gaming Tie-ins</strong></h3>\n<p>Large-scale rock production often used >...</li>\n</ul>\n</li>\n<li><strong>Exemples de musiques</strong>:<ul>\n<li>Gojira - Flying Whales <a href=\"https://music.youtube.com/watch?v=H0WyhJseftI\"><i class=\"fa-brands fa-youtube\"></i></a> <a href=\"https://open.spotify.com/intl-fr/track/5OjCsHeByDYEGxMrb1z8KQ\"><i class=\"fa-brands fa-spotify\"></i></a></li>\n<li>Trivium - Until the World Goes Cold <a href=\"https://music.youtube.com/watch?v=pm-xlwkQ_qc\"><i class=\"fa-brands fa-youtube\"></i></a> <a href=\"https://open.spotify.com/intl-fr/track/1hPKSQuvfLlPeIu8xhRyTf\"><i class=\"fa-brands fa-spotify\"></i></a></li>\n<li>...</li>\n</ul>\n</li>\n</ul>\n<h3><strong>Rock psych\u00e9d\u00e9lique / Exp\u00e9rimental</strong></h3>\n<p>Rock exp\u00e9rimental du milieu \u00e0 la fin du 20e si\u00e8cle, connu pour ses paysages sonores longs et ses structures progressives.</p>\n<ul>\n<li><strong>Artistes Cl\u00e9s</strong>:<ul>\n<li>Pink Floyd <a href=\"https://music.youtube.com/channel/UCY2qt3dw2TQJxvBrDiYGHdQ\"><i class=\"fa-brands fa-youtube\"></i></a> <a href=\"https://open.spotify.com/intl-fr/artist/0k17h0D3J5VfsdmQ1iZtE9\"><i class=\"fa-brands fa-spotify\"></i></a></li>\n<li>Shaka Ponk <a href=\"https://music.youtube.com/channel/UCZN01kRWOqISXsFF8ss54BA\"><i class=\"fa-brands fa-youtube\"></i></a> <a href=\"https://open.spotify.com/intl-fr/artist/0VJIBKdqJygrupAxpSTk7q\"><i class=\"fa-brands fa-spotify\"></i></a></li>\n<li>...</li>\n</ul>\n</li>\n<li><strong>Exemples de musiques</strong>:<ul>\n<li>Pink Floyd - Another Brick in the Wall <a href=\"https://music.youtube.com/watch?v=HrxX9TBj2zY\"><i class=\"fa-brands fa-youtube\"></i></a> <a href=\"https://open.spotify.com/intl-fr/track/4gMgiXfqyzZLMhsksGmbQV\"><i class=\"fa-brands fa-spotify\"></i></a></li>\n<li>Shaka Ponk - Tout le monde danse <a href=\"https://music.youtube.com/watch?v=_PskKqYisPQ\"><i class=\"fa-brands fa-youtube\"></i></a> <a href=\"https://open.spotify.com/intl-fr/track/4hH5cR6qEbwAPAoFKhV2Qm\"><i class=\"fa-brands fa-spotify\"></i></a>< /li>\n<li>KPop Demon Hunter</li>\n</ul>\n</li>\n<li>\n<p><strong>Sport:</strong></p>\n<ul>\n<li>Kuroko no basket</li>\n<li>Slam Dunk</li>\n<li>Haikyu!!</li>\n<li>Blue Lock</li>\n</ul>\n</li>\n<li>\n<p><strong>Romance:</strong></p>\n<ul>\n<li>Kaguya-sama: Love is War</li>\n<li>Golden Time</li>\n<li>Blue Box</li>\n</ul>\n</li>\n<li>\n<p><strong>Sci-fi:</strong></p>\n<ul>\n<li>Cyberpunk: Edgerunners</li>\n</ul>\n</li>\n</ul>", "sub_title_fr": "Manga / Animes / Webtoons", "content_fr": "<p>J'aime lire des mangas et regarder des animes. J'aime aussi lire des webtoons.</p>\n<p>Voici quelques-uns de mes pr\u00e9f\u00e9r\u00e9s:</p>\n<ul>\n<li>\n<p><strong>Shonen classique:</strong></p>\n<ul>\n<li>Hunter X Hunter</li>\n<li>Dragon Ball</li>\n</ul>\n</li>\n<li>\n<p><strong>Fantasy Sombre / Seinen:</strong></p>\n<ul>\n<li>Vinland Saga</li>\n<li>Berserk</li>\n<li>Tokyo Ghoul</li>\n<li>Fate Series</li>\n</ul>\n</li>\n<li>\n<p><strong>Fantasy bas\u00e9e sur des syst\u00e8mes / Isekai:</strong></p>\n<ul>\n<li>Solo Leveling</li>\n<li>Re:Zero</li>\n<li>The Beginning After the End</li>\n<li>The Rising of the Shield Hero</li>\n</ul>\n</li>\n<li>\n<p><strong>Fantasy Contemplative:</strong></p>\n<ul>\n<li>Frieren</li>\n</ul>\n</li>\n<li>\n<p><strong>Thriller Strat\u00e9gique:</strong></p>\n<ul>\n<li>Death Note</li>\n<li>Code Geass</li>\n<li>Psycho-Pass</li>\n</ul>\n</li>\n<li>\n<p><strong>Psychologique:</strong></p>\n<ul>\n<li>Orb: On the Movements of the Earth</li>\n<li>To your eternity</li>\n<li>The Darwin Incident</li>\n<li>Lazarus</li>\n<li>Oshi No Ko</li>\n<li>Promised Neverland</li>\n<li>Parasyte</li>\n<li>Guilty Crown</li>\n</ul>\n</li>\n<li>\n<p><strong>Musique:</strong></p>\n<ul>\n<li>Beck</li>\n<li>Bocchi the Rock!</li>\n<li>Nana</li>\n<li>Blue Orchestra</li>\n<li>Carole and Tuesday</li>\n<li>Your Lie in April</li>\n<li>KPop Demon Hunter</li>\n</ul>\n</li>\n<li>\n<p><strong>Sport:</strong></p>\n<ul>\n<li>Kuroko no basket</li>\n<li>Slam Dunk</li>\n<li>Haikyu!!</li>\n<li>Blue Lock</li>\n</ul>\n</li>\n<li>\n<p><strong>Romance:</strong></p>\n<ul>\n<li>Kaguya-sama: Love is War</li>\n<li>Golden Time</li>\n<li>Blue Box</li>\n</ul>\n</li>\n<li>\n<p><strong>Sci-fi:</strong></p>\n<ul>\n<li>Cyberpunk: Edgerunners</li>\n</ul>\n</li>\n</ul>"}, {"sub_title_en": "Reading Books", "content_en": "<p>I like reading books.</p>\n<p>Here are some of my favorites:</p>\n<ul>\n<li><em>Les Hauts-Conteurs - Olivier Peru and Patrick McSpare</em></li>\n<li><em>Blood song - Anthony Ryan</em></li>\n<li><em>The Witcher - Andrzej Sapkowski</em></li>\n<li><em>Foundation - Isaac Asimov</em></li>\n<li><em>Misery - Stephen King</em></li>\n</ul>\n<p>I am currently reading:</p>\n<ul>\n<li><em>La guilde des ombres - Anna Triss</em></li>\n<li><em>The Farseer Trilogy - Robin Hobb</em></li>\n</ul>\n<p>My to-read pile is currently composed of:</p>\n<ul>\n<li><em>The Dark Tower - Stephen King (ep1 - The Gunslinger)</em></li>\n<li><em>The Hitchhiker's Guide to the Galaxy - Douglas Adams</em></li>\n<li><em>The wandering inn - Pirateaba</em></li>\n</ul>", "sub_title_fr": "Lecture de livres", "content_fr": "<p>J'aime lire des livres.</p>\n<p>Voici quelques-uns de mes pr\u00e9f\u00e9r\u00e9s:</p>\n<ul>\n<li><em>Les Hauts-Conteurs - Olivier Peru and Patrick McSpare</em></li>\n<li><em>Blood song - Anthony Ryan</em></li>\n<li><em>The Witcher - Andrzej Sapkowski</em></li>\n<li><em>Foundation - Isaac Asimov</em></li>\n<li><em>Misery - Stephen King</em></li>\n</ul>\n<p>Je suis actuellement en train de lire:</p>\n<ul>\n<li><em>La guilde des ombres - Anna Triss</em></li>\n<li><em>L'assassin royal - Robin Hobb</em></li>\n</ul>\n<p>Ma pile de livres \u00e0 lire est actuellement compos\u00e9e de:</p>\n<ul>\n<li><em>La tour sombre - Stephen King (ep1 - le pistolero)</em></li>\n<li><em>H2G2 - Douglas Adams</em></li>\n<li><em>The wandering inn - Pirateaba</em></li>\n</ul>"}, {"sub_title_en": "Watching Series / Movies", "content_en": "<p>I like watching series and movies. Here are some of my favorites:</p>\n<h3><strong>Series:</strong></h3>\n<ul>\n<li><em>The good place - Michael Schur</em></li>\n<li><em>Mercredi (Wednesday) - Tim Burton</em></li>\n<li><em>The walking dead - Frank Darabont</em></li>\n<li><em>Doctor Who</em></li>\n<li><em>Kaamelott - Alexandre Astier</em></li>\n<li><em>Squid Game - Hwang Dong-hyeok</em></li>\n<li><em>Hot Shot (\u7c43\u7403\u706b) (2008) - Lin He Long</em></li>\n</ul>\n<h3><strong>C-dramas:</strong></h3>\n<ul>\n<li><em>Always Home - Zhang Xiao An</em></li>\n<li><em>When I fly towards you - Mao Deshu</em></li>\n<li><em>Our generation - Zhang Kaizhou</em></li>\n<li><em>Summit of Youth - Cai Cong</em></li>\n</ul>\n<h3><strong>K-dramas:</strong></h3>\n<ul>\n<li><em>Doctors - Oh Choong-hwan</em></li>\n<li><em>Resident Playbook - Lee Min-soo</em></li>\n<li><em>I am not a robot - Jung Dae-yoon</em></li>\n</ul>\n<h3><strong>Movies:</strong></h3>\n<ul>\n<li><em>Matrix - Lana and Lilly Wachowski</em></li>\n<li><em>Men in Black - Barry Sonnenfeld</em></li>\n<li><em>Interstellar - Christopher Nolan</em></li>\n<li><em>The Fugitives / The Goat - Francis Veber</em></li>\n<li><em>OSS 117 - Michel Hazanavicius</em></li>\n<li><em>Planet of the Apes - Tim Burton</em></li>\n<li><em>Vertigo - Alfred Hitchcock</em></li>\n<li><em>The Wave - Dennis Gansel</em></li>\n<li><em>Persepolis - Marjane Satrapi and Vincent Paronnaud</em></li>\n<li><em>Wolf Children - Mamoru Hosoda</em></li>\n<li><em>My Neighbor Totoro - Hayao Miyazaki</em></li>\n<li><em>Kiki's Delivery Service - Hayao Miyazaki</em></li>\n<li><em>Howl's Moving Castle - Hayao Miyazaki</em></li>\n<li><em>Your Name - Makoto Shinkai</em></li>\n<li><em>The Girl Who Leapt Through Time - Mamoru Hosoda</em></li>\n</ul>", "sub_title_fr": "S\u00e9ries et films que j'ai aim\u00e9s", "content_fr": "<p>J'aime regarder des s\u00e9ries et des films. Voici quelques-uns de mes pr\u00e9f\u00e9r\u00e9s:</p>\n<h3><strong>S\u00e9ries:</strong></h3>\n<ul>\n<li><em>The good place - Michael Schur</em></li>\n<li><em>Mercredi (Wednesday) - Tim Burton</em></li>\n<li><em>The walking dead - Frank Darabont</em></li>\n<li><em>Doctor Who</em></li>\n<li><em>Kaamelott - Alexandre Astier</em></li>\n<li><em>Squid Game - Hwang Dong-hyeok</em></li>\n<li><em>Hot Shot (\u7c43\u7403\u706b) (2008) - Lin He Long</em></li>\n</ul>\n<h3><strong>C-dramas:</strong></h3>\n<ul>\n<li><em>Always Home - Zhang Xiao An</em></li>\n<li><em>When I fly towards you - Mao Deshu</em></li>\n<li><em>Our generation - Zhang Kaizhou</em></li>\n<li><em>Summit of Youth - Cai Cong</em></li>\n</ul>\n<h3><strong>K-dramas:</strong></h3>\n<ul>\n<li><em>Doctors - Oh Choong-hwan</em></li>\n<li><em>Resident Playbook - Lee Min-soo</em></li>\n<li><em>I am not a robot - Jung Dae-yoon</em></li>\n</ul>\n<h3><strong>Films:</strong></h3>\n<ul>\n<li><em>Matrix - Lana and Lilly Wachowski</em></li>\n<li><em>Men in Black - Barry Sonnenfeld</em></li>\n<li><em>Interstellar - Christopher Nolan</em></li>\n<li><em>Les fugitifs / La ch\u00e8vre - Francis Veber</em></li>\n<li><em>OSS 117 - Michel Hazanavicius</em></li>\n<li><em>La plan\u00e8te des singes - Tim Burton</em></li>\n<li><em>Vertigo - Alfred Hitchcock</em></li>\n<li><em>La vague - Dennis Gansel</em></li>\n<li><em>Persepolis - Marjane Satrapi and Vincent Paronnaud</em></li>\n<li><em>Les enfants loups - Mamoru Hosoda</em></li>\n<li><em>Mon voisin totoro - Hayao Miyazaki</em></li>\n<li><em>Kiki la petite sorci\u00e8re - Hayao Miyazaki</em></li>\n<li><em>Le chateau ambulant - Hayao Miyazaki</em></li>\n<li><em>Your Name - Makoto Shinkai</em></li>\n<li><em>La travers\u00e9e du temps - Mamoru Hosoda</em></li>\n</ul>"}], "_source_file": "My_Hobbies", "_source_name": "My_Hobbies"}, "_items": [{"title_en": "My Hobbies", "title_fr": "Mes Hobbies", "sections": [{"sub_title_en": "Board games and Game of Roles", "content_en": "<p>I like playing board games and game of roles with my friends and my family.</p>\n<p>Example of board games I like:</p>\n<h3><strong>Classic and Traditional Card Games</strong></h3>\n<p>Traditional trick-taking and betting games played with standard decks.</p>\n<ul>\n<li>Examples:<ul>\n<li>Belote</li>\n<li>Tarot</li>\n<li>Poker</li>\n</ul>\n</li>\n</ul>\n<h3><strong>Fast-Paced Deck and Hand Management</strong></h3>\n<p>Modern card games focused on card combinations, set collection, and hand clearing.</p>\n<ul>\n<li>Examples:<ul>\n<li>Gang of 4</li>\n<li>President</li>\n<li>7 Yokai</li>\n</ul>\n</li>\n</ul>\n<h3><strong>Social Deduction and Communication</strong></h3>\n<p>Games centered on word association, hidden information, and collective interpretation.</p>\n<ul>\n<li>Examples:<ul>\n<li>Codenames</li>\n<li>Dixit</li>\n<li>Blanc Manger Coco</li>\n<li>Danny</li>\n</ul>\n</li>\n</ul>\n<h3><strong>Tactical Engine Building</strong></h3>\n<p>Resource management games where players optimize actions to build an efficient scoring system.</p>\n<ul>\n<li>Examples:<ul>\n<li>Azul</li>\n<li>Splendor</li>\n<li>Rebirth</li>\n</ul>\n</li>\n</ul>\n<h3><strong>Tile-Laying and Territorial Expansion</strong></h3>\n<p>Strategic placement games focused on building landscapes and claiming space on a shared board.</p>\n<ul>\n<li>Examples:<ul>\n<li>Carcassonne</li>\n<li>Kingdomino</li>\n</ul>\n</li>\n</ul>\n<h3><strong>Area Control and Strategy</strong></h3>\n<p>Macro-strategy games involving territorial dominance, resource competition, and conflict management.</p>\n<ul>\n<li>Examples:<ul>\n<li>Risk</li>\n<li>Scythe</li>\n</ul>\n</li>\n</ul>\n<h3><strong>Cooperative and Puzzle Solving</strong></h3>\n<p>Team-based or logic-driven games centered on shared objectives and mechanical problem-solving.</p>\n<ul>\n<li>Examples:<ul>\n<li>The Gang</li>\n<li>Take Time</li>\n</ul>\n</li>\n</ul>\n<h3><strong>Competitive Duel and Confrontation</strong></h3>\n<p>Strictly 1v1 formats featuring hidden movement, tactical positioning, or collectible deck building.</p>\n<ul>\n<li>Examples:<ul>\n<li>Tag Team</li>\n<li>Zenith</li>\n<li>Stratego</li>\n<li>Magic: The Gathering</li>\n</ul>\n</li>\n</ul>", "sub_title_fr": "Jeux de soci\u00e9t\u00e9 et jeux de r\u00f4les", "content_fr": "<p>J'aime jouer \u00e0 des jeux de soci\u00e9t\u00e9 et des jeux de r\u00f4les avec mes amis et ma famille.</p>\n<p>Voici des exemples de jeux de soci\u00e9t\u00e9 que j'aime bien :</p>\n<h3><strong>Jeux de cartes classiques et traditionnels</strong></h3>\n<p>Jeux de plis et de paris traditionnels jou\u00e9s avec des jeux de cartes standards.</p>\n<ul>\n<li>Exemples :<ul>\n<li>Belote</li>\n<li>Tarot</li>\n<li>Poker</li>\n</ul>\n</li>\n</ul>\n<h3><strong>Jeux de cartes modernes rapides</strong></h3>\n<p>Jeux de cartes modernes ax\u00e9s sur la combinaison de cartes, la collection de sets et le vidage de main.</p>\n<ul>\n<li>Exemples :<ul>\n<li>Gang of 4</li>\n<li>Pr\u00e9sident</li>\n<li>7 Yokai</li>\n</ul>\n</li>\n</ul>\n<h3><strong>Jeux de d\u00e9duction sociale et de communication</strong></h3>\n<p>Jeux centr\u00e9s sur l'association de mots, l'information cach\u00e9e et l'interpr\u00e9tation collective.</p>\n<ul>\n<li>Exemples :<ul>\n<li>Codenames</li>\n<li>Dixit</li>\n<li>Blanc Manger Coco</li>\n<li>Danny</li>\n</ul>\n</li>\n</ul>\n<h3><strong>Jeux de construction de moteur tactique</strong></h3>\n<p>Jeux de gestion de ressources o\u00f9 les joueurs optimisent les actions pour construire un syst\u00e8me de score efficace.</p>\n<ul>\n<li>Exemples :<ul>\n<li>Azul</li>\n<li>Splendor</li>\n<li>Rebirth</li>\n</ul>\n</li>\n</ul>\n<h3><strong>Jeux de placement de tuiles et d'expansion territoriale</strong></h3>\n<p>Jeux de placement strat\u00e9gique ax\u00e9s sur la construction de paysages et la revendication d'espace sur un plateau partag\u00e9.</p>\n<ul>\n<li>Exemples :<ul>\n<li>Carcassonne</li>\n<li>Kingdomino</li>\n</ul>\n</li>\n</ul>\n<h3><strong>Jeux de contr\u00f4le de zone et de strat\u00e9gie</strong></h3>\n<p>Jeux de macro-strat\u00e9gie impliquant la domination territoriale, la comp\u00e9tition pour les ressources et la gestion des conflits.</p>\n<ul>\n<li>Exemples :<ul>\n<li>Risk</li>\n<li>Scythe</li>\n</ul>\n</li>\n</ul>\n<h3><strong>Jeux coop\u00e9ratifs et de r\u00e9solution de probl\u00e8mes</strong></h3>\n<p>Jeux d'\u00e9quipe ou bas\u00e9s sur la logique, centr\u00e9s sur des objectifs communs et la r\u00e9solution de probl\u00e8mes m\u00e9caniques.</p>\n<ul>\n<li>Exemples :<ul>\n<li>The Gang</li>\n<li>Take Time</li>\n</ul>\n</li>\n</ul>\n<h3><strong>Jeux comp\u00e9titifs et de confrontation</strong></h3>\n<p>Formats strictement 1v1 mettant en sc\u00e8ne des mouvements cach\u00e9s, un positionnement tactique ou la construction de decks \u00e0 collectionner.</p>\n<ul>\n<li>Exemples :<ul>\n<li>Tag Team</li>\n<li>Zenith</li>\n<li>Stratego</li>\n<li>Magic: The Gathering</li>\n</ul>\n</li>\n</ul>"}, {"sub_title_en": "Sports", "content_en": "<p>I love playing and watching some sports, especially:</p>\n<h3><strong>Basket-ball</strong>:</h3>\n<p>I practiced in club, and now regularly outdoor, and I like following the NBA.</p>\n<h3><strong>Volley-ball</strong>:</h3>\n<p>I practiced, especially when I was in CPGE.</p>\n<h3><strong>Cycling</strong>:</h3>\n<p>I like doing bike, and following the Tour de France, Paris-Nice, La Vuelta, Le Giro, Les classiques...</p>", "sub_title_fr": "Sports", "content_fr": "<p>J'aime jouer et regarder certains sports, en particulier :</p>\n<h3><strong>Basket-ball</strong>:</h3>\n<p>J'ai pratiqu\u00e9 en club, et maintenant r\u00e9guli\u00e8rement en ext\u00e9rieur, et j'aime suivre la NBA.</p>\n<h3><strong>Volley-ball</strong>:</h3>\n<p>J'ai pratiqu\u00e9, surtout quand j'\u00e9tais en CPGE.</p>\n<h3><strong>Cyclisme</strong>:</h3>\n<p>J'aime faire du v\u00e9lo, et suivre le Tour de France, Paris-Nice, La Vuelta, Le Giro, Les classiques...</p>"}, {"sub_title_en": "Computer Science and Development", "content_en": "<p>I started programming when I was very young, and started with Python and basic web development (HTML, CSS, JS).\nI started trying to programming my own video-games, and created random websites, until I did more serious projects during my studies.</p>", "sub_title_fr": "Informatique et d\u00e9veloppement", "content_fr": "<p>J'ai commenc\u00e9 \u00e0 programmer quand j'\u00e9tais tr\u00e8s jeune, et j'ai commenc\u00e9 avec Python et le d\u00e9veloppement web de base (HTML, CSS, JS).\nJ'ai commenc\u00e9 \u00e0 essayer de programmer mes propres jeux vid\u00e9o, et j'ai cr\u00e9\u00e9 des sites web al\u00e9atoires, jusqu'\u00e0 ce que je fasse des projets plus s\u00e9rieux pendant mes \u00e9tudes.</p>"}, {"sub_title_en": "Creation and Art", "content_en": "<p>I like creating and making art. I like drawing, and I like making music (writing lyrics or composing music).\nI also like writing stories, poems, and novels.\nI also like making 3d renderings, pixel/voxel art, and other forms of digital art.</p>", "sub_title_fr": "Cr\u00e9ativit\u00e9 et art", "content_fr": "<p>J'aime cr\u00e9er et faire de l'art. J'aime dessiner, et j'aime faire de la musique (\u00e9crire des paroles ou composer de la musique).\nJ'aime aussi \u00e9crire des histoires, des po\u00e8mes et des romans.\nJ'aime aussi faire des rendus 3D, du pixel/voxel art, et d'autres formes d'art num\u00e9rique.</p>"}, {"sub_title_en": "Listening Music", "content_en": "<h3><strong>Dark Folk / Ethereal Pop</strong></h3>\n<p>Atmospheric music utilizing organic instrumentation, unique vocal timbres, and narrative-focused lyrics.</p>\n<ul>\n<li><strong>Key Artists</strong>:<ul>\n<li>AURORA <a href=\"https://music.youtube.com/channel/UCNjHgaLpdy1IMNK57pYiKiQ\"><i class=\"fa-brands fa-youtube\"></i></a> <a href=\"https://open.spotify.com/intl-fr/artist/1WgXqy2Dd70QQOU7Ay074N\"><i class=\"fa-brands fa-spotify\"></i></a></li>\n<li>Wardruna <a href=\"https://music.youtube.com/channel/UCoK2X3nnuG7ug-Kk75r5rJQ\"><i class=\"fa-brands fa-youtube\"></i></a> <a href=\"https://open.spotify.com/intl-fr/artist/0NJ6wlOAsAJ1PN4VRdTPKA\"><i class=\"fa-brands fa-spotify\"></i></a></li>\n<li>Kiki Rockwell <a href=\" e_fr": "Nancy / Sivry", "content_fr": "<p>J'ai v\u00e9cu \u00e0 Nancy / Sivry, en France, de 2003 \u00e0 2015, o\u00f9 j'ai v\u00e9cu mon enfance et le d\u00e9but de mon coll\u00e8ge.</p>"}], "_source_file": "Places_where_I_lived", "_source_name": "Places_where_I_lived"}}, "blogs": {"Building_PyXML.md": {"title_en": "Building My Own PyXML Compiler", "title_fr": "Construire Mon Propre Compilateur PyXML", "date": "2026-03-27", "author": "Nathan Cerisara", "image": "res/logo.svg", "tags": ["Python", "Static Site Generator", "Compilers"], "summary_en": "A deep dive into why and how I built a custom XML-based static site generator for my portfolio.", "summary_fr": "Une exploration profonde sur pourquoi et comment j'ai construit un g\u00e9n\u00e9rateur de site statique personnalis\u00e9 bas\u00e9 sur XML.", "category": "Tech", "series": "", "markdown_content_en_html": "<h3>Why PyXML?</h3>\n<p>Standard SSGs like Jekyll or Hugo use Markdown + YAML Frontmatter. While powerful, they often feel disconnected from the HTML structure. PyXML allows me to define <strong>custom semantic tags</strong> that map directly to high-level UI components.</p>\n<h3>Implementation Details</h3>\n<ul>\n<li><strong>Parser</strong>: Uses Python's <code>xml.etree.ElementTree</code> with custom extensions for execution blocks (<code>exec_*</code>).</li>\n<li><strong>Context</strong>: A robust state manager for variable resolution and pathing.</li>\n<li><strong>Glassmorphism</strong>: Native support for CSS backdrop filters.</li>\n</ul>\n<h3>Future Improvements</h3>\n<ul>\n<li><strong>Live Preview</strong>: Integrated dev server with hot reload.</li>\n<li><strong>Wasm Version</strong>: Running the compiler in the browser.</li>\n</ul>\n<p>The journey of building a custom XML parser began out of frustration with rigid static site generators.</p>\n<p>Jekyll, Hugo, and others are fantastic tools, but they often abstract the DOM in ways that make creating highly custom UI components difficult and verbose.</p>\n<p>By leveraging Python's built-in element tree, the compiler directly manipulates the DOM structure, translating custom XML tags into raw, performant HTML.</p>\n<p>Working with Python's deep standard library revealed how much power is hidden behind standard patterns, especially when handling text encodings and recursive traversal.</p>", "markdown_content_en_raw": "### Why PyXML?\nStandard SSGs like Jekyll or Hugo use Markdown + YAML Frontmatter. While powerful, they often feel disconnected from the HTML structure. PyXML allows me to define **custom semantic tags** that map directly to high-level UI components.\n\n### Implementation Details\n- **Parser**: Uses Python's `xml.etree.ElementTree` with custom extensions for execution blocks (`exec_*`).\n- **Context**: A robust state manager for variable resolution and pathing.\n- **Glassmorphism**: Native support for CSS backdrop filters.\n\n### Future Improvements\n- **Live Preview**: Integrated dev server with hot reload.\n- **Wasm Version**: Running the compiler in the browser.\n\nThe journey of building a custom XML parser began out of frustration with rigid static site generators.\n\nJekyll, Hugo, and others are fantastic tools, but they often abstract the DOM in ways that make creating highly custom UI components difficult and verbose.\n\nBy leveraging Python's built-in element tree, the compiler directly manipulates the DOM structure, translating custom XML tags into raw, performant HTML.\n\nWorking with Python's deep standard library revealed how much power is hidden behind standard patterns, especially when handling text encodings and recursive traversal.", "markdown_content_fr_html": "<h3>Pourquoi PyXML ?</h3>\n<p>Les g\u00e9n\u00e9rateurs de sites statiques standards comme Jekyll ou Hugo utilisent Markdown + YAML Frontmatter. Bien que puissants, ils donnent souvent l'impression d'\u00eatre d\u00e9connect\u00e9s de la structure HTML. PyXML me permet de d\u00e9finir des <strong>balises s\u00e9mantiques personnalis\u00e9es</strong> qui correspondent directement \u00e0 des composants d'interface utilisateur de haut niveau.</p>\n<h3>D\u00e9tails d'impl\u00e9mentation</h3>\n<ul>\n<li><strong>Parser</strong>: Utilise <code>xml.etree.ElementTree</code> de Python avec des extensions personnalis\u00e9es pour les blocs d'ex\u00e9cution (<code>exec_*</code>).</li>\n<li><strong>Contexte</strong>: Un gestionnaire d'\u00e9tat robuste pour la r\u00e9solution des variables et la gestion des chemins.</li>\n<li><strong>Glassmorphism</strong>: Support natif pour les filtres d'arri\u00e8re-plan CSS.</li>\n</ul>\n<h3>Am\u00e9liorations futures</h3>\n<ul>\n<li><strong>Aper\u00e7u en direct</strong>: Serveur de d\u00e9veloppement int\u00e9gr\u00e9 avec rechargement \u00e0 chaud.</li>\n<li><strong>Version Wasm</strong>: Ex\u00e9cution du compilateur dans le navigateur.</li>\n</ul>\n<p>Le parcours de cr\u00e9ation d'un analyseur XML personnalis\u00e9 a commenc\u00e9 par une frustration face aux g\u00e9n\u00e9rateurs de sites statiques rigides.</p>\n<p>Jekyll, Hugo et les autres sont des outils fantastiques, mais ils abstraient souvent le DOM d'une mani\u00e8re qui rend la cr\u00e9ation de composants d'interface utilisateur hautement personnalis\u00e9s difficile et complexe.</p>\n<p>En tirant parti de l'arborescence des \u00e9l\u00e9ments int\u00e9gr\u00e9s de Python, le compilateur manipule directement la structure du DOM, traduisant les balises XML personnalis\u00e9es en HTML brut et performant.</p>\n<p>Travailler avec la biblioth\u00e8que standard approfondie de Python a r\u00e9v\u00e9l\u00e9 la puissance cach\u00e9e derri\u00e8re les mod\u00e8les standards, en particulier lors du traitement des encodages de texte et de la travers\u00e9e r\u00e9cursive.</p>", "markdown_content_fr_raw": "### Pourquoi PyXML ?\nLes g\u00e9n\u00e9rateurs de sites statiques standards comme Jekyll ou Hugo utilisent Markdown + YAML Frontmatter. Bien que puissants, ils donnent souvent l'impression d'\u00eatre d\u00e9connect\u00e9s de la structure HTML. PyXML me permet de d\u00e9finir des **balises s\u00e9mantiques personnalis\u00e9es** qui correspondent directement \u00e0 des composants d'interface utilisateur de haut niveau.\n\n### D\u00e9tails d'impl\u00e9mentation\n- **Parser**: Utilise `xml.etree.ElementTree` de Python avec des extensions personnalis\u00e9es pour les blocs d'ex\u00e9cution (`exec_*`).\n- **Contexte**: Un gestionnaire d'\u00e9tat robuste pour la r\u00e9solution des variables et la gestion des chemins.\n- **Glassmorphism**: Support natif pour les filtres d'arri\u00e8re-plan CSS.\n\n### Am\u00e9liorations futures\n- **Aper\u00e7u en direct**: Serveur de d\u00e9veloppement int\u00e9gr\u00e9 avec rechargement \u00e0 chaud.\n- **Version Wasm**: Ex\u00e9cution du compilateur dans le navigateur.\n\nLe parcours de cr\u00e9ation d'un analyseur XML personnalis\u00e9 a commenc\u00e9 par une frustration face aux g\u00e9n\u00e9rateurs de sites statiques rigides.\n\nJekyll, Hugo et les autres sont des outils fantastiques, mais ils abstraient souvent le DOM d'une mani\u00e8re qui rend la cr\u00e9ation de composants d'interface utilisateur hautement personnalis\u00e9s difficile et complexe.\n\nEn tirant parti de l'arborescence des \u00e9l\u00e9ments int\u00e9gr\u00e9s de Python, le compilateur manipule directement la structure du DOM, traduisant les balises XML personnalis\u00e9es en HTML brut et performant.\n\nTravailler avec la biblioth\u00e8que standard approfondie de Python a r\u00e9v\u00e9l\u00e9 la puissance cach\u00e9e derri\u00e8re les mod\u00e8les standards, en particulier lors du traitement des encodages de texte et de la travers\u00e9e r\u00e9cursive.", "_source_file": "Building_PyXML", "_source_name": "Building_PyXML"}, "Building_PyXML": {"title_en": "Building My Own PyXML Compiler", "title_fr": "Construire Mon Propre Compilateur PyXML", "date": "2026-03-27", "author": "Nathan Cerisara", "image": "res/logo.svg", "tags": ["Python", "Static Site Generator", "C XML allows me to define **custom semantic tags** that map directly to high-level UI components.\n\n### Implementation Details\n- **Parser**: Uses Python's `xml.etree.ElementTree` with custom extensions for execution blocks (`exec_*`).\n- **Context**: A robust state manager for variable resolution and pathing.\n- **Glassmorphism**: Native support for CSS backdrop filters.\n\n### Future Improvements\n- **Live Preview**: Integrated dev server with hot reload.\n- **Wasm Version**: Running the compiler in the browser.\n\nThe journey of building a custom XML parser began out of frustration with rigid static site generators.\n\nJekyll, Hugo, and others are fantastic tools, but they often abstract the DOM in ways that make creating highly custom UI components difficult and verbose.\n\nBy leveraging Python's built-in element tree, the compiler directly manipulates the DOM structure, translating custom XML tags into raw, performant HTML.\n\nWorking with Python's deep standard library revealed how much power is hidden behind standard patterns, especially when handling text encodings and recursive traversal.", "markdown_content_fr_html": "<h3>Pourquoi PyXML ?</h3>\n<p>Les g\u00e9n\u00e9rateurs de sites statiques standards comme Jekyll ou Hugo utilisent Markdown + YAML Frontmatter. Bien que puissants, ils donnent souvent l'impression d'\u00eatre d\u00e9connect\u00e9s de la structure HTML. PyXML me permet de d\u00e9finir des <strong>balises s\u00e9mantiques personnalis\u00e9es</strong> qui correspondent directement \u00e0 des composants d'interface utilisateur de haut niveau.</p>\n<h3>D\u00e9tails d'impl\u00e9mentation</h3>\n<ul>\n<li><strong>Parser</strong>: Utilise <code>xml.etree.ElementTree</code> de Python avec des extensions personnalis\u00e9es pour les blocs d'ex\u00e9cution (<code>exec_*</code>).</li>\n<li><strong>Contexte</strong>: Un gestionnaire d'\u00e9tat robuste pour la r\u00e9solution des variables et la gestion des chemins.</li>\n<li><strong>Glassmorphism</strong>: Support natif pour les filtres d'arri\u00e8re-plan CSS.</li>\n</ul>\n<h3>Am\u00e9liorations futures</h3>\n<ul>\n<li><strong>Aper\u00e7u en direct</strong>: Serveur de d\u00e9veloppement int\u00e9gr\u00e9 avec rechargement \u00e0 chaud.</li>\n<li><strong>Version Wasm</strong>: Ex\u00e9cution du compilateur dans le navigateur.</li>\n</ul>\n<p>Le parcours de cr\u00e9ation d'un analyseur XML personnalis\u00e9 a commenc\u00e9 par une frustration face aux g\u00e9n\u00e9rateurs de sites statiques rigides.</p>\n<p>Jekyll, Hugo et les autres sont des outils fantastiques, mais ils abstraient souvent le DOM d'une mani\u00e8re qui rend la cr\u00e9ation de composants d'interface utilisateur hautement personnalis\u00e9s difficile et complexe.</p>\n<p>En tirant parti de l'arborescence des \u00e9l\u00e9ments int\u00e9gr\u00e9s de Python, le compilateur manipule directement la structure du DOM, traduisant les balises XML personnalis\u00e9es en HTML brut et performant.</p>\n<p>Travailler avec la biblioth\u00e8que standard approfondie de Python a r\u00e9v\u00e9l\u00e9 la puissance cach\u00e9e derri\u00e8re les mod\u00e8les standards, en particulier lors du traitement des encodages de texte et de la travers\u00e9e r\u00e9cursive.</p>", "markdown_content_fr_raw": "### Pourquoi PyXML ?\nLes g\u00e9n\u00e9rateurs de sites statiques standards comme Jekyll ou Hugo utilisent Markdown + YAML Frontmatter. Bien que puissants, ils donnent souvent l'impression d'\u00eatre d\u00e9connect\u00e9s de la structure HTML. PyXML me permet de d\u00e9finir des **balises s\u00e9mantiques personnalis\u00e9es** qui correspondent directement \u00e0 des composants d'interface utilisateur de haut niveau.\n\n### D\u00e9tails d'impl\u00e9mentation\n- **Parser**: Utilise `xml.etree.ElementTree` de Python avec des extensions personnalis\u00e9es pour les blocs d'ex\u00e9cution (`exec_*`).\n- **Contexte**: Un gestionnaire d'\u00e9tat robuste pour la r\u00e9solution des variables et la gestion des chemins.\n- **Glass ion_fr": "La paix est la chanson que le c\u0153ur chante quand il est libre de peur.", "author": ""}], ["data_citation_1.json"]], "manifest.json": ["data_citation_1.json"], "manifest": ["data_citation_1.json"]}, "home": {"quick_history.md": {"title_en": "Quick History", "title_fr": "Quick History", "sections": [{"sub_title_en": "2023 - 2026 : Engineering school (T\u00e9l\u00e9com Physique Strasbourg)", "content_en": "<p>In 2023, I started a 3-year engineering school (T\u00e9l\u00e9com Physique Strasbourg). I am currently in the end of my last year, doing my 6-month internship in the IRIDIA lab of the Universit\u00e9 Libre de Bruxelles.</p>", "sub_title_fr": "2023 - 2026 : \u00e9cole d'ing\u00e9nieur (T\u00e9l\u00e9com Physique Strasbourg)", "content_fr": "<p>En 2023, j'ai commenc\u00e9 une \u00e9cole d'ing\u00e9nieur de 3 ans (T\u00e9l\u00e9com Physique Strasbourg). Je suis actuellement en fin de derni\u00e8re ann\u00e9e, faisant mon stage de 6 mois au laboratoire IRIDIA de l'Universit\u00e9 Libre de Bruxelles.</p>"}, {"sub_title_en": "2021 - 2023 : Preparatory class (Lyc\u00e9e Louis-le-Grand, Paris)", "content_en": "<p>In 2021, I started a 2-year preparatory class (CPGE) in Paris (lyc\u00e9e Louis-le-Grand). I then passed the entrance exams for the French engineering schools (concours Mines-T\u00e9l\u00e9com, Centrale-Sup\u00e9lec, X, ENS).</p>", "sub_title_fr": "2021 - 2023 : classe pr\u00e9paratoire (Lyc\u00e9e Louis-le-Grand, Paris)", "content_fr": "<p>En 2021, j'ai commenc\u00e9 une classe pr\u00e9paratoire de 2 ans (CPGE) \u00e0 Paris (lyc\u00e9e Louis-le-Grand). J'ai ensuite pass\u00e9 les concours d'entr\u00e9e aux \u00e9coles d'ing\u00e9nieurs fran\u00e7aises (concours Mines-T\u00e9l\u00e9com, Centrale-Sup\u00e9lec, X, ENS).</p>"}, {"sub_title_en": "2015 - 2021 : Second part of my childhood and high school", "content_en": "<p>In 2015, we moved into Heillecourt, a city in the suburbs of Nancy. I went to the middle school there (coll\u00e8ge Montaigu), and then to the high school in Nancy (lyc\u00e9e Henri Poincar\u00e9). I graduated in 2021 with a scientific baccalaur\u00e9at (Maths, Computer Science and Physics options).</p>", "sub_title_fr": "2015 - 2021 : Seconde partie de mon enfance et lyc\u00e9e", "content_fr": "<p>En 2015, nous avons emm\u00e9nag\u00e9 \u00e0 Heillecourt, une ville en banlieue de Nancy. Je suis all\u00e9 au coll\u00e8ge l\u00e0-bas (coll\u00e8ge Montaigu), puis au lyc\u00e9e \u00e0 Nancy (lyc\u00e9e Henri Poincar\u00e9). J'ai obtenu mon baccalaur\u00e9at scientifique en 2021 (options Maths, Informatique et Physique).</p>"}, {"sub_title_en": "2003 - 2015 : First part of my childhood", "content_en": "<p>I was born in Nancy, France. I lived in Sivry, a small village of 200 inhabitants, in the countryside, 20 km in the north of Nancy.</p>", "sub_title_fr": "2003 - 2015 : Premi\u00e8re partie de mon enfance", "content_fr": "<p>Je suis n\u00e9 \u00e0 Nancy, France. J'ai v\u00e9cu \u00e0 Sivry, un petit village de 200 habitants, \u00e0 la campagne, \u00e0 20 km au nord de Nancy.</p>"}], "_source_file": "quick_history", "_source_name": "quick_history"}, "quick_history": {"title_en": "Quick History", "title_fr": "Quick History", "sections": [{"sub_title_en": "2023 - 2026 : Engineering school (T\u00e9l\u00e9com Physique Strasbourg)", "content_en": "<p>In 2023, I started a 3-year engineering school (T\u00e9l\u00e9com Physique Strasbourg). I am currently in the end of my last year, doing my 6-month internship in the IRIDIA lab of the Universit\u00e9 Libre de Bruxelles.</p>", "sub_title_fr": "2023 - 2026 : \u00e9cole d'ing\u00e9nieur (T\u00e9l\u00e9com Physique Strasbourg)", "content_fr": "<p>En 2023, j'ai commenc\u00e9 une \u00e9cole d'ing\u00e9nieur de 3 ans (T\u00e9l\u00e9com Physique Strasbourg). Je suis actuellement en fin de derni\u00e8re ann\u00e9e, faisant mon stage de 6 mois au laboratoire IRIDIA de l'Universit\u00e9 Libre de Bruxelles.</p>"}, {"sub_title_en": "2021 - 2023 : Preparatory class (Lyc\ "res/icons/icon_project_cube1.png", "links": [{"name_en": "Github", "name_fr": "Github", "url": "https://github.com/nath54/cube", "class": "btn-code btn-get btn-action", "icon": "fab fa-github"}], "app_version": "1.0", "download_size": "-", "tags": ["Python", "Game", "2D", "Tkinter", "Retro", "Procedural"], "gallery": ["res/screenshots/cube1_1.png", "res/screenshots/cube1_2.png"], "description_en": "<p>Cube1 is a nostalgic 2D procedural arcade game developed in Python using the classic Tkinter interface. The core concept revolves around navigating a tiny white cube through an auto-generated maze towards a red target. The game features a unique maze generation algorithm: it performs a random walk of a configurable number of steps to define a valid path, and converts all unvisited areas of the screen into walls. Players can collect bonus brown points, but must be extremely cautious\u2014touching walls costs a life, resets position, and subtracts points. Cube1 includes a visual difficulty mode: in 'Easy' mode, walls are colored in vibrant hues, while in 'Hard' mode, the wall colors intentionally blend with the dark background, the player, or the target to test your visual perception and memory. Fully compatible with both Python 2.x and Python 3.x.</p>", "description_fr": "<p>Cube1 est un jeu d'arcade 2D r\u00e9tro et proc\u00e9dural d\u00e9velopp\u00e9 en Python avec l'interface classique Tkinter. Le concept consiste \u00e0 guider un petit cube blanc \u00e0 travers un labyrinthe auto-g\u00e9n\u00e9r\u00e9 pour atteindre une cible rouge. Le jeu int\u00e8gre un algorithme de g\u00e9n\u00e9ration unique : il simule une marche al\u00e9atoire d'un nombre de pas configurable pour tracer le chemin, transformant toutes les cases non visit\u00e9es en murs. Les joueurs peuvent ramasser des bonus marron, mais doivent rester vigilants \u2014 toucher un mur co\u00fbte une vie, r\u00e9initialise la position et retire des points. Cube1 propose un syst\u00e8me de difficult\u00e9 de couleurs : en mode 'Facile', les murs ont des teintes vives, tandis qu'en mode 'Difficile', les couleurs des murs se confondent volontairement avec le fond sombre, le joueur ou la cible, mettant \u00e0 l'\u00e9preuve vos r\u00e9flexes et votre perception visuelle. Enti\u00e8rement compatible avec Python 2.x et Python 3.x.</p>", "funny_comments": [{"user": "RageQuitter99", "rating": 5, "text_en": "Lost all my 5 lives on hardcore difficulty in 2 seconds because I forgot to release the arrow key. 10/10 visual design, the invisible walls in difficult mode are pure evil!", "text_fr": "J'ai perdu mes 5 vies en difficult\u00e9 hardcore en 2 secondes parce que j'ai oubli\u00e9 de rel\u00e2cher les fl\u00e8ches. Design visuel 10/10, les murs invisibles en mode difficile sont diaboliques !"}, {"user": "TkinterEnthusiast", "rating": 4, "text_en": "I accidentally clicked the hidden dark red square on the main menu, and my entire UI got deleted. 10/10, best canvas clear simulation I've ever experienced.", "text_fr": "J'ai accidentellement cliqu\u00e9 sur le carr\u00e9 rouge cach\u00e9 du menu principal, et toute mon interface a disparu. 10/10, meilleure simulation de nettoyage de canvas !"}, {"user": "ColorBlindGamer", "rating": 2, "text_en": "Played on 'Difficult' color mode. The walls were #101010, the background was #000000. I spent 40 minutes navigating a pitch-black screen. 100% psychological horror, 0% visibility.", "text_fr": "J'ai jou\u00e9 en mode de couleur 'Difficile'. Les murs \u00e9taient #101010, le fond \u00e9tait noir. J'ai pass\u00e9 40 minutes \u00e0 naviguer sur un \u00e9cran noir. 100% horreur psychologique, 0% visibilit\u00e9."}, {"user": "Python2Survivor", "rating": 5, "text_en": "The game literally called me 'nul' in French in the terminal when I ran out of lives. Hurt my feelings but it worked perfectly on my ancient Python 2.7 installation!", "text_fr": "Le jeu m'a litt\u00e9ralement trait\u00e9 de 'nul' dans le terminal quand je n'avais plus de vies. \u00c7a a bless\u00e9 mes sentiments, mais \u00e7a a fonctionn\u00e9 \u00e0 merveille sur mon vieux Python 2.7 !"}, {"user": "BonusHunter", "rating": 4, "text_en": "Spent three hours trying to collect all three brown squares on hardcore difficulty, only to die on the final red square because of my shaky finger. My keyboard is now in two pieces.", "text_fr": "J'ai pass\u00e9 trois heures \u00e0 essayer de ramasser les trois carr\u00e9s marron en difficult\u00e9 hardcore, pour finalement mourir sur le dernier carr\u00e9 rouge \u00e0 cause d'un doigt tremblant. Mon clavier est maintenant en deux morceaux."}, {"user": "SpeedrunnerPro", "rating": 5, "text_en": "The scoring algorithm is a mathematical masterpiece. It calculates step count, seconds, and path difficulty. I completed a 6000-step hardcore maze in 9 seconds and ascended to another plane of existence.", "text_fr": "L'algorithme de score est un chef-d'\u0153uvre math\u00e9matique. Il calcule le nombre de pas, les secondes et la difficult\u00e9 du chemin. J'ai fini un labyrinthe hardcore de 6000 pas en 9 secondes et j'ai transcend\u00e9."}, {"user": "BabyModeEnjoyer", "rating": 5, "text_en": "I only play on baby difficulty (10 steps). The path is literally a straight line. I still managed to hit a wall. Don't judge me, 5 stars.", "text_fr": "Je joue uniquement en difficult\u00e9 'baby' (10 pas). Le chemin est litt\u00e9ralement une ligne droite. J'ai quand m\u00eame r\u00e9ussi \u00e0 me prendre un mur. Ne me jugez pas, 5 \u00e9toiles."}, {"user": "NoKeyboardRelease", "rating": 3, "text_en": "The 'Astuces' section said: 'relachez le clavier pour eviter de perdre des vies betement'. I didn't listen. Spawned, died, spawned, died, game over in 0.8 seconds. Read the instructions, people!", "text_fr": "La section 'Astuces' disait : 'relach\u00e9z le clavier pour \u00e9viter de perdre des vies b\u00e8tement'. Je n'ai pas \u00e9cout\u00e9. Apparu, mort, apparu, mort, game over en 0,8 seconde. Lisez les instructions !"}, {"u emory. Fully compatible with both Python 2.x and Python 3.x.</p>", "description_fr": "<p>Cube1 est un jeu d'arcade 2D r\u00e9tro et proc\u00e9dural d\u00e9velopp\u00e9 en Python avec l'interface classique Tkinter. Le concept consiste \u00e0 guider un petit cube blanc \u00e0 travers un labyrinthe auto-g\u00e9n\u00e9r\u00e9 pour atteindre une cible rouge. Le jeu int\u00e8gre un algorithme de g\u00e9n\u00e9ration unique : il simule une marche al\u00e9atoire d'un nombre de pas configurable pour tracer le chemin, transformant toutes les cases non visit\u00e9es en murs. Les joueurs peuvent ramasser des bonus marron, mais doivent rester vigilants \u2014 toucher un mur co\u00fbte une vie, r\u00e9initialise la position et retire des points. Cube1 propose un syst\u00e8me de difficult\u00e9 de couleurs : en mode 'Facile', les murs ont des teintes vives, tandis qu'en mode 'Difficile', les couleurs des murs se confondent volontairement avec le fond sombre, le joueur ou la cible, mettant \u00e0 l'\u00e9preuve vos r\u00e9flexes et votre perception visuelle. Enti\u00e8rement compatible avec Python 2.x et Python 3.x.</p>", "funny_comments": [{"user": "RageQuitter99", "rating": 5, "text_en": "Lost all my 5 lives on hardcore difficulty in 2 seconds because I forgot to release the arrow key. 10/10 visual design, the invisible walls in difficult mode are pure evil!", "text_fr": "J'ai perdu mes 5 vies en difficult\u00e9 hardcore en 2 secondes parce que j'ai oubli\u00e9 de rel\u00e2cher les fl\u00e8ches. Design visuel 10/10, les murs invisibles en mode difficile sont diaboliques !"}, {"user": "TkinterEnthusiast", "rating": 4, "text_en": "I accidentally clicked the hidden dark red square on the main menu, and my entire UI got deleted. 10/10, best canvas clear simulation I've ever experienced.", "text_fr": "J'ai accidentellement cliqu\u00e9 sur le carr\u00e9 rouge cach\u00e9 du menu principal, et toute mon interface a disparu. 10/10, meilleure simulation de nettoyage de canvas !"}, {"user": he path is literally a straight line. I still managed to hit a wall. Don't judge me, 5 stars.", "text_fr": "Je joue uniquement en difficult\u00e9 'baby' (10 pas). Le chemin est litt\u00e9ralement une ligne droite. J'ai quand m\u00eame r\u00e9ussi \u00e0 me prendre un mur. Ne me jugez pas, 5 \u00e9toiles."}, {"user": "NoKeyboardRelease", "rating": 3, "text_en": "The 'Astuces' section said: 'relachez le clavier pour eviter de perdre des vies betement'. I didn't listen. Spawned, died, spawned, died, game over in 0.8 seconds. Read the instructions, people!", "text_fr": "La section 'Astuces' disait : 'relach\u00e9z le clavier pour \u00e9viter de perdre des vies b\u00e8tement'. Je n'ai pas \u00e9cout\u00e9. Apparu, mort, apparu, mort, game over en 0,8 seconde. Lisez les instructions !"}, {"user": "RetroPurist", "rating": 5, "text_en": "The contrast between the white cube, the red target, and the neon walls makes my CRT monitor sing. This is what peak 1995 PC gaming looked like.", "text_fr": "Le contraste entre le cube blanc, la cible rouge et les murs n\u00e9on fait chanter mon moniteur CRT. C'est exactement \u00e0 quoi ressemblait le sommet du jeu PC en 1995."}, {"user": "TkinterHater", "rating": 5, "text_en": "Thank goodness this uses raw Tkinter and not Pygame. No bloated external dependencies to install, just pure, unadulterated standard library power and extreme visual minimalism.", "text_fr": "Dieu merci, cela utilise du pur Tkinter et non Pygame. Pas de d\u00e9pendances externes lourdes \u00e0 installer, juste la puissance de la biblioth\u00e8que standard et un minimalisme visuel extr\u00eame."}], "_source_file": "cube1", "_source_name": "cube1"}, {"name_en": "Cube2", "name_fr": "Cube2", "short_description_en": "An intense 2D procedurally generated maze game in Pygame where you outrun a cloning shadow, gather keys, and master a grappling hook.", "short_description_fr": "Un jeu d'arcade 2D haletant sous Pygame avec labyrinthes proc\u00e9duraux, o\u00f9 vous fuyez un
