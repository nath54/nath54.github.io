}, {"user": "KeyMaster", "rating": 3, "text_en": "Spent 5 minutes finding the last key on Level 80 only for Cube2 to gently tap my shoulder and reset my life. Absolutely beautiful.", "text_fr": "J'ai pass\u00e9 5 minutes \u00e0 chercher la derni\u00e8re cl\u00e9 au niveau 80, pour que Cube2 me tapote doucement l'\u00e9paule et r\u00e9initialise ma vie. C'est magnifique."}, {"user": "GodModeSquare", "rating": 5, "text_en": "Reached Level 100. I can now mathematically predict the trajectory of a pixelated chasing cube. I am ready to rule the cosmos.", "text_fr": "Atteint le niveau 100. Je peux maintenant pr\u00e9dire math\u00e9matiquement la trajectoire d'un cube traqueur en pixels. Je suis pr\u00eat \u00e0 r\u00e9gner sur le cosmos."}, {"user": "GottaCatchEmAll", "rating": 5, "text_en": "Spent hours grind-farming for a Divine skin, only to use a common one because it looks like a cute little television. No regrets.", "text_fr": "J'ai pass\u00e9 des heures \u00e0 farmer pour un skin divin, tout \u00e7a pour utiliser un skin commun parce qu'il ressemble \u00e0 une jolie petite t\u00e9l\u00e9. Aucun regret."}, {"user": "SadDeveloper", "rating": 4, "text_en": "Status: 'Aborted'. Just like my plans to go to the gym. But this game is actually fully finished, polished, and extremely addictive!", "text_fr": "Statut : 'Abandonn\u00e9'. Tout comme mes r\u00e9solutions de faire du sport. Pourtant, ce jeu est fini, poli et extr\u00eamement addictif !"}], "_source_file": "cube2", "_source_name": "cube2"}, "cube2": {"name_en": "Cube2", "name_fr": "Cube2", "short_description_en": "An intense 2D procedurally generated maze game in Pygame where you outrun a cloning shadow, gather keys, and master a grappling hook.", "short_description_fr": "Un jeu d'arcade 2D haletant sous Pygame avec labyrinthes proc\u00e9duraux, o\u00f9 vous fuyez une ombre traqueuse, collectez des cl\u00e9s et ma\u00eetrisez un grappin.", "project_status": "Aborted", "project_type": "Personal", "project_showcase_i leases/download/v0.1-indev/cube3_linux.zip", "class": "btn-code btn-get btn-action", "icon": "fab fa-linux"}, {"name_en": "Macos", "name_fr": "Macos", "url": "https://github.com/nath54/Cube3/releases/download/v0.1-indev/cube3_macos.zip", "class": "btn-code btn-get btn-action", "icon": "fab fa-apple"}, {"name_en": "Android", "name_fr": "Android", "url": "https://github.com/nath54/Cube3/releases/download/v0.1-indev/cube3_android.apk", "class": "btn-code btn-get btn-action", "icon": "fab fa-android"}], "app_version": "0.1", "download_size": "42.1 MB", "tags": ["Godot", "C#", "Game", "3D", "Platformer", "Arcade", "Procedural Generation", "Customization"], "gallery": ["res/screenshots/cube3_1.png", "res/screenshots/cube3_2.png", "res/screenshots/cube3_3.png", "res/screenshots/cube3_4.png"], "description_en": "<p>Cube3 is the third installment in the ultimate Cube platformer series, elevating the franchise to a glorious, neon-drenched 3D dimension. Built entirely in Godot Engine 3 using C# (Mono), Cube3 combines precision physics, dynamic platforming, and gorgeous retro-futuristic visuals. Take control of a custom 3D cube and navigate challenging environments across two distinct game modes: Adventure Mode, featuring handcrafted tutorial and story levels that test your reflexes, and Arcade Mode, utilizing advanced procedural generation to spawn endless custom mazes and platform structures on the fly. Players must reach the level portal without falling into the dark void below, managing their momentum and jumping across shifting spatial layouts. The game features a multi-perspective camera system, allowing players to instantly toggle between an immersive 3rd-person chase camera and a strategic top-down tactical view. Earn n-cubes as in-game currency by completing levels and survival challenges, and spend them in the skin shop to unlock over 16 unique cubic skins. Custom skins are divided into rarity tiers (Common, Rare, Epic, Legendary, Divine, Mythical), ranging from funny homages like a Minecraft-style 'Furnace' and 'Pumpkin', a glowing 'ssj' (Super Saiyan), a rollable 'Dice', to rare animated presets. Customize your experience with four demanding difficulty tiers\u2014from Easy (featuring an automatic HUD arrow pointing to the exit) to Hell (where platforms shrink to a fraction of their size, jumping physics tighten, and no navigational guides exist). Backed by premium post-processing settings including bloom, saturation sliders, custom draw distances, and Screen Space Ambient Occlusion (SAO), Cube3 is a high-octane 3D challenge that pushes cubic platforming to its absolute peak.</p>", "description_fr": "<p>Cube3 est le troisi\u00e8me volet de la c\u00e9l\u00e8bre s\u00e9rie de jeux de plateforme Cube, \u00e9levant la franchise vers une glorieuse troisi\u00e8me dimension baign\u00e9e de n\u00e9ons. D\u00e9velopp\u00e9 enti\u00e8rement sous Godot Engine 3 en C# (Mono), Cube3 associe physique de pr\u00e9cision, plateforme dynamique et graphismes r\u00e9tro-futuristes saisissants. Prenez le contr\u00f4le d'un cube tridimensionnel et parcourez des environnements p\u00e9rilleux \u00e0 travers deux modes de jeu majeurs : le Mode Aventure, avec ses tutoriels et ses niveaux narratifs faits main testant vos r\u00e9flexes, et le Mode Arcade, s'appuyant sur une g\u00e9n\u00e9ration proc\u00e9durale avanc\u00e9e pour concevoir des structures de plateformes et des labyrinthes 3D infinis \u00e0 la vol\u00e9e. Les joueurs doivent atteindre le portail de fin sans basculer dans le vide abyssal en dessous, tout en g\u00e9rant l'inertie et la hauteur des sauts. Le titre int\u00e8gre un syst\u00e8me de double cam\u00e9ra dynamique, permettant de commuter instantan\u00e9ment entre une vue \u00e0 la troisi\u00e8me personne immersive et une vue tactique de dessus (top-down). Gagnez des n-cubes en terminant des niveaux et d\u00e9pensez-les dans la boutique pour d\u00e9bloquer plus de 16 skins cubiques uniques. Les skins sont r\u00e9partis en plusieurs cat\u00e9gories de raret\u00e9 (Commun, Rare, \u00c9pique, L\u00e9gendaire, Divin, Mythique), allant d'hommages amusants comme le 'Four' (Furnace) ou la 'Citrouille' (Pumpkin), un skin rayonnant 'ssj' (Super Saiyan), un d\u00e9 \u00e0 jouer fonctionnel ('de'), jusqu'\u00e0 des mod\u00e8les divins anim\u00e9s. Personnalisez votre d\u00e9fi gr\u00e2ce \u00e0 quatre modes de difficult\u00e9 \u2014 de Facile (avec une fl\u00e8che directionnelle pointant vers la sortie) jusqu'\u00e0 l'Enfer (o\u00f9 les plateformes r\u00e9tr\u00e9cissent drastiquement, les physiques de saut se durcissent et aucun guide n'est fourni). Sublim\u00e9 par des r\u00e9glages post-traitement de premier choix comprenant du bloom (glow), des filtres de saturation, une distance d'affichage ajustable et de l'occlusion ambiante (SAO), Cube3 est un d\u00e9fi 3D effr\u00e9n\u00e9 qui repousse les limites de la plateforme g\u00e9om\u00e9trique.</p>", "funny_comments": [{"user": "3D_Dimensional_Crisis", "rating": 5, "text_en": "I spent two games mastering 2D grids only for the developer to add a Z-axis and make me realize I have zero spatial awareness. 11/10 depth perception is a lie.", "text_fr": "J'ai pass\u00e9 deux jeux \u00e0 ma\u00eetriser les grilles 2D pour que le d\u00e9veloppeur ajoute un axe Z et me fasse r\u00e9aliser que j'ai une perception spatiale de z\u00e9ro. 11/10 la profondeur est un mensonge."}, {"user": "SuperSaiyanSquare", "rating": 5, "text_en": "Unlocked the 'ssj' skin, turned the glow intensity to maximum, and literally blinded myself in real life. My living room now shines brighter than the sun.", "text_fr": "J'ai d\u00e9bloqu\u00e9 le skin 'ssj', mis l'intensit\u00e9 du bloom au maximum, et je me suis litt\u00e9ralement aveugl\u00e9 dans la vraie vie. Mon salon brille plus fort que le soleil."}, {"user": "MinecraftMigrant", "rating": 4, "text_en": "Equipped the Furnace skin and tried to smelt my iron ore. I fell into procedural lava instead. Very realistic, would bake again.", "text_fr": "J'ai \u00e9quip\u00e9 le skin Fourneau et j'ai essay\u00e9 de faire fondre mon minerai de fer. \u00c0 la place, je suis tomb\u00e9 dans de la lave proc\u00e9durale. Tr\u00e8s r\u00e9aliste, je recuirais volontiers."}, {"user": "ArrowBeliever", "rating": 5, "text_en": "Easy mode: 'Just follow the giant arrow, buddy!' Hell mode: 'Figure it out yourself, you are now a blind pixel in a neon void.' I love the emotional roller coaster.", "text_fr": "Mode Facile : 'Suis juste la grosse fl\u00e8che, mon pote !' Mode Enfer : 'D\u00e9brouille-toi tout seul, tu n'es qu'un pixel aveugle dans un vide de n\u00e9ons. J'adore l'ascenseur \u00e9motionnel."}, {"user": "DiceyBusiness", "rating": 3, "text_en": "Equipped the Dice skin, rolled off a cliff, and landed a perfect 6. Does that mean I won? The game over screen says no, but my heart says yes.", "text_fr": "J'ai \u00e9quip\u00e9 le skin D\u00e9, j'ai roul\u00e9 hors d'une falaise et j'ai fait un 6 parfait. Est-ce que \u00e7a veut dire que j'ai gagn\u00e9 ? L'\u00e9cran Game Over dit non, mais mon c\u0153ur dit oui."}, {"user": "GlowInTheDark", "rating": 5, "text_en": "The bloom effect is so beautiful I can feel my graphics card slowly heating my entire house. Thanks developer, I saved money on gas this winter!", "text_fr": "L'effet de bloom est si beau que je sens ma carte graphique chauffer lentement toute ma maison. Merci au d\u00e9veloppeur, j'ai \u00e9conomis\u00e9 sur le chauffage cet hiver !"}, {"user": "TopDownStrategist", "rating": 4, "text_en": "Switched to Top-Down camera hoping to get a better view, only to realize I can now watch myself fall into the lava from a highly professional cinematic perspective.", "text_fr": "Je suis pass\u00e9 en cam\u00e9ra du dessus en esp\u00e9rant mieux voir, pour finalement me rendre compte que je peux maintenant me regarder tomber dans la lave sous un angle de vue tr\u00e8s professionnel."}, {"user": "FrenchCube", "rating": 5, "text_en": "Reaching the end of Level 11 with the 'france' skin while listening to aggressive electro-synth music is the closest thing to absolute cubic patriotism.", "text_fr": "Atteindre la fin du niveau 11 avec le skin 'france' tout en \u00e9coutant de la musique synthwave agressive est ce qui se rapproche le plus du patriotisme cubique absolu."}, {"user": "AbortedHope", "rating": 5, "text_en": "Status: 'Aborted'. But honestly, this game is more complete, optimized, and polished than 90% of the early access games on Steam right now.", "text_fr": "Statut : 'Abandonn\u00e9'. Mais honn\u00eatement, ce jeu est plus complet, optimis\u00e9 et propre que 90% des jeux en acc\u00e8s anticip\u00e9 actuellement sur Steam."}, {"user": "ZeroGravityCube", "rating": 4, "text_en": "My cube fell to Y = -40. My spawnpoint was set directly above the void due to a level design error of my own creation. I am now trapped in an eternal loop of instant death. 10/10.", "text_fr": "Mon cube est tomb\u00e9 \u00e0 Y = -40. Mon point d'apparition s'est retrouv\u00e9 directement au-dessus du vide \u00e0 cause d'une erreur de ma propre cr\u00e9ation. Je suis bloqu\u00e9 dans une boucle \u00e9ternelle. 10/10."}], "_source_file": "cube3", "_source_name": "cube3"}, "cube3": {"name_en": "Cube3", "name_fr": "Cube3", "short_description_en": "A high-octane 3D precision cube-platformer built in Godot and C#, featuring handcrafted adventure levels, procedural arcade mazes, and intense neon aesthetics.", "short_description_fr": "Un jeu de plateforme 3D de pr\u00e9cision intense sous Godot et C#, m\u00ealant niveaux d'aventure faits main, labyrinthes proc\u00e9duraux et esth\u00e9tique n\u00e9on r\u00e9tro-futuriste.", "project_status": "Aborted", "project_type": "Personal", "project_showcase_importance": 3, "icon": "res/icons/icon_project_cube3.png", "links": [{"name_en": "Github", "name_fr": "Github", "url": "https://github.com/nath54/Cube3", "class": "btn-code btn-get btn-action", "icon": "fab fa-github"}, {"name_en": "Windows", "name_fr": "Windows game currency by completing levels and survival challenges, and spend them in the skin shop to unlock over 16 unique cubic skins. Custom skins are divided into rarity tiers (Common, Rare, Epic, Legendary, Divine, Mythical), ranging from funny homages like a Minecraft-style 'Furnace' and 'Pumpkin', a glowing 'ssj' (Super Saiyan), a rollable 'Dice', to rare animated presets. Customize your experience with four demanding difficulty tiers\u2014from Easy (featuring an automatic HUD arrow pointing to the exit) to Hell (where platforms shrink to a fraction of their size, jumping physics tighten, and no navigational guides exist). Backed by premium post-processing settings including bloom, saturation sliders, custom draw distances, and Screen Space Ambient Occlusion (SAO), Cube3 is a high-octane 3D challenge that pushes cubic platforming to its absolute peak.</p>", "description_fr": "<p>Cube3 est le troisi\u00e8me volet de la c\u00e9l\u00e8bre s\u00e9rie de jeux de plateforme Cube, \u00e9levant la franchise vers une glorieuse troisi\u00e8me dimension baign\u00e9e de n\u00e9ons. D\u00e9velopp\u00e9 enti\u00e8rement sous Godot Engine 3 en C# (Mono), Cube3 associe physique de pr\u00e9cision, plateforme dynamique et graphismes r\u00e9tro-futuristes saisissants. Prenez le contr\u00f4le d'un cube tridimensionnel et parcourez des environnements p\u00e9rilleux \u00e0 travers deux modes de jeu majeurs : le Mode Aventure, avec ses tutoriels et ses niveaux narratifs faits main testant vos r\u00e9flexes, et le Mode Arcade, s'appuyant sur une g\u00e9n\u00e9ration proc\u00e9durale avanc\u00e9e pour concevoir des structures de plateformes et des labyrinthes 3D infinis \u00e0 la vol\u00e9e. Les joueurs doivent atteindre le portail de fin sans basculer dans le vide abyssal en dessous, tout en g\u00e9rant l'inertie et la hauteur des sauts. Le titre int\u00e8gre un syst\u00e8me de double cam\u00e9ra dynamique, permettant de commuter instantan\u00e9ment entre une vue \u00e0 la troisi\u00e8me personne immersive et une vue tactique de dessus (top-down). Gagnez des n-cubes en terminant des niveaux et d\u00e9pensez-les dans la boutique pour d\u00e9bloquer plus de 16 skins cubiques uniques. Les skins sont r\u00e9partis en plusieurs cat\u00e9gories de raret\u00e9 (Commun, Rare, \u00c9pique, L\u00e9gendaire, Divin, Mythique), allant d'hommages amusants comme le 'Four' (Furnace) ou la 'Citrouille' (Pumpkin), un skin rayonnant 'ssj' (Super Saiyan), un d\u00e9 \u00e0 jouer fonctionnel ('de'), jusqu'\u00e0 des mod\u00e8les divins anim\u00e9s. Personnalisez votre d\u00e9fi gr\u00e2ce \u00e0 quatre modes de difficult\u00e9 \u2014 de Facile (avec une fl\u00e8che directionnelle pointant vers la sortie) jusqu'\u00e0 l'Enfer (o\u00f9 les plateformes r\u00e9tr\u00e9cissent drastiquement, les physiques de saut se durcissent et aucun guide n'est fourni). Sublim\u00e9 par des r\u00e9glages post-traitement de premier choix comprenant du bloom (glow), des filtres de saturation, une distance d'affichage ajustable et de l'occlusion ambiante (SAO), Cube3 est un d\u00e9fi 3D effr\u00e9n\u00e9 qui repousse les limites de la plateforme g\u00e9om\u00e9trique.</p>", "funny_comments": [{"user": "3D_Dimensional_Crisis", "rating": 5, "text_en": "I spent two games mastering 2D grids only for the developer to add a Z-axis and make me realize I have zero spatial awareness. 11/10 depth perception is a lie.", "text_fr": "J'ai pass\u00e9 deux jeux \u00e0 ma\u00eetriser les grilles 2D pour que le d\u00e9veloppeur ajoute un axe Z et me fasse r\u00e9aliser que j'ai une perception spatiale de z\u00e9ro. 11/10 la profondeur est un mensonge."}, {"user": "SuperSaiyanSquare", "rating": 5, "text_en": "Unlocked the 'ssj' skin, turned the glow intensity to maximum, and literally blinded myself in real life. My living room now shines brighter than the sun.", "text_fr": "J'ai d\u00e9bloqu\u00e9 le skin 'ssj', mis l'intensit\u00e9 du bloom au maximum, et je me suis litt\u00e9ralement aveugl\u00e9 dans la vr 00e9rant mieux voir, pour finalement me rendre compte que je peux maintenant me regarder tomber dans la lave sous un angle de vue tr\u00e8s professionnel."}, {"user": "FrenchCube", "rating": 5, "text_en": "Reaching the end of Level 11 with the 'france' skin while listening to aggressive electro-synth music is the closest thing to absolute cubic patriotism.", "text_fr": "Atteindre la fin du niveau 11 avec le skin 'france' tout en \u00e9coutant de la musique synthwave agressive est ce qui se rapproche le plus du patriotisme cubique absolu."}, {"user": "AbortedHope", "rating": 5, "text_en": "Status: 'Aborted'. But honestly, this game is more complete, optimized, and polished than 90% of the early access games on Steam right now.", "text_fr": "Statut : 'Abandonn\u00e9'. Mais honn\u00eatement, ce jeu est plus complet, optimis\u00e9 et propre que 90% des jeux en acc\u00e8s anticip\u00e9 actuellement sur Steam."}, {"user": "ZeroGravityCube", "rating": 4, "text_en": "My cube fell to Y = -40. My spawnpoint was set directly above the void due to a level design error of my own creation. I am now trapped in an eternal loop of instant death. 10/10.", "text_fr": "Mon cube est tomb\u00e9 \u00e0 Y = -40. Mon point d'apparition s'est retrouv\u00e9 directement au-dessus du vide \u00e0 cause d'une erreur de ma propre cr\u00e9ation. Je suis bloqu\u00e9 dans une boucle \u00e9ternelle. 10/10."}], "_source_file": "cube3", "_source_name": "cube3"}, "cv_creator.yaml": {"name_en": "CV_Creator", "name_fr": "CV_Creator", "short_description_en": "A dynamic, auto-scaling PDF resume generator that perfectly fits your content onto a single page using a custom binary-search layout loop.", "short_description_fr": "Un g\u00e9n\u00e9rateur dynamique de CV PDF \u00e0 mise \u00e0 l'\u00e9chelle automatique qui ajuste parfaitement le contenu sur une page unique gr\u00e2ce \u00e0 une boucle de recherche dichotomique.", "project_status": "Ended", "project_type": "Personal", "project_showcase_importance": 8, "icon": "res/icons/icon_project_cv_creator.png", "links": [{"name_en": "Github", "name_fr": "Github", "url": "https://github.com/nath54/cv_creator", "class": "btn-code btn-get btn-action", "icon": "fab fa-github"}], "app_version": "0.9", "download_size": "-", "tags": ["Python", "PDF", "CV", "FPDF2", "Auto-scaling", "YAML"], "gallery": [], "description_en": "<p>CV_Creator is an intelligent and highly customized resume generator written in Python. It parses structured personal and professional data from human-readable YAML configurations, applies fully customizable styling rules, and renders beautifully typeset PDF CVs. The project features an innovative auto-fitting algorithm: it performs a dynamic search over font sizes and line spacing parameters to scale the layout dynamically, ensuring the generated resume fits perfectly on exactly one page without manual trimming. Supported by two-column asymmetric structures, headers, image rendering, custom margins, and full localization support.</p>", "description_fr": "<p>CV_Creator est un g\u00e9n\u00e9rateur de CV intelligent et hautement personnalis\u00e9 \u00e9crit en Python. Il analyse des donn\u00e9es personnelles et professionnelles structur\u00e9es \u00e0 partir de fichiers YAML lisibles par l'homme, applique des r\u00e8gles de style enti\u00e8rement personnalisables et g\u00e9n\u00e8re des CV PDF magnifiquement mis en page. Le projet int\u00e8gre un algorithme d'auto-ajustement innovant : il effectue une recherche dichotomique sur la taille des polices et l'espacement des lignes pour adapter dynamiquement la mise en page, garantissant que le CV g\u00e9n\u00e9r\u00e9 tient parfaitement sur une seule page sans recadrage manuel. Prend en charge les structures asym\u00e9triques \u00e0 deux colonnes, les en-t\u00eates, le rendu d'images, les marges personnalis\u00e9es et la traduction linguistique.</p>", "funny_comments": [{"user": "BugHunter99", "rating": 5, "text_en": "I put my skills in the YAML and the compiler automatically shrank my '15 years of experience' down to font size 2. Highly recommended!", "text_fr": "J'ai mis mes comp\u00e9tences dans le YAML et le compilateur a automatiquement r\u00e9duit mes '15 ans d'exp\u00e9rience' \u00e0 une taille de police 2. Tr\u00e8s recommand\u00e9 !"}, {"user": "Recruiter_Destroyer", "rating": 5, "text_en": "Finally a tool that doesn't let my resume spill onto page 2 just because of one bullet point! My life is complete.", "text_fr": "Enfin un outil qui n'autorise pas mon CV \u00e0 d\u00e9border sur la page 2 \u00e0 cause d'une seule ligne ! Ma vie est compl\u00e8te."}, {"user": "YamlWhisperer", "rating": 4, "text_en": "Spent 3 hours debugging a missing space in my YAML. Still faster than trying to align a bullet point in MS Word.", "text_fr": "J'ai pass\u00e9 3 heures \u00e0 d\u00e9boguer un espace manquant dans mon YAML. Toujours plus rapide que d'essayer d'aligner une puce sous MS Word."}, {"user": "LoremIpsumEater", "rating": 5, "text_en": "The auto-scaling algorithm shrank my resume so much that recruiters now need a microscope. But hey, it fits on one page!", "text_fr": "L'algorithme de mise \u00e0 l'\u00e9chelle a tellement r\u00e9tr\u00e9ci mon CV que les recruteurs ont besoin d'un microscope. Mais h\u00e9, \u00e7a tient sur une page !"}, {"user": "PythonistaPro", "rating": 5, "text_en": "I tried to add 'Expert in sleeping' to my interests, and the program crashed. Outstanding feature validation!", "text_fr": "J'ai essay\u00e9 d'ajouter 'Expert en sieste' \u00e0 mes int\u00e9r\u00eats, et le programme a plant\u00e9. Excellente validation des fonctionnalit\u00e9s !"}, {"user": "OverqualifiedDev", "rating": 5, "text_en": "My resume was 5 pages long. The binary search shrank the font size to the planck length. I got hired by a quantum physics lab.", "text_fr": "Mon CV faisait 5 pages. La recherche dichotomique a r\u00e9duit la police \u00e0 la longueur de Planck. J'ai \u00e9t\u00e9 embauch\u00e9 par un laboratoire de physique qua project_ifiction_engine.png", "links": [{"name_en": "Github", "name_fr": "Github", "url": "https://github.com/nath54/ifiction_engine", "class": "btn-code btn-get btn-action", "icon": "fab fa-github"}], "app_version": "0.4.2", "download_size": "-", "tags": ["Python", "Engine", "Interactive fiction"], "gallery": [], "description_en": "<p>iFiction Engine is a complete, modular, and lightweight interactive fiction game engine built entirely in Python's standard library. It parses complex natural language command structures (like 'take key', 'put book in shelf with hands', or 'ask merchant about potion') using an intelligent custom tokenizer. The engine is powered by an event-driven scene execution framework that handles conditions, branch jumps, local/global variables, and custom actions. Additionally, a priority queue-based scheduler governs game-time progression and turns, allowing realistic schedules, NPC behaviors, and world ticks. World blueprints use a unified, fully serializable JSON format, meaning there is no functional difference between a game initialization file and a game save file.</p>", "description_fr": "<p>iFiction Engine est un moteur de jeu de fiction interactive complet, modulaire et l\u00e9ger, enti\u00e8rement d\u00e9velopp\u00e9 en Python avec la biblioth\u00e8que standard. Il analyse des structures de commandes complexes en langage naturel (comme 'prendre cl\u00e9', 'mettre livre dans \u00e9tag\u00e8re avec les mains' ou 'demander au marchand \u00e0 propos de la potion') gr\u00e2ce \u00e0 un analyseur syntaxique personnalis\u00e9. Le moteur repose sur un framework d'ex\u00e9cution de sc\u00e8nes pilot\u00e9 par \u00e9v\u00e9nements, g\u00e9rant les conditions, les sauts de branchement, les variables locales/globales et les actions personnalis\u00e9es. De plus, un ordonnanceur bas\u00e9 sur une file d'attente \u00e0 priorit\u00e9 r\u00e9git la progression temporelle du jeu et les tours, permettant des comportements de PNJ et des \u00e9v\u00e9nements d'arri\u00e8re-plan r\u00e9alistes. Les configurations de mondes utilisent un format JSON unifi\u00e9 et s\u00e9rialisable, de sorte qu'il n'y a aucune diff\u00e9rence fonctionnelle entre un fichier d'initialisation de jeu et une sauvegarde.</p>", "funny_comments": [{"user": "GitCommitmentIssues", "rating": 5, "text_en": "Finally, a game engine where I can type 'sprint south-west with bare hands' and not get questioned by local authorities. 10/10 parser!", "text_fr": "Enfin un moteur de jeu o\u00f9 je peux taper 'sprinter vers le sud-ouest les mains vides' sans me faire questionner par les autorit\u00e9s locales. Analyseur 10/10 !"}, {"user": "JSON_Derulo", "rating": 5, "text_en": "I love how game saves and game blueprints are the exact same JSON format. Now my bugs are fully serializable too!", "text_fr": "J'adore le fait que les sauvegardes de jeu et les configurations initiales soient exactement au m\u00eame format JSON. Maintenant, mes bugs aussi sont enti\u00e8rement s\u00e9rialisables !"}, {"user": "TheSpaghettiArchitect", "rating": 4, "text_en": "It took me three hours of reading 'scenes_events_and_actions.md' to realize I could create a recursive room enter event that traps the player in a temporal paradox. Beautiful design.", "text_fr": "Il m'a fallu trois heures de lecture sur 'scenes_events_and_actions.md' pour comprendre comment cr\u00e9er un \u00e9v\u00e9nement r\u00e9cursif d'entr\u00e9e de pi\u00e8ce qui pi\u00e8ge le joueur dans un paradoxe temporel. Un design magnifique."}, {"user": "TerminalIllness", "rating": 5, "text_en": "Who needs 3D Unreal Engine graphics when you have raw CLI mono-spaced text that smells of dusty dungeon hallways? High-quality immersion.", "text_fr": "Qui a besoin de graphismes 3D sous Unreal Engine quand on a du texte brut CLI en police \u00e0 chasse fixe qui sent bon les couloirs poussi\u00e9reux de donjons ? Immersion de haute qualit\u00e9."}, {"user": "BugCatcher", "rating": 5, "text_en": "The natural language parser is so thorough it successfully parsed 'sip red potion with crying face'. I have never felt so understood by a standard library.", "text_fr": "L'analyseur de langage naturel est si complet qu'il a r\u00e9ussi \u00e0 analyser 'siroter la potion rouge avec un visage en pleurs'. Je ne me suis jamais senti aussi bien compris par une biblioth\u00e8que standard."}, {"user": "TimeTraveler99", "rating": 4, "text_en": "The priority queue is so precise that the background train arrived at exactly 14:02:15, but I was busy arguing with a chest and missed the ride. Realism hurts.", "text_fr": "La file d'attente \u00e0 priorit\u00e9 est si pr\u00e9cise que le train en arri\u00e8re-plan est arriv\u00e9 \u00e0 exactement 14:02:15, mais j'\u00e9tais trop occup\u00e9 \u00e0 me disputer avec un coffre et j'ai rat\u00e9 le d\u00e9part. Le r\u00e9alisme fait mal."}, {"user": "KeyboardWarrior", "rating": 5, "text_en": "I typed 'attack bandit with bare hands' and my player character immediately did. I lost, but at least the parser didn't judge my life choices.", "text_fr": "J'ai tap\u00e9 'attaquer le bandit \u00e0 mains nues' et mon personnage l'a fait imm\u00e9diatement. J'ai perdu, mais au moins l'analyseur n'a pas jug\u00e9 mes choix de vie."}, {"user": "StandardLibPurist", "rating": 5, "text_en": "Zero external dependencies. No pip install. Pure python. This code is so clean I'm using it as a soap substitute.", "text_fr": "Z\u00e9ro d\u00e9pendance externe. Pas de pip install. Du pur Python. Ce code est tellement propre que je l'utilise comme substitut de savon."}, {"user": "NPC_Rights_Activist", "rating": 5, "text_en": "Finally, NPCs that operate on a scheduler and take actions. They have schedules and jobs, which means they are more productive than me.", "text_fr": "Enfin des PNJ qui fonctionnent avec un planificateur et prennent des mesures. Ils ont des horaires et des emplois, ce qui signifie qu'ils sont plus productifs que moi."}, {"user": "LazyCoder", "rating": 5, "text_en": "I s h bare hands' and my player character immediately did. I lost, but at least the parser didn't judge my life choices.", "text_fr": "J'ai tap\u00e9 'attaquer le bandit \u00e0 mains nues' et mon personnage l'a fait imm\u00e9diatement. J'ai perdu, mais au moins l'analyseur n'a pas jug\u00e9 mes choix de vie."}, {"user": "StandardLibPurist", "rating": 5, "text_en": "Zero external dependencies. No pip install. Pure python. This code is so clean I'm using it as a soap substitute.", "text_fr": "Z\u00e9ro d\u00e9pendance externe. Pas de pip install. Du pur Python. Ce code est tellement propre que je l'utilise comme substitut de savon."}, {"user": "NPC_Rights_Activist", "rating": 5, "text_en": "Finally, NPCs that operate on a scheduler and take actions. They have schedules and jobs, which means they are more productive than me.", "text_fr": "Enfin des PNJ qui fonctionnent avec un planificateur et prennent des mesures. Ils ont des horaires et des emplois, ce qui signifie qu'ils sont plus productifs que moi."}, {"user": "LazyCoder", "rating": 5, "text_en": "I started writing an interactive story about my daily routine but the engine threw a SyntaxError. Even the compiler knows my life lacks structure.", "text_fr": "J'ai commenc\u00e9 \u00e0 \u00e9crire une histoire interactive sur ma routine quotidienne mais le moteur a renvoy\u00e9 une SyntaxError. M\u00eame le compilateur sait que ma vie manque de structure."}], "_source_file": "ifiction_engine", "_source_name": "ifiction_engine"}, "nalang.yaml": {"name_en": "NaLang", "name_fr": "NaLang", "short_description_en": "A playful, premium multi-language learning application built with the Godot engine, featuring custom vocabulary flashcards, written quizzes with Levenshtein-based spelling validation, and parallel multi-language dialogues.", "short_description_fr": "Une application ludique et compl\u00e8te d'apprentissage des langues con\u00e7ue avec Godot, proposant des fiches personnalis\u00e9es, des quiz \u00e9crits avec validation orthographique par distance de Levenshtein, et des dialogues parall\u00e8les multi-langues.", "project_status": "Ended", "project_type": "Personal", "project_showcase_importance": 4, "icon": "res/icons/icon_project_nalang.png", "links": [{"name_en": "Github", "name_fr": "Github", "url": "https://github.com/nath54/NaLang", "class": "btn-code btn-get btn-action", "icon": "fab fa-github"}, {"name_en": "Linux", "name_fr": "Linux", "url": "https://github.com/nath54/NaLang/releases/download/v0.9.4.4/NaLang_LinuxVersion.x86_64", "class": "btn-code btn-get btn-action", "icon": "fab fa-linux"}, {"name_en": "Windows", "name_fr": "Windows", "url": "https://github.com/nath54/NaLang/releases/download/v0.9.4.4/NaLang_WindowsVersion.exe", "class": "btn-code btn-get btn-action", "icon": "fab fa-windows"}, {"name_en": "Android", "name_fr": "Android", "url": "https://github.com/nath54/NaLang/releases/download/v0.9.4.4/NaLang_AndroidVersion.apk", "class": "btn-code btn-get btn-action", "icon": "fab fa-android"}], "app_version": "0.9.4.4", "download_size": "71.7 MB", "tags": ["Godot", "GDScript", "Language", "Learning"], "gallery": ["res/screenshots/nalang_2.png", "res/screenshots/nalang_3.png", "res/screenshots/nalang_4.png", "res/screenshots/nalang_5.png", "res/screenshots/nalang_6.png", "res/screenshots/nalang_7.png", "res/screenshots/nalang_8.png"], "description_en": "<p>NaLang is a professional, feature-rich multi-language learning dashboard built on Godot 4.2. Designed to facilitate language acquisition through structured lessons, active recall flashcards, and interactive testing, it offers a comprehensive system for learners. The app features structured lesson pages with rich BBCode-formatted layouts for grammar, pronunciation, and conjugation; customizable vocabulary flashcards (fiches) that users can create, edit, and organize locally; a dual-mode testing engine offering either visual flashcard reviews or written answers; an advanced evaluation algorithm employing a custom Levenshtein distance check with Unicode-aware text normalization; and multi-lingual conversation guides for real-world scenarios. Supported target languages include Spanish, English, German, Mandarin Chinese, Japanese, Korean, and Russian.</p>", "description_fr": "<p>NaLang est un tableau de bord complet et professionnel d'apprentissage multi-langues con\u00e7u sous Godot 4.2. Pens\u00e9 pour faciliter l'apprentissage par le biais de le\u00e7ons structur\u00e9es, de flashcards \u00e0 rappel actif et d'exercices interactifs, l'application propose un syst\u00e8me extr\u00eamement robuste. Elle int\u00e8gre des fiches de cours structur\u00e9es avec un rendu BBCode riche pour la grammaire, la prononciation et la conjugaison ; des fiches de vocabulaire personnalisables (fiches) que les utilisateurs peuvent cr\u00e9er, \u00e9diter et organiser localement ; un moteur de quiz double proposant des r\u00e9visions visuelles de cartes ou des r\u00e9ponses \u00e9crites ; un algorithme d'\u00e9valuation avanc\u00e9 utilisant la distance de Levenshtein avec normalisation de texte pour tol\u00e9rer les fautes de frappe mineures ; et des guides de conversation parall\u00e8les multi-langues pour des situations r\u00e9elles. Les langues cibles prises en charge incluent l'espagnol, l'anglais, l'allemand, le chinois mandarin, le japonais, le cor\u00e9en et le russe.</p>", "funny_comments": [{"user": "PolyglotWannabe", "rating": 5, "text_en": "I wanted to learn Spanish, but the Levenshtein distance was so forgiving that it convinced me that 'hola' and 'cola' are practically the same word. 10/10, now ordering soft drinks in Madrid.", "text_fr": "Je voulais apprendre l'espagnol, mais la distance de Levenshtein est si indulgente qu'elle m'a convaincu que 'hola' et 'cola' sont le m\u00eame mot. 10/10, je commande d\u00e9sormais des sodas \u00e0 Madrid."}, {"user": "GDScriptFanatic", "rating": 5, "text_en": "A serious language learning app built with a game engine. I keep waiting for a boss fight against the irregular verbs, but so far it's just conjugations.", "text_fr": "Une application s\u00e9rieuse d'apprentissage des langues cod\u00e9e avec un moteur de jeu. J'attends toujours le combat de boss contre les verbes irr\u00e9guliers, mais pour l'instant ce ne sont que des conjugaisons."}, {"user": "TypoMaster", "rating": 5, "text_en": "The custom text normalizer replaces every accented character and strips all punctuation. Finally, an application that accepts my keyboard mashings as fluent Spanish.", "text_fr": "Le normalisateur de texte remplace chaque caract\u00e8re accentu\u00e9 et supprime toute la ponctuation. Enfin une application qui accepte mes frappes fr\u00e9n\u00e9tiques comme de l'espagnol courant."}, {"user": "RestaurantReviewer", "rating": 4, "text_en": "The restaurant dialogue has placeholders like Restaurant Name and Dish 1. I went to a bistro in Paris, ordered Dish 2, and they brought me a bowl of hot water. Highly authentic.", "text_fr": "Le dialogue du restaurant a des espaces r\u00e9serv\u00e9s comme Nom du Restaurant et Plat 1. Je suis all\u00e9 dans un bistrot \u00e0 Paris, j'ai command\u00e9 Plat 2, et on m'a apport\u00e9 un bol d'eau chaude. Tr\u00e8s authentique."}, {"user": "BugFinder", "rating": 5, "text_en": "Translating from Spanish to French in written mode evaluates my French answer against the Spanish solution. My Spanish is now perfect, though my French is severely compromised.", "text_fr": "Traduire de l'espagnol vers le fran\u00e7ais en mode \u00e9crit \u00e9value ma r\u00e9ponse en fran\u00e7ais par rapport \u00e0 la solution en espagnol. Mon espagnol est maintenant parfait, bien que mon fran\u00e7ais soit gravement compromis."}, {"user": "LowProcessorSaver", "rating": 5, "text_en": "It runs in low processor mode. This is amazing because my phone can now survive a 3-hour session of me failing simple German quizzes without heating up like a toaster.", "text_fr": "L'application fonctionne en mode processeur bas. C'est incroyable car mon t\u00e9l\u00e9phone peut d\u00e9sormais survivre \u00e0 3 heures de quiz d'allemand rat\u00e9s sans surchauffer comme un grille-pain."}, {"user": "CustomCardCreator", "rating": 5, "text_en": "I created a custom vocabulary sheet with only one card to feel good about myself. I now score 100 percent on every single quiz. Easiest fluency of my life.", "text_fr": "J'ai cr\u00e9\u00e9 une fiche personnalis\u00e9e avec une seule carte pour me sentir bien. J'obtiens maintenant 100 pour cent \u00e0 chaque quiz. L'apprentissage le plus facile de ma vie."}, {"user": "RussianLearner", "rating": 4, "text_en": "I noticed Russian was commented out in the global languages dictionary but fully defined in the vocabulary files. It's like a secret expansion pack waiting to be unlocked.", "text_fr": "J'ai remarqu\u00e9 que le russe \u00e9tait comment\u00e9 dans le dictionnaire global des langues mais d\u00e9fini dans les fichiers de vocabulaire. C'est comme une extension secr\u00e8te qui attend d'\u00eatre d\u00e9bloqu\u00e9e."}, {"user": "BBCodeEnthusiast", "rating": 5, "text_en": "The parser in verify_errors.py checks for nested color tags. It's like having a compiler warning for my flashcard aesthetic. Beautifully overengineered.", "text_fr": "Le parseur dans verify_errors.py v\u00e9rifie les balises de couleur imbriqu\u00e9es. C'est comme avoir un avertissement de compilateur pour l'esth\u00e9tique de mes fiches de r\u00e9vision. Magnifiquement surcon\u00e7u."}, {"user": "AccidentalPolyglot", "rating": 5, "text_en": "I accidentally changed the destination language to Mandarin Chinese in the settings, and now the entire app is trying to teach me symbols. I am terrified, but I can now say yellow in three tones.", "text_fr": "J'ai accidentellement chang\u00e9 la langue cible en chinois mandarin dans les param\u00e8tres, et maintenant toute l'application essaie de m'enseigner des symboles. J'ai peur, mais je sais dire jaune en trois tons."}], "_source_file": "nalang", n\u00e7u."}, {"user": "AccidentalPolyglot", "rating": 5, "text_en": "I accidentally changed the destination language to Mandarin Chinese in the settings, and now the entire app is trying to teach me symbols. I am terrified, but I can now say yellow in three tones.", "text_fr": "J'ai accidentellement chang\u00e9 la langue cible en chinois mandarin dans les param\u00e8tres, et maintenant toute l'application essaie de m'enseigner des symboles. J'ai peur, mais je sais dire jaune en trois tons."}], "_source_file": "nalang", "_source_name": "nalang"}, "napp_engine_compiler.yaml": {"name_en": "Napp Engine Compiler", "name_fr": "Napp Engine Compiler", "short_description_en": "A modular cross-platform transpiler compiling NaXML, NaStyle, and NaCode into highly responsive WebJS (HTML5/JS) and native desktop PySide6 apps.", "short_description_fr": "Un transpilateur multi-cible modulaire compilant NaXML, NaStyle et NaCode en applications web r\u00e9actives (WebJS) et de bureau natives (PySide6).", "project_status": "Ended", "project_type": "Personal", "project_showcase_importance": 15, "icon": "res/icons/icon_project_napp_engine_compiler.png", "links": [{"name_en": "Github", "name_fr": "Github", "url": "https://github.com/nath54/napp_engine_compiler", "class": "btn-code btn-get btn-action", "icon": "fab fa-github"}], "app_version": "0.1.2", "download_size": "-", "tags": ["Python", "Compilation", "Dev", "Engine"], "gallery": [], "description_en": "<p>The Napp Engine Compiler is a high-performance, modular, multi-target transpiler designed to compile unified NApp projects into responsive, dependency-free single-page web applications (WebJS) and native desktop window applications (PySide6/Qt6). By strictly decoupling declarative UI layouts (NaXML), custom style schemas (NaStyle), strongly typed mid-end logic (NaCode), and native system calls, it enables full cross-platform execution with a single unified codebase.</p>\n<p>The compiler engine features a robust parsing pipeline powered by Lark grammars, syntax-to-AST translation layers, type checking, and semantic validation before generating optimized intermediate representations. It also integrates an emulation-based interactive macOS-style terminal overlay in the browser, local storage proxies, sound control engines, network fetch interfaces, and clipboard hardware controllers, along with an auto-unlocking/kill system to release active Windows ports and file locks during development iterations.</p>", "description_fr": "<p>Le compilateur Napp Engine est un transpilateur modulaire et performant con\u00e7u pour compiler des projets NApp unifi\u00e9s en applications web r\u00e9actives \u00e0 page unique (WebJS) et en applications de bureau natives (PySide6/Qt6). Gr\u00e2ce \u00e0 un d\u00e9couplage rigoureux entre les interfaces utilisateur d\u00e9claratives (NaXML), les feuilles de style (NaStyle), la logique fortement typ\u00e9e (NaCode) et les API syst\u00e8me globales, il permet une ex\u00e9cution multiplateforme fluide avec une unique base de code.</p>\n<p>Le compilateur int\u00e8gre un pipeline d'analyse robuste bas\u00e9 sur des grammaires Lark, une validation s\u00e9mantique stricte et un gestionnaire de types unifi\u00e9 pour s\u00e9curiser la g\u00e9n\u00e9ration du code. Il prend \u00e9galement en charge une \u00e9mulation de terminal graphique interactive au style macOS dans le navigateur, des proxies de persistance locale, des lecteurs audio/vid\u00e9o int\u00e9gr\u00e9s, des requ\u00eates HTTP distantes et des contr\u00f4les de presse-papiers physiques, \u00e9paul\u00e9s par un syst\u00e8me de d\u00e9verrouillage de ports et de processus Windows pour simplifier le d\u00e9veloppement.</p>", "funny_comments": [{"user": "BugHunter99", "rating": 5, "text_en": "The compiler's Windows port auto-unlocker is so aggressive, it closed my browser, my IDE, and terminated my apartment lease.", "text_fr": "Le d\u00e9bloqueur de port Windows du compilateur est si agressif qu'il a ferm\u00e9 mon navigateur, mon IDE et a r\u00e9sili\u00e9 mon bail de location."}, {"user": "LarkWhisperer", "rating": 4, "text_en": "I tried using Lark to parse my life choices, but got a Shift/Reduce conflict on 'eating pizza at 3 AM'.", "text_fr": "J'ai essay\u00e9 d'utiliser Lark pour analyser mes choix de vie, mais j'ai obtenu un conflit Shift/Reduce sur 'manger une pizza \u00e0 3h du matin'."}, {"user": "PySideSurvivor", "rating": 5, "text_en": "The PySide6 fallback is so retro, I half-expected the compiler to ask for a floppy disk.", "text_fr": "Le repli vers PySide6 est tellement r\u00e9tro que je m'attendais presque \u00e0 ce que le compilateur me demande une disquette."}, {"user": "CssWizard", "rating": 3, "text_en": "Compiled my UI, and the grid layout is so responsive it responded by leaving the screen.", "text_fr": "J'ai compil\u00e9 mon UI, et la disposition en grille est si r\u00e9active qu'elle a r\u00e9agi en quittant l'\u00e9cran."}, {"user": "GitGud", "rating": 5, "text_en": "Implemented the Undo/Redo history stack, but I still can't undo my career path.", "text_fr": "J'ai impl\u00e9ment\u00e9 la pile d'historique Undo/Redo, mais je ne peux toujours pas annuler mes choix de carri\u00e8re."}, {"user": "TypeSafetyFirst", "rating": 4, "text_en": "The compiler rejected my 'any' type because it had an existential crisis and preferred to be 'void'.", "text_fr": "Le compilateur a rejet\u00e9 mon type 'any' parce qu'il faisait une crise existentielle et pr\u00e9f\u00e9rait \u00eatre 'void'."}, {"user": "NoGPSNeeded", "rating": 5, "text_en": "The GPS locator always returns (0, 0). Perfect for avoiding git blame and bug reports.", "text_fr": "Le localisateur GPS renvoie toujours (0, 0). Parfait pour \u00e9viter le git blame et les rapports de bogues."}, {"user": "CacheIsKing", "rating": 4, "text_en": "Local Storage falls back to native file writing. Now my settings are saved in a .txt file next to my childhood photos.", "text_fr": "Le stockage local se rabat sur l'\u00e9criture de fichiers natifs. Maintenant, mes param\u00e8tres sont sauvegard\u00e9s dans un fichier .txt \u00e0 c\u00f4t\u00e9 de mes photos d'enfance."}, {"user": "FrenchDev", "rating": 5, "text_en": "The bilingual engine is amazing, but naming a variable 'pain_au_chocolat' throws a compilation error in Toulouse.", "text_fr": "Le moteur bilingue est incroyable, mais nommer une variable 'chocolatine' l\u00e8ve une erreur de compilation \u00e0 Paris."}, {"user": "CompilerOptimist", "rating": 5, "text_en": "0 errors, 1428 warnings. Mostly the compiler asking if I've touched grass recently. 10/10 feature.", "text_fr": "0 erreur, 1428 avertissements. Principalement le compilateur me demandant si j'ai touch\u00e9 de l'herbe r\u00e9cemment. Fonctionnalit\u00e9 10/10."}], "_source_file": "napp_engine_compiler", "_source_name": "napp_engine_compiler"}, "napp_engine_compiler": {"name_en": "Napp Engine Compiler", "name_fr": "Napp Engine Compiler", "short_description_en": "A modular cross-platform transpiler compiling NaXML, NaStyle, and NaCode into highly responsive WebJS (HTML5/JS) and native desktop PySide6 apps.", "short_description_fr": "Un transpilateur multi-cible modulaire compilant NaXML, NaStyle et NaCode en applications web r\u00e9actives (WebJS) et de bureau natives (PySide6).", "project_status": "Ended", "project_type": "Personal", "project_showcase_importance": 15, "icon": "res/icons/icon_project_napp_engine_compiler.png", "links": [{"name_en": "Github", "name_fr": "Github", "url": "https://github.com/nath54/napp_engine_compiler", "class": "btn-code btn-get btn-action", "icon": "fab fa-github"}], "app_version": "0.1.2", "download_size": "-", "tags": ["Python", "Compilation", "Dev", "Engine"], "gallery": [], "description_en": "<p>The Napp Engine Compiler is a high-performance, modular, multi-target transpiler designed to compile unified NApp projects into responsive, dependency-free single-page web applications (WebJS) and native desktop window applications (PySide6/Qt6). By strictly decoupling declarative UI layouts (NaXML), custom style schemas (NaStyle), strongly typed mid-end logic (NaCode), and native system calls, it enables full cross-platform execution with a single unified codebase.</p>\n<p>The compiler engine features a robust parsing pipeline powered by Lark grammars, syntax-to-AST translation layers, type checking, and semantic validation before generating optimized intermediate representations. It also integrates an emulation-based interactive macOS-style terminal overlay in the browser, local storage proxies, sound control engines, network fetch interfaces, and clipboard hardware controllers, along with an auto-unlocking/kill system to release active Windows ports and file locks during development iterations.</p>", "description_fr": "<p>Le compilateur Napp Engine est un transpilateur modulaire et performant con\u00e7u pour compiler des projets NApp unifi\u00e9s en applications web r\u00e9actives \u00e0 page unique (WebJS) et en applications de bureau natives (PySide6/Qt6). Gr\u00e2ce \u00e0 un d\u00e9couplage rigoureux entre les interfaces utilisateur d\u00e9claratives (NaXML), les feuilles de style (NaStyle), la logique fortement typ\u00e9e (NaCode) et les API syst\u00e8me globales, il permet une ex\u00e9cution multiplateforme fluide avec une unique base de code.</p>\n<p>Le compilateur int\u00e8gre un pipeline d'analyse robuste bas\u00e9 sur des grammaires Lark, une validation s\u00e9mantique stricte et un gestionnaire de types unifi\u00e9 pour s\u00e9curiser la g\u00e9n\u00e9ration du code. Il prend \u00e9galement en charge une \u00e9mulation de terminal graphique interactive au style macOS dans le navigateur, des proxies de persistance locale, des lecteurs audio/vid\u00e9o int\u00e9gr\u00e9s, des requ\u00eates HTTP distantes et des contr\u00f4les de presse-papiers physiques, \u00e9paul\u00e9s par un syst\u00e8me de d\u00e9verrouillage de ports et de processus Windows pour simplifier le d\u00e9veloppement.</p>",
