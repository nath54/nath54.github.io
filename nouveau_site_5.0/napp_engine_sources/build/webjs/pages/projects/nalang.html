e ombre traqueuse, collectez des cl\u00e9s et ma\u00eetrisez un grappin.", "project_status": "Aborted", "project_type": "Personal", "project_showcase_importance": 2, "icon": "res/icons/icon_project_cube2.png", "links": [{"name_en": "Github", "name_fr": "Github", "url": "https://github.com/nath54/cube2", "class": "btn-code btn-get btn-action", "icon": "fab fa-github"}, {"name_en": "Windows", "name_fr": "Windows", "url": "https://github.com/nath54/cube2/releases/download/2.2/main.zip", "class": "btn-code btn-get btn-action", "icon": "fab fa-windows"}], "app_version": "2.2", "download_size": "31.4 MB", "tags": ["Python", "Game", "2D", "Pygame", "Arcade", "Procedural Generation", "Grappling Hook", "Retro", "Customization"], "gallery": ["res/screenshots/cube2_1.png", "res/screenshots/cube2_2.png", "res/screenshots/cube2_3.png"], "description_en": "<p>Cube2 is a fast-paced 2D arcade-puzzle game built entirely in Python using Pygame. Players navigate randomly generated, color-contrasting mazes with a single goal: reach the exit. But there's a catch\u2014you are chased by a sinister clone (Cube2) that replicates your exact movements with a slight delay, draining your health upon contact. Collect hidden keys to unlock locked exits, evade blinking hazard traps, and survive the collapsing time limit bar at the top of the screen. Reaching Level 10 unlocks a powerful Grappling Hook, allowing high-speed traversal across hallways, provided no walls block your line of sight. Cube2 features a deep progression system with 23 unlockable achievements and over 76 unique player skins divided into color-coded rarity tiers (Common, Rare, Epic, Legendary, Divine), including multi-frame animated skins and rotation mechanics. With 5 difficulty modes (from Very Easy with directional assistance to instant-death Hardcore), an 'Eye-Saver' softer rendering option, custom keyboard mapping, and native joystick support, Cube2 is a complete and highly addictive arcade experience.</p>", "description_fr": "<p>Cube2 est un jeu d'arcade-puzzle 2D effr\u00e9n\u00e9 d\u00e9velopp\u00e9 enti\u00e8rement en Python avec Pygame. Les joueurs naviguent dans des labyrinthes g\u00e9n\u00e9r\u00e9s de mani\u00e8re proc\u00e9durale aux couleurs contrast\u00e9es avec un seul but : atteindre la sortie. Mais attention : vous \u00eates poursuivi par un double mal\u00e9fique (Cube2) qui reproduit exactement vos mouvements avec un l\u00e9ger d\u00e9calage, vidant votre sant\u00e9 s'il vous touche. Collectez des cl\u00e9s cach\u00e9es pour d\u00e9verrouiller la sortie, \u00e9vitez les pi\u00e8ges clignotants et survivez avant que la barre de temps au sommet de l'\u00e9cran ne s'\u00e9puise. Atteindre le niveau 10 d\u00e9bloque un puissant Grappin, permettant de vous propulser \u00e0 grande vitesse dans les couloirs en \u00e9vitant les obstacles directs. Le jeu propose un syst\u00e8me de progression riche avec 23 succ\u00e8s \u00e0 d\u00e9bloquer et plus de 76 skins de joueur uniques r\u00e9partis en raret\u00e9s de couleurs distinctes (Commun, Rare, \u00c9pique, L\u00e9gendaire, Divin), incluant des animations multi-images et des rotations de mouvement. Avec 5 modes de difficult\u00e9 (de Tr\u00e8s Facile avec fl\u00e8ches indicatrices \u00e0 Hardcore avec mort instantan\u00e9e), une option de couleurs douces pour prot\u00e9ger vos yeux, la configuration personnalis\u00e9e des touches et le support manette natif, Cube2 offre une exp\u00e9rience d'arcade compl\u00e8te et addictive.</p>", "funny_comments": [{"user": "ShadowHater99", "rating": 5, "text_en": "Cube2 is like my anxiety: it follows me exactly where I go, but slightly delayed and kills me if I stop moving.", "text_fr": "Cube2 est comme mon anxi\u00e9t\u00e9 : il me suit exactement l\u00e0 o\u00f9 je vais, avec un l\u00e9ger retard, et me tue si j'arr\u00eate de bouger."}, {"user": "SpideySquare", "rating": 4, "text_en": "I unlocked the grappling hook at level 10 and immediately pulled myself straight into a solid wall. 10/10 would die again.", "text_fr": "J'ai d\u00e9bloqu\u00e9 le grappin au niveau 10 et je me suis imm\u00e9diatement propuls\u00e9 dans un mur solide. 10/10, je mourrais \u00e0 nouveau."}, {"user": "CheatCodeEnthusiast", "rating": 5, "text_en": "Pressing C-U-B-E and Enter solved my skill issue by unlocking all 76 skins. My cube is now divine even if my gameplay is absolute trash.", "text_fr": "Taper C-U-B-E et Entr\u00e9e a r\u00e9solu mon manque de talent en d\u00e9bloquant les 76 skins. Mon cube est divin m\u00eame si mon niveau de jeu est \u00e9clat\u00e9."}, {"user": "RageQuitterMax", "rating": 1, "text_en": "Played on Hardcore mode. Breathing too loudly apparently counts as colliding with a wall. My keyboard is now in two pieces.", "text_fr": "J'ai jou\u00e9 en mode Hardcore. Respirer trop fort compte apparemment comme une collision avec un mur. Mon clavier est maintenant en deux morceaux."}, {"user": "NoMoreGlasses", "rating": 5, "text_en": "The 'Couleurs douces' option saved my eyes from the randomized neon hell. My ophthalmologist sends his warmest regards.", "text_fr": "L'option 'Couleurs douces' a sauv\u00e9 mes yeux de l'enfer n\u00e9on al\u00e9atoire. Mon ophtalmologiste vous envoie ses amiti\u00e9s."}, {"user": "TickTockCube", "rating": 4, "text_en": "The top timer bar shrinking makes me sweat more than an actual cardio session. Who knew a white square could cause high blood pressure?", "text_fr": "La barre de temps qui r\u00e9tr\u00e9cit me fait plus transpirer qu'une s\u00e9ance de cardio. Qui savait qu'un carr\u00e9 blanc pouvait causer de l'hypertension ?"}, {"user": "KeyMaster", "rating": 3, "text_en": "Spent 5 minutes finding the last key on Level 80 only for Cube2 to gently tap my shoulder and reset my life. Absolutely beautiful.", "text_fr": "J'ai pass\u00e9 5 minutes \u00e0 chercher la derni\u00e8re cl\u00e9 au niveau 80, pour que Cube2 me tapote doucement l'\u00e9paule et r\u00e9initialise ma vie. C'est magnifique."}, {"user": "GodModeSquare", "rating": 5, "text_en": "Reached Level 100. I can now mathematically predict the trajectory of a pixelated chasing cube. I am ready to rule the cosmos.", "text_fr": "Atteint le niveau 100. Je peux maintenant pr\u00e9dire math\u00e9matiquement la trajectoire d'un cube traqueur en pixels. Je suis pr\u00eat \u00e0 r\u00e9gner sur le cosmos."}, {"user": "GottaCatchEmAll", "rating": 5, "text_en": "Spent hours grind-farming for a Divine skin, only to use a common one because it looks like a cute little television. No regrets.", "text_fr": "J'ai pass\u00e9 des heures \u00e0 farmer pour un skin divin, tout \u00e7a pour utiliser un skin commun parce qu'il ressemble \u00e0 une jolie petite t\u00e9l\u00e9. Aucun regret."}, {"user": "SadDeveloper", "rating": 4, "text_en": "Status: 'Aborted'. Just like my plans to go to the gym. But this game is actually fully finished, polished, and extremely addictive!", "text_fr": "Statut : 'Abandonn\u00e9'. Tout comme mes r\u00e9solutions de faire du sport. Pourtant, ce jeu est fini, poli et extr\u00eamement addictif !"}], "_source_file": "cube2", "_source_name": "cube2"}, {"name_en": "Cube3", "name_fr": "Cube3", "short_description_en": "A high-octane 3D precision cube-platformer built in Godot and C#, featuring handcrafted adventure levels, procedural arcade mazes, and intense neon aesthetics.", "short_description_fr": "Un jeu de plateforme 3D de pr\u00e9cision intense sous Godot et C#, m\u00ealant niveaux d'aventure faits main, labyrinthes proc\u00e9duraux et esth\u00e9tique n\u00e9on r\u00e9tro-futuriste.", "project_status": "Aborted", "project_type": "Personal", "project_showcase_importance": 3, "icon": "res/icons/icon_project_cube3.png", "links": [{"name_en": "Github", "name_fr": "Github", "url": "https://github.com/nath54/Cube3", "class": "btn-code btn-get btn-action", "icon": "fab fa-github"}, {"name_en": "Windows", "name_fr": "Windows", "url": "https://github.com/nath54/Cube3/releases/download/v0.1-indev/cube3_windows.zip", "class": "btn-code btn-get btn-action", "icon": "fab fa-windows"}, {"name_en": "Linux", "name_fr": "Linux", "url": "https://github.com/nath54/Cube3/releases/download/v0.1-indev/cube3_linux.zip", "class": "btn-code btn-get btn-action", "icon": "fab fa-linux"}, {"name_en": "Macos", "name_fr": "Macos", "url": "https://github.com/nath54/Cube3/releases/download/v0.1-indev/cube3_macos.zip", "class": "btn-code btn-get btn-action", "icon": "fab fa-apple"}, {"name_en": "Android", "name_fr": "Android", "url": "https://github.com/nath54/Cube3/releases/download/v0.1-indev/cube3_android.apk", "class": "btn-code btn-get btn-action", "icon": "fab fa-android"}], "app_version": "0.1", "download_size": "42.1 MB", "tags": ["Godot", "C#", "Game", "3D", "Platformer", "Arcade", "Procedural Generation", "Customization"], "gallery": ["res/screenshots/cube3_1.png", "res/screenshots/cube3_2.png", "res/screenshots/cube3_3.png", "res/screenshots/cube3_4.png"], "description_en": "<p>Cube3 is the third installment in the ultimate Cube platformer series, elevating the franchise to a glorious, neon-drenched 3D dimension. Built entirely in Godot Engine 3 using C# (Mono), Cube3 combines precision physics, dynamic platforming, and gorgeous retro-futuristic visuals. Take control of a custom 3D cube and navigate challenging environments across two distinct game modes: Adventure Mode, featuring handcrafted tutorial and story levels that test your reflexes, and Arcade Mode, utilizing advanced procedural generation to spawn endless custom mazes and platform structures on the fly. Players must reach the level portal without falling into the dark void below, managing their momentum and jumping across shifting spatial layouts. The game features a multi-perspective camera system, allowing players to instantly toggle between an immersive 3rd-person chase camera and a strategic top-down tactical view. Earn n-cubes as in-game currency by completing levels and survival challenges, and spend them in the skin shop to unlock over 16 unique cubic skins. Custom skins are divided into rarity tiers (Common, Rare, Epic, Legendary, Divine, Mythical), ranging from funny homages like a Minecraft-style 'Furnace' and 'Pumpkin', a glowing 'ssj' (Super Saiyan), a rollable 'Dice', to rare animated presets. Customize your experience with four demanding difficulty tiers\u2014from Easy (featuring an automatic HUD arrow pointing to the exit) to Hell (where platforms shrink to a fraction of their size, jumping physics tighten, and no navigational guides exist). Backed by premium post-processing settings including bloom, saturation sliders, custom draw distances, and Screen Space Ambient Occlusion (SAO), Cube3 is a high-octane 3D challenge that pushes cubic platforming to its absolute peak.</p>", "description_fr": "<p>Cube3 est le troisi\u00e8me volet de la c\u00e9l\u00e8bre s\u00e9rie de jeux de plateforme Cube, \u00e9levant la franchise vers une glorieuse troisi\u00e8me dimension baign\u00e9e de n\u00e9ons. D\u00e9velopp\u00e9 enti\u00e8rement sous Godot Engine 3 en C# (Mono), Cube3 associe physique de pr\u00e9cision, plateforme dynamique et graphismes r\u00e9tro-futuristes saisissants. Prenez le contr\u00f4le d'un cube tridimensionnel et parcourez des environnements p\u00e9rilleux \u00e0 travers deux modes de jeu majeurs : le Mode Aventure, avec ses tutoriels et ses niveaux narratifs faits main testant vos r\u00e9flexes, et le Mode Arcade, s'appuyant sur une g\u00e9n\u00e9ration proc\u00e9durale avanc\u00e9e pour concevoir des structures de plateformes et des labyrinthes 3D infinis \u00e0 la vol\u00e9e. Les joueurs doivent atteindre le portail de fin sans basculer dans le vide abyssal en dessous, tout en g\u00e9rant l'inertie et la hauteur des sauts. Le titre int\u00e8gre un syst\u00e8me de double cam\u00e9ra dynamique, permettant de commuter instantan\u00e9ment entre une vue \u00e0 la troisi\u00e8me personne immersive et une vue tactique de dessus (top-down). Gagnez des n-cubes en terminant des niveaux et d\u00e9pensez-les dans la boutique pour d\u00e9bloquer plus de 16 skins cubiques uniques. Les skins sont r\u00e9partis en plusieurs cat\u00e9gories de raret\u00e9 (Commun, Rare, \u00c9pique, L\u00e9gendaire, Divin, Mythique), allant d'hommages amusants comme le 'Four' (Furnace) ou la 'Citrouille' (Pumpkin), un skin rayonnant 'ssj' (Super Saiyan), un d\u00e9 \u00e0 jouer fonctionnel ('de'), jusqu'\u00e0 des mod\u00e8les divins anim\u00e9s. Personnalisez votre d\u00e9fi gr\u00e2ce \u00e0 quatre modes de difficult\u00e9 \u2014 de Facile (avec une fl\u00e8che directionnelle pointant vers la sortie) jusqu'\u00e0 l'Enfer (o\u00f9 les plateformes r\u00e9tr\u00e9cissent drastiquement, les physiques de saut se durcissent et aucun guide n'est fourni). Sublim\u00e9 par des r\u00e9glages post-traitement de premier choix comprenant du bloom (glow), des filtres de saturation, une distance d'affichage ajustable et de l'occlusion ambiante (SAO), Cube3 est un d\u00e9fi 3D effr\u00e9n\u00e9 qui repousse les limites de la plateforme g\u00e9om\u00e9trique.</p>", "funny_comments": [{"user": "3D_Dimensional_Crisis", "rating": 5, "text_en": "I spent two games mastering 2D grids only for the developer to add a Z-axis and make me realize I have zero spatial awareness. 11/10 depth perception is a lie.", "text_fr": "J'ai pass\u00e9 deux jeux \u00e0 ma\u00eetriser les grilles 2D pour que le d\u00e9veloppeur ajoute un axe Z et me fasse r\u00e9aliser que j'ai une perception spatiale de z\u00e9ro. 11/10 la profondeur est un mensonge."}, {"user": "SuperSaiyanSquare", "rating": 5, "text_en": "Unlocked the 'ssj' skin, turned the glow intensity to maximum, and literally blinded myself in real life. My living room now shines brighter than the sun.", "text_fr": "J'ai d\u00e9bloqu\u00e9 le skin 'ssj', mis l'intensit\u00e9 du bloom au maximum, et je me suis litt\u00e9ralement aveugl\u00e9 dans la vraie vie. Mon salon brille plus fort que le soleil."}, {"user": "MinecraftMigrant", "rating": 4, "text_en": "Equipped the Furnace skin and tried to smelt my iron ore. I fell into procedural lava instead. Very realistic, would bake again.", "text_fr": "J'ai \u00e9quip\u00e9 le skin Fourneau et j'ai essay\u00e9 de faire fondre mon minerai de fer. \u00c0 la place, je suis tomb\u00e9 dans de la lave proc\u00e9durale. Tr\u00e8s r\u00e9aliste, je recuirais volontiers."}, {"user": "ArrowBeliever", "rating": 5, "text_en": "Easy mode: 'Just follow the giant arrow, buddy!' Hell mode: 'Figure it out yourself, you are now a blind pixel in a neon void.' I love the emotional roller coaster.", "text_fr": "Mode Facile : 'Suis juste la grosse fl\u00e8che, mon pote !' Mode Enfer : 'D\u00e9brouille-toi tout seul, tu n'es qu'un pixel aveugle dans un vide de n\u00e9ons. J'adore l'ascenseur \u00e9motionnel."}, {"user": "DiceyBusiness", "rating": 3, "text_en": "Equipped the Dice skin, rolled off a cliff, and landed a perfect 6. Does that mean I won? The game over screen says no, but my heart says yes.", "text_fr": "J'ai \u00e9quip\u00e9 le skin D\u00e9, j'ai roul\u00e9 hors d'une falaise et j'ai fait un 6 parfait. Est-ce que \u00e7a veut dire que j'ai gagn\u00e9 ? L'\u00e9cran Game Over dit non, mais mon c\u0153ur dit oui."}, {"user": "GlowInTheDark", "rating": 5, "text_en": "The bloom effect is so beautiful I can feel my graphics card slowly heating my entire house. Thanks developer, I saved money on gas this winter!", "text_fr": "L'effet de bloom est si beau que je sens ma carte graphique chauffer lentement toute ma maison. Merci au d\u00e9veloppeur, j'ai \u00e9conomis\u00e9 sur le chauffage cet hiver !"}, {"user": "TopDownStrategist", "rating": 4, "text_en": "Switched to Top-Down camera hoping to get a better view, only to realize I can now watch myself fall into the lava from a highly professional cinematic perspective.", "text_fr": "Je suis pass\u00e9 en cam\u00e9ra du dessus en esp\u00e9rant mieux voir, pour finalement me rendre compte que je peux maintenant me regarder tomber dans la lave sous un angle de vue tr\u00e8s professionnel."}, {"user": "FrenchCube", "rating": 5, "text_en": "Reaching the end of Level 11 with the 'france' skin while listening to aggressive electro-synth music is the closest thing to absolute cubic patriotism.", "text_fr": "Atteindre la fin du niveau 11 avec le skin 'france' tout en \u00e9coutant de la musique synthwave agressive est ce qui se rapproche le plus du patriotisme cubique absolu."}, {"user": "AbortedHope", "rating": 5, "text_en": "Status: 'Aborted'. But honestly, this game is more complete, optimized, and polished than 90% of the early access games on Steam right now.", "text_fr": "Statut : 'Abandonn\u00e9'. Mais honn\u00eatement, ce jeu est plus complet, optimis\u00e9 et propre que 90% des jeux en acc\u00e8s anticip\u00e9 actuellement sur Steam."}, {"user": "ZeroGravityCube", "rating": 4, "text_en": "My cube fell to Y = -40. My spawnpoint was set directly above the void due to a level design error of my own creation. I am now trapped in an eternal loop of instant death. 10/10.", "text_fr": "Mon cube est tomb\u00e9 \u00e0 Y = -40. Mon point d'apparition s'est retrouv\u00e9 directement au-dessus du vide \u00e0 cause d'une erreur de ma propre cr\u00e9ation. Je suis bloqu\u00e9 dans une boucle \u00e9ternelle. 10/10."}], "_source_file": "cube3", "_source_name": "cube3"}, {"name_en": "CV_Creator", "name_fr": "CV_Creator", "short_description_en": "A dynamic, auto-scaling PDF resume generator that perfectly fits your content onto a single page using a custom binary-search layout loop.", "short_description_fr": "Un g\u00e9n\u00e9rateur dynamique de CV PDF \u00e0 mise \u00e0 l'\u00e9chelle automatique qui ajuste parfaitement le contenu sur une page unique gr\u00e2ce \u00e0 une boucle de recherche dichotomique.", "project_status": "Ended", "project_type": "Personal", "project_showcase_importance": 8, "icon": "res/icons/icon_project_cv_creator.png", "links": [{"name_en": "Github", "name_fr": "Github", "url": "https://github.com/nath54/cv_creator", "class": "btn-code btn-get btn-action", "icon": "fab fa-github"}], "app_version": "0.9", "download_size": "-", "tags": ["Python", "PDF", "CV", "FPDF2", "Auto-scaling", "YAML"], "gallery": [], "description_en": "<p>CV_Creator is an intelligent and highly customized resume generator written in Python. It parses structured personal and professional data from human-readable YAML configurations, applies fully customizable styling rules, and renders beautifully typeset PDF CVs. The project features an innovative auto-fitting algorithm: it performs a dynamic search over font sizes and line spacing parameters to scale the layout dynamically, ensuring the generated resume fits perfectly on exactly one page without manual trimming. Supported by two-column asymmetric structures, headers, image rendering, custom margins, and full localization support.</p>", "description_fr": "<p>CV_Creator est un g\u00e9n\u00e9rateur de CV intelligent et hautement personnalis\u00e9 \u00e9crit en Python. Il analyse des donn\u00e9es personnelles et professionnelles structur\u00e9es \u00e0 partir de fichiers YAML lisibles par l'homme, applique des r\u00e8gles de style enti\u00e8rement personnalisables et g\u00e9n\u00e8re des CV PDF magnifiquement mis en page. Le projet int\u00e8gre un algorithme d'auto-ajustement innovant : il effectue une recherche dichotomique sur la taille des polices et l'espacement des lignes pour adapter dynamiquement la mise en page, garantissant que le CV g\u00e9n\u00e9r\u00e9 tient parfaitement sur une seule page sans recadrage manuel. Prend en charge les structures asym\u00e9triques \u00e0 deux colonnes, les en-t\u00eates, le rendu d'images, les marges personnalis\u00e9es et la traduction linguistique.</p>", "funny_comments": [{"user": "BugHunter99", "rating": 5, "text_en": "I put my skills in the YAML and the compiler automatically shrank my '15 years of experience' down to font size 2. Highly recommended!", "text_fr": "J'ai mis mes comp\u00e9tences dans le YAML et le compilateur a automatiquement r\u00e9duit mes '15 ans d'exp\u00e9rience' \u00e0 une taille de police 2. Tr\u00e8s recommand\u00e9 !"}, {"user": "Recruiter_Destroyer", "rating": 5, "text_en": "Finally a tool that doesn't let my resume spill onto page 2 just because of one bullet point! My life is complete.", "text_fr": "Enfin un outil qui n'autorise pas mon CV \u00e0 d\u00e9border sur la page 2 \u00e0 cause d'une seule ligne ! Ma vie est compl\u00e8te."}, {"user": "YamlWhisperer", "rating": 4, "text_en": "Spent 3 hours debugging a missing space in my YAML. Still faster than trying to align a bullet point in MS Word.", "text_fr": "J'ai pass\u00e9 3 heures \u00e0 d\u00e9boguer un espace manquant dans mon YAML. Toujours plus rapide que d'essayer d'aligner une puce sous MS Word."}, {"user": "LoremIpsumEater", "rating": 5, "text_en": "The auto-scaling algorithm shrank my resume so much that recruiters now need a microscope. But hey, it fits on one page!", "text_fr": "L'algorithme de mise \u00e0 l'\u00e9chelle a tellement r\u00e9tr\u00e9ci mon CV que les recruteurs ont besoin d'un microscope. Mais h\u00e9, \u00e7a tient sur une page !"}, {"user": "PythonistaPro", "rating": 5, "text_en": "I tried to add 'Expert in sleeping' to my interests, and the program crashed. Outstanding feature validation!", "text_fr": "J'ai essay\u00e9 d'ajouter 'Expert en sieste' \u00e0 mes int\u00e9r\u00eats, et le programme a plant\u00e9. Excellente validation des fonctionnalit\u00e9s !"}, {"user": "OverqualifiedDev", "rating": 5, "text_en": "My resume was 5 pages long. The binary search shrank the font size to the planck length. I got hired by a quantum physics lab.", "text_fr": "Mon CV faisait 5 pages. La recherche dichotomique a r\u00e9duit la police \u00e0 la longueur de Planck. J'ai \u00e9t\u00e9 embauch\u00e9 par un laboratoire de physique quantique."}, {"user": "DockerOnly", "rating": 4, "text_en": "Instructions unclear, compiled my resume into a Docker container and deployed it to Kubernetes. Recruiter still asked for a PDF.", "text_fr": "Instructions pas claires, j'ai compil\u00e9 mon CV dans un conteneur Docker et je l'ai d\u00e9ploy\u00e9 sur Kubernetes. Le recruteur a quand m\u00eame demand\u00e9 un PDF."}, {"user": "NoMoreWord", "rating": 5, "text_en": "Using this tool reduced my blood pressure by 40% compared to using Microsoft Word's layout generator.", "text_fr": "L'utilisation de cet outil a r\u00e9duit ma tension art\u00e9rielle de 40 % par rapport \u00e0 l'utilisation du g\u00e9n\u00e9rateur de mise en page de Microsoft Word."}, {"user": "CoffeeDrivenDev", "rating": 5, "text_en": "It compiled in 0.5 seconds, which is faster than the time it took to load the MS Office splash screen.", "text_fr": "Il s'est compil\u00e9 en 0,5 seconde, ce qui est plus rapide que le temps de chargement de l'\u00e9cran de d\u00e9marrage de MS Office."}, {"user": "CleanCodeFanatic", "rating": 5, "text_en": "I sent my YAML file directly to the HR department. They didn't understand it, but they praised my clean structure.", "text_fr": "J'ai envoy\u00e9 mon fichier YAML directement au d\u00e9partement RH. Ils n'ont rien compris, mais ils ont lou\u00e9 ma structure propre."}], "_source_file": "cv_creator", "_source_name": "cv_creator"}, {"name_en": "iFiction Engine", "name_fr": "iFiction Engine", "short_description_en": "A highly modular, event-driven, turn-based Interactive Fiction (text adventure) game engine in Python, featuring a custom natural language parser, time scheduling, and dynamic scripts.", "short_description_fr": "Un moteur de fiction interactive (aventure textuelle) hautement modulaire, pilot\u00e9 par \u00e9v\u00e9nements et au tour par tour en Python, avec un analyseur de langage naturel personnalis\u00e9.", "project_status": "Paused", "project_type": "Personal", "project_showcase_importance": 10, "icon": "res/icons/icon_project_ifiction_engine.png", "links": [{"name_en": "Github", "name_fr": "Github", "url": "https://github.com/nath54/ifiction_engine", "class": "btn-code btn-get btn-action", "icon": "fab fa-github"}], "app_version": "0.4.2", "download_size": "-", "tags": ["Python", "Engine", "Interactive fiction"], "gallery": [], "description_en": "<p>iFiction Engine is a complete, modular, and lightweight interactive fiction game engine built entirely in Python's standard library. It parses complex natural language command structures (like 'take key', 'put book in shelf with hands', or 'ask merchant about potion') using an intelligent custom tokenizer. The engine is powered by an event-driven scene execution framework that handles conditions, branch jumps, local/global variables, and custom actions. Additionally, a priority queue-based scheduler governs game-time progression and turns, allowing realistic schedules, NPC behaviors, and world ticks. World blueprints use a unified, fully serializable JSON format, meaning there is no functional difference between a game initialization file and a game save file.</p>", "description_fr": "<p>iFiction Engine est un moteur de jeu de fiction interactive complet, modulaire et l\u00e9ger, enti\u00e8rement d\u00e9velopp\u00e9 en Python avec la biblioth\u00e8que standard. Il analyse des structures de commandes complexes en langage naturel (comme 'prendre cl\u00e9', 'mettre livre dans \u00e9tag\u00e8re avec les mains' ou 'demander au marchand \u00e0 propos de la potion') gr\u00e2ce \u00e0 un analyseur syntaxique personnalis\u00e9. Le moteur repose sur un framework d'ex\u00e9cution de sc\u00e8nes pilot\u00e9 par \u00e9v\u00e9nements, g\u00e9rant les conditions, les sauts de branchement, les variables locales/globales et les actions personnalis\u00e9es. De plus, un ordonnanceur bas\u00e9 sur une file d'attente \u00e0 priorit\u00e9 r\u00e9git la progression temporelle du jeu et les tours, permettant des comportements de PNJ et des \u00e9v\u00e9nements d'arri\u00e8re-plan r\u00e9alistes. Les configurations de mondes utilisent un format JSON unifi\u00e9 et s\u00e9rialisable, de sorte qu'il n'y a aucune diff\u00e9rence fonctionnelle entre un fichier d'initialisation de jeu et une sauvegarde.</p>", "funny_comments": [{"user": "GitCommitmentIssues", "rating": 5, "text_en": "Finally, a game engine where I can type 'sprint south-west with bare hands' and not get questioned by local authorities. 10/10 parser!", "text_fr": "Enfin un moteur de jeu o\u00f9 je peux taper 'sprinter vers le sud-ouest les mains vides' sans me faire questionner par les autorit\u00e9s locales. Analyseur 10/10 !"}, {"user": "JSON_Derulo", "rating": 5, "text_en": "I love how game saves and game blueprints are the exact same JSON format. Now my bugs are fully serializable too!", "text_fr": "J'adore le fait que les sauvegardes de jeu et les configurations initiales soient exactement au m\u00eame format JSON. Maintenant, mes bugs aussi sont enti\u00e8rement s\u00e9rialisables !"}, {"user": "TheSpaghettiArchitect", "rating": 4, "text_en": "It took me three hours of reading 'scenes_events_and_actions.md' to realize I could create a recursive room enter event that traps the player in a temporal paradox. Beautiful design.", "text_fr": "Il m'a fallu trois heures de lecture sur 'scenes_events_and_actions.md' pour comprendre comment cr\u00e9er un \u00e9v\u00e9nement r\u00e9cursif d'entr\u00e9e de pi\u00e8ce qui pi\u00e8ge le joueur dans un paradoxe temporel. Un design magnifique."}, {"user": "TerminalIllness", "rating": 5, "text_en": "Who needs 3D Unreal Engine graphics when you have raw CLI mono-spaced text that smells of dusty dungeon hallways? High-quality immersion.", "text_fr": "Qui a besoin de graphismes 3D sous Unreal Engine quand on a du texte brut CLI en police \u00e0 chasse fixe qui sent bon les couloirs poussi\u00e9reux de donjons ? Immersion de haute qualit\u00e9."}, {"user": "BugCatcher", "rating": 5, "text_en": "The natural language parser is so thorough it successfully parsed 'sip red potion with crying face'. I have never felt so understood by a standard library.", "text_fr": "L'analyseur de langage naturel est si complet qu'il a r\u00e9ussi \u00e0 analyser 'siroter la potion rouge avec un visage en pleurs'. Je ne me suis jamais senti aussi bien compris par une biblioth\u00e8que standard."}, {"user": "TimeTraveler99", "rating": 4, "text_en": "The priority queue is so precise that the background train arrived at exactly 14:02:15, but I was busy arguing with a chest and missed the ride. Realism hurts.", "text_fr": "La file d'attente \u00e0 priorit\u00e9 est si pr\u00e9cise que le train en arri\u00e8re-plan est arriv\u00e9 \u00e0 exactement 14:02:15, mais j'\u00e9tais trop occup\u00e9 \u00e0 me disputer avec un coffre et j'ai rat\u00e9 le d\u00e9part. Le r\u00e9alisme fait mal."}, {"user": "KeyboardWarrior", "rating": 5, "text_en": "I typed 'attack bandit with bare hands' and my player character immediately did. I lost, but at least the parser didn't judge my life choices.", "text_fr": "J'ai tap\u00e9 'attaquer le bandit \u00e0 mains nues' et mon personnage l'a fait imm\u00e9diatement. J'ai perdu, mais au moins l'analyseur n'a pas jug\u00e9 mes choix de vie."}, {"user": "StandardLibPurist", "rating": 5, "text_en": "Zero external dependencies. No pip install. Pure python. This code is so clean I'm using it as a soap substitute.", "text_fr": "Z\u00e9ro d\u00e9pendance externe. Pas de pip install. Du pur Python. Ce code est tellement propre que je l'utilise comme substitut de savon."}, {"user": "NPC_Rights_Activist", "rating": 5, "text_en": "Finally, NPCs that operate on a scheduler and take actions. They have schedules and jobs, which means they are more productive than me.", "text_fr": "Enfin des PNJ qui fonctionnent avec un planificateur et prennent des mesures. Ils ont des horaires et des emplois, ce qui signifie qu'ils sont plus productifs que moi."}, {"user": "LazyCoder", "rating": 5, "text_en": "I started writing an interactive story about my daily routine but the engine threw a SyntaxError. Even the compiler knows my life lacks structure.", "text_fr": "J'ai commenc\u00e9 \u00e0 \u00e9crire une histoire interactive sur ma routine quotidienne mais le moteur a renvoy\u00e9 une SyntaxError. M\u00eame le compilateur sait que ma vie manque de structure."}], "_source_file": "ifiction_engine", "_source_name": "ifiction_engine"}, {"name_en": "NaLang", "name_fr": "NaLang", "short_description_en": "A playful, premium multi-language learning application built with the Godot engine, featuring custom vocabulary flashcards, written quizzes with Levenshtein-based spelling validation, and parallel multi-language dialogues.", "short_description_fr": "Une application ludique et compl\u00e8te d'apprentissage des langues con\u00e7ue avec Godot, proposant des fiches personnalis\u00e9es, des quiz \u00e9crits avec validation orthographique par distance de Levenshtein, et des dialogues parall\u00e8les multi-langues.", "project_status": "Ended", "project_type": "Personal", "project_showcase_importance": 4, "icon": "res/icons/icon_project_nalang.png", "links": [{"name_en": "Github", "name_fr": "Github", "url": "https://github.com/nath54/NaLang", "class": "btn-code btn-get btn-action", "icon": "fab fa-github"}, {"name_en": "Linux", "name_fr": "Linux", "url": "https://github.com/nath54/NaLang/releases/download/v0.9.4.4/NaLang_LinuxVersion.x86_64", "class": "btn-code btn-get btn-action", "icon": "fab fa-linux"}, {"name_en": "Windows", "name_fr": "Windows", "url": "https://github.com/nath54/NaLang/releases/download/v0.9.4.4/NaLang_WindowsVersion.exe", "class": "btn-code btn-get btn-action", "icon": "fab fa-windows"}, {"name_en": "Android", "name_fr": "Android", "url": "https://github.com/nath54/NaLang/releases/download/v0.9.4.4/NaLang_AndroidVersion.apk", "class": "btn-code btn-get btn-action", "icon": "fab fa-android"}], "app_version": "0.9.4.4", "download_size": "71.7 MB", "tags": ["Godot", "GDScript", "Language", "Learning"], "gallery": ["res/screenshots/nalang_2.png", "res/screenshots/nalang_3.png", "res/screenshots/nalang_4.png", "res/screenshots/nalang_5.png", "res/screenshots/nalang_6.png", "res/screenshots/nalang_7.png", "res/screenshots/nalang_8.png"], "description_en": "<p>NaLang is a professional, feature-rich multi-language learning dashboard built on Godot 4.2. Designed to facilitate language acquisition through structured lessons, active recall flashcards, and interactive testing, it offers a comprehensive system for learners. The app features structured lesson pages with rich BBCode-formatted layouts for grammar, pronunciation, and conjugation; customizable vocabulary flashcards (fiches) that users can create, edit, and organize locally; a dual-mode testing engine offering either visual flashcard reviews or written answers; an advanced evaluation algorithm employing a custom Levenshtein distance check with Unicode-aware text normalization; and multi-lingual conversation guides for real-world scenarios. Supported target languages include Spanish, English, German, Mandarin Chinese, Japanese, Korean, and Russian.</p>", "description_fr": "<p>NaLang est un tableau de bord complet et professionnel d'apprentissage multi-langues con\u00e7u sous Godot 4.2. Pens\u00e9 pour faciliter l'apprentissage par le biais de le\u00e7ons structur\u00e9es, de flashcards \u00e0 rappel actif et d'exercices interactifs, l'application propose un syst\u00e8me extr\u00eamement robuste. Elle int\u00e8gre des fiches de cours structur\u00e9es avec un rendu BBCode riche pour la grammaire, la prononciation et la conjugaison ; des fiches de vocabulaire personnalisables (fiches) que les utilisateurs peuvent cr\u00e9er, \u00e9diter et organiser localement ; un moteur de quiz double proposant des r\u00e9visions visuelles de cartes ou des r\u00e9ponses \u00e9crites ; un algorithme d'\u00e9valuation avanc\u00e9 utilisant la distance de Levenshtein avec normalisation de texte pour tol\u00e9rer les fautes de frappe mineures ; et des guides de conversation parall\u00e8les multi-langues pour des situations r\u00e9elles. Les langues cibles prises en charge incluent l'espagnol, l'anglais, l'allemand, le chinois mandarin, le japonais, le cor\u00e9en et le russe.</p>", "funny_comments": [{"user": "PolyglotWannabe", "rating": 5, "text_en": "I wanted to learn Spanish, but the Levenshtein distance was so forgiving that it convinced me that 'hola' and 'cola' are practically the same word. 10/10, now ordering soft drinks in Madrid.", "text_fr": "Je voulais apprendre l'espagnol, mais la distance de Levenshtein est si indulgente qu'elle m'a convaincu que 'hola' et 'cola' sont le m\u00eame mot. 10/10, je commande d\u00e9sormais des sodas \u00e0 Madrid."}, {"user": "GDScriptFanatic", "rating": 5, "text_en": "A serious language learning app built with a game engine. I keep waiting for a boss fight against the irregular verbs, but so far it's just conjugations.", "text_fr": "Une application s\u00e9rieuse d'apprentissage des langues cod\u00e9e avec un moteur de jeu. J'attends toujours le combat de boss contre les verbes irr\u00e9guliers, mais pour l'instant ce ne sont que des conjugaisons."}, {"user": "TypoMaster", "rating": 5, "text_en": "The custom text normalizer replaces every accented character and strips all punctuation. Finally, an application that accepts my keyboard mashings as fluent Spanish.", "text_fr": "Le normalisateur de texte remplace chaque caract\u00e8re accentu\u00e9 et supprime toute la ponctuation. Enfin une application qui accepte mes frappes fr\u00e9n\u00e9tiques comme de l'espagnol courant."}, {"user": "RestaurantReviewer", "rating": 4, "text_en": "The restaurant dialogue has placeholders like Restaurant Name and Dish 1. I went to a bistro in Paris, ordered Dish 2, and they brought me a bowl of hot water. Highly authentic.", "text_fr": "Le dialogue du restaurant a des espaces r\u00e9serv\u00e9s comme Nom du Restaurant et Plat 1. Je suis all\u00e9 dans un bistrot \u00e0 Paris, j'ai command\u00e9 Plat 2, et on m'a apport\u00e9 un bol d'eau chaude. Tr\u00e8s authentique."}, {"user": "BugFinder", "rating": 5, "text_en": "Translating from Spanish to French in written mode evaluates my French answer against the Spanish solution. My Spanish is now perfect, though my French is severely compromised.", "text_fr": "Traduire de l'espagnol vers le fran\u00e7ais en mode \u00e9crit \u00e9value ma r\u00e9ponse en fran\u00e7ais par rapport \u00e0 la solution en espagnol. Mon espagnol est maintenant parfait, bien que mon fran\u00e7ais soit gravement compromis."}, {"user": "LowProcessorSaver", "rating": 5, "text_en": "It runs in low processor mode. This is amazing because my phone can now survive a 3-hour session of me failing simple German quizzes without heating up like a toaster.", "text_fr": "L'application fonctionne en mode processeur bas. C'est incroyable car mon t\u00e9l\u00e9phone peut d\u00e9sormais survivre \u00e0 3 heures de quiz d'allemand rat\u00e9s sans surchauffer comme un grille-pain."}, {"user": "CustomCardCreator", "rating": 5, "text_en": "I created a custom vocabulary sheet with only one card to feel good about myself. I now score 100 percent on every single quiz. Easiest fluency of my life.", "text_fr": "J'ai cr\u00e9\u00e9 une fiche personnalis\u00e9e avec une seule carte pour me sentir bien. J'obtiens maintenant 100 pour cent \u00e0 chaque quiz. L'apprentissage le plus facile de ma vie."}, {"user": "RussianLearner", "rating": 4, "text_en": "I noticed Russian was commented out in the global languages dictionary but fully defined in the vocabulary files. It's like a secret expansion pack waiting to be unlocked.", "text_fr": "J'ai remarqu\u00e9 que le russe \u00e9tait comment\u00e9 dans le dictionnaire global des langues mais d\u00e9fini dans les fichiers de vocabulaire. C'est comme une extension secr\u00e8te qui attend d'\u00eatre d\u00e9bloqu\u00e9e."}, {"user": "BBCodeEnthusiast", "rating": 5, "text_en": "The parser in verify_errors.py checks for nested color tags. It's like having a compiler warning for my flashcard aesthetic. Beautifully overengineered.", "text_fr": "Le parseur dans verify_errors.py v\u00e9rifie les balises de couleur imbriqu\u00e9es. C'est comme avoir un avertissement de compilateur pour l'esth\u00e9tique de mes fiches de r\u00e9vision. Magnifiquement surcon\u00e7u."}, {"user": "AccidentalPolyglot", "rating": 5, "text_en": "I accidentally changed the destination language to Mandarin Chinese in the settings, and now the entire app is trying to teach me symbols. I am terrified, but I can now say yellow in three tones.", "text_fr": "J'ai accidentellement chang\u00e9 la langue cible en chinois mandarin dans les param\u00e8tres, et maintenant toute l'application essaie de m'enseigner des symboles. J'ai peur, mais je sais dire jaune en trois tons."}], "_source_file": "nalang", "_source_name": "nalang"}, {"name_en": "Napp Engine Compiler", "name_fr": "Napp Engine Compiler", "short_description_en": "A modular cross-platform transpiler compiling NaXML, NaStyle, and NaCode into highly responsive WebJS (HTML5/JS) and native desktop PySide6 apps.", "short_description_fr": "Un transpilateur multi-cible modulaire compilant NaXML, NaStyle et NaCode en applications web r\u00e9actives (WebJS) et de bureau natives (PySide6).", "project_status": "Ended", "project_type": "Personal", "project_showcase_importance": 15, "icon": "res/icons/icon_project_napp_engine_compiler.png", "links": [{"name_en": "Github", "name_fr": "Github", "url": "https://github.com/nath54/napp_engine_compiler", "class": "btn-code btn-get btn-action", "icon": "fab fa-github"}], "app_version": "0.1.2", "download_size": "-", "tags": ["Python", "Compilation", "Dev", "Engine"], "gallery": [], "description_en": "<p>The Napp Engine Compiler is a high-performance, modular, multi-target transpiler designed to compile unified NApp projects into responsive, dependency-free single-page web applications (WebJS) and native desktop window applications (PySide6/Qt6). By strictly decoupling declarative UI layouts (NaXML), custom style schemas (NaStyle), strongly typed mid-end logic (NaCode), and native system calls, it enables full cross-platform execution with a single unified codebase.</p>\n<p>The compiler engine features a robust parsing pipeline powered by Lark grammars, syntax-to-AST translation layers, type checking, and semantic validation before generating optimized intermediate representations. It also integrates an emulation-based interactive macOS-style terminal overlay in the browser, local storage proxies, sound control engines, network fetch interfaces, and clipboard hardware controllers, along with an auto-unlocking/kill system to release active Windows ports and file locks during development iterations.</p>", "description_fr": "<p>Le compilateur Napp Engine est un transpilateur modulaire et performant con\u00e7u pour compiler des projets NApp unifi\u00e9s en applications web r\u00e9actives \u00e0 page unique (WebJS) et en applications de bureau natives (PySide6/Qt6). Gr\u00e2ce \u00e0 un d\u00e9couplage rigoureux entre les interfaces utilisateur d\u00e9claratives (NaXML), les feuilles de style (NaStyle), la logique fortement typ\u00e9e (NaCode) et les API syst\u00e8me globales, il permet une ex\u00e9cution multiplateforme fluide avec une unique base de code.</p>\n<p>Le compilateur int\u00e8gre un pipeline d'analyse robuste bas\u00e9 sur des grammaires Lark, une validation s\u00e9mantique stricte et un gestionnaire de types unifi\u00e9 pour s\u00e9curiser la g\u00e9n\u00e9ration du code. Il prend \u00e9galement en charge une \u00e9mulation de terminal graphique interactive au style macOS dans le navigateur, des proxies de persistance locale, des lecteurs audio/vid\u00e9o int\u00e9gr\u00e9s, des requ\u00eates HTTP distantes et des contr\u00f4les de presse-papiers physiques, \u00e9paul\u00e9s par un syst\u00e8me de d\u00e9verrouillage de ports et de processus Windows pour simplifier le d\u00e9veloppement.</p>", "funny_comments": [{"user": "BugHunter99", "rating": 5, "text_en": "The compiler's Windows port auto-unlocker is so aggressive, it closed my browser, my IDE, and terminated my apartment lease.", "text_fr": "Le d\u00e9bloqueur de port Windows du compilateur est si agressif qu'il a ferm\u00e9 mon navigateur, mon IDE et a r\u00e9sili\u00e9 mon bail de location."}, {"user": "LarkWhisperer", "rating": 4, "text_en": "I tried using Lark to parse my life choices, but got a Shift/Reduce conflict on 'eating pizza at 3 AM'.", "text_fr": "J'ai essay\u00e9 d'utiliser Lark pour analyser mes choix de vie, mais j'ai obtenu un conflit Shift/Reduce sur 'manger une pizza \u00e0 3h du matin'."}, {"user": "PySideSurvivor", "rating": 5, "text_en": "The PySide6 fallback is so retro, I half-expected the compiler to ask for a floppy disk.", "text_fr": "Le repli vers PySide6 est tellement r\u00e9tro que je m'attendais presque \u00e0 ce que le compilateur me demande une disquette."}, {"user": "CssWizard", "rating": 3, "text_en": "Compiled my UI, and the grid layout is so responsive it responded by leaving the screen.", "text_fr": "J'ai compil\u00e9 mon UI, et la disposition en grille est si r\u00e9active qu'elle a r\u00e9agi en quittant l'\u00e9cran."}, {"user": "GitGud", "rating": 5, "text_en": "Implemented the Undo/Redo history stack, but I still can't undo my career path.", "text_fr": "J'ai impl\u00e9ment\u00e9 la pile d'historique Undo/Redo, mais je ne peux toujours pas annuler mes choix de carri\u00e8re."}, {"user": "TypeSafetyFirst", "rating": 4, "text_en": "The compiler rejected my 'any' type because it had an existential crisis and preferred to be 'void'.", "text_fr": "Le compilateur a rejet\u00e9 mon type 'any' parce qu'il faisait une crise existentielle et pr\u00e9f\u00e9rait \u00eatre 'void'."}, {"user": "NoGPSNeeded", "rating": 5, "text_en": "The GPS locator always returns (0, 0). Perfect for avoiding git blame and bug reports.", "text_fr": "Le localisateur GPS renvoie toujours (0, 0). Parfait pour \u00e9viter le git blame et les rapports de bogues."}, {"user": "CacheIsKing", "rating": 4, "text_en": "Local Storage falls back to native file writing. Now my settings are saved in a .txt file next to my childhood photos.", "text_fr": "Le stockage local se rabat sur l'\u00e9criture de fichiers natifs. Maintenant, mes param\u00e8tres sont sauvegard\u00e9s dans un fichier .txt \u00e0 c\u00f4t\u00e9 de mes photos d'enfance."}, {"user": "FrenchDev", "rating": 5, "text_en": "The bilingual engine is amazing, but naming a variable 'pain_au_chocolat' throws a compilation error in Toulouse.", "text_fr": "Le moteur bilingue est incroyable, mais nommer une variable 'chocolatine' l\u00e8ve une erreur de compilation \u00e0 Paris."}, {"user": "CompilerOptimist", "rating": 5, "text_en": "0 errors, 1428 warnings. Mostly the compiler asking if I've touched grass recently. 10/10 feature.", "text_fr": "0 erreur, 1428 avertissements. Principalement le compilateur me demandant si j'ai touch\u00e9 de l'herbe r\u00e9cemment. Fonctionnalit\u00e9 10/10."}], "_source_file": "napp_engine_compiler", "_source_name": "napp_engine_compiler"}, {"name_en": "NaSong", "name_fr": "NaSong", "short_description_en": "A Python-based programmatic music synthesizer and sequencer featuring differentiable instruments, an Algo-Rave TUI for live coding, and deep music theory integration.", "short_description_fr": "Un synth\u00e9tiseur et s\u00e9quenceur musical en Python dot\u00e9 d'instruments diff\u00e9rentiables, d'un environnement live-coding TUI (Algo-Rave) et d'un moteur de th\u00e9orie musicale.", "project_status": "Ended", "project_type": "Personal", "project_showcase_importance": 9, "icon": "res/icons/icon_project_nasong.png", "links": [{"name_en": "Github", "name_fr": "Github", "url": "https://github.com/nath54/nasong", "class": "btn-code btn-get btn-action", "icon": "fab fa-github"}], "app_version": "0.1.0", "download_size": "-", "tags": ["Python", "Audio Synthesis", "PyTorch", "Live Coding", "Music Theory", "TUI"], "gallery": [], "description_en": "<p><strong>NaSong</strong> is a highly innovative, modular Python-based music synthesizer, sequencer, and live-coding platform that treats <strong>\"Code as Music\"</strong>. Instead of relying on traditional graphical DAWs with fixed tracks and plugin systems, NaSong allows developers and electronic music composers to build fully custom, mathematically precise, and highly composable audio synthesis graphs entirely in Python.</p>\n<h3>\ud83d\udd0a Key Features &amp; Architectural Capabilities</h3>\n<ul>\n<li><strong>\"Everything is a Value\" Architecture:</strong> At the core of NaSong is the <code>Value</code> system. An audio waveform, an LFO, an ADSR envelope, or a constant value are all modeled as time-varying signal graphs. These graphs leverage fast, vectorized <strong>NumPy</strong> operations (<code>getitem_np</code>) to render complex multi-voice orchestrations in record time.</li>\n<li><strong>Differentiable Audio Synthesis &amp; Deep Learning:</strong> Under the hood, NaSong integrates with <strong>PyTorch</strong> to define trainable instruments. By comparing synthesized waveforms with target audio samples (.wav), the framework uses gradient descent (Adam) and spectral STFT loss to learn optimal synthesizer parameters (such as ADSR envelope values, FM index, or vocal formant frequencies).</li>\n<li><strong>Algo-Rave Terminal User Interface (TUI):</strong> A complete live-coding environment built using <strong>Textual</strong>. It features an integrated code editor with hot-reloading (saving compiles and hot-swaps the audio graph without playback interruption), live BPM/volume controls, and an API documentation browser.</li>\n<li><strong>Advanced Multi-Threaded Audio Engine:</strong> Features a background <code>RenderEngine</code> that computes audio chunks using a priority queue, double-buffering, and version tracking to ensure glitch-free audio playback even during complex real-time script reloads.</li>\n<li><strong>Expressive Domain-Specific Language (DSL):</strong> Offers syntactic sugar for signal chaining via the <code>&gt;&gt;</code> operator (e.g., <code>Chainable(Sin) &gt;&gt; Gain(0.5)</code>), decorators like <code>@instrument</code> and <code>@effect</code>, and typed musical units (<code>BPM</code>, <code>Ms</code>, <code>Bars</code>, <code>Hz</code>).</li>\n<li><strong>Global Music Theory Engine:</strong> Native support for scale systems, chords, progressions, and rhythm patterns, extending from Western modes (major, minor, Phrygian, etc.) to Non-Western traditions like Indian <strong>Ragas</strong>, Arabic <strong>Maqams</strong>, and Indonesian <strong>Gamelan</strong>. Includes pre-built style generators for <strong>Jazz</strong>, <strong>EDM</strong>, and <strong>Lofi</strong>.</li>\n</ul>", "description_fr": "<p><strong>NaSong</strong> est un synth\u00e9tiseur, s\u00e9quenceur et outil de live-coding musical r\u00e9volutionnaire bas\u00e9 sur Python qui applique la philosophie du <strong>\"Code en tant que Musique\"</strong>. Au lieu d'utiliser des stations de travail audio num\u00e9riques (DAW) graphiques traditionnelles, NaSong permet aux d\u00e9veloppeurs et compositeurs de concevoir des graphes de synth\u00e8se audio complexes, math\u00e9matiquement pr\u00e9cis et hautement modulables en \u00e9crivant du code Python.</p>\n<h3>\ud83d\udd0a Fonctionnalit\u00e9s et Architecture Cl\u00e9s</h3>\n<ul>\n<li><strong>Architecture \"Tout est une Valeur\" (Value) :</strong> Le c\u0153ur du syst\u00e8me repose sur des signaux variant dans le temps. Que ce soit une onde sinuso\u00efdale, un LFO, une enveloppe ADSR ou une constante, chaque \u00e9l\u00e9ment est un n\u0153ud de calcul. Les graphes s'appuient sur des op\u00e9rations vectoris\u00e9es <strong>NumPy</strong> (<code>getitem_np</code>) pour un rendu extr\u00eamement rapide.</li>\n<li><strong>Synth\u00e8se Diff\u00e9rentiable et Deep Learning :</strong> NaSong s'int\u00e8gre avec <strong>PyTorch</strong> pour d\u00e9finir des instruments programmables intelligents. En comparant les signaux synth\u00e9tis\u00e9s \u00e0 des \u00e9chantillons audio cibles (.wav), le framework utilise la descente de gradient (Adam) et des pertes spectrales (STFT) pour apprendre les param\u00e8tres optimaux d'enveloppe, d'index FM ou de formants vocaux.</li>\n<li><strong>Interface Terminale Algo-Rave (TUI) :</strong> Un environnement de live-coding immersif d\u00e9velopp\u00e9 avec <strong>Textual</strong>. Il propose un \u00e9diteur int\u00e9gr\u00e9 avec rechargement \u00e0 chaud (la sauvegarde compile et injecte le nouveau graphe sans couper le son), des contr\u00f4les de volume/BPM en temps r\u00e9el, et un explorateur de documentation d'API.</li>\n<li><strong>Moteur Audio Multi-Thread\u00e9 R\u00e9silient :</strong> Le <code>RenderEngine</code> en arri\u00e8re-plan pr\u00e9-calcule les blocs audio via une file d'attente prioritaire, un syst\u00e8me de double-buffering et un suivi des versions pour \u00e9liminer tout artefact sonore ou interruption lors du rechargement de scripts complexes.</li>\n<li><strong>Langage D\u00e9di\u00e9 Expressif (DSL) :</strong> Fournit une syntaxe fluide de cha\u00eenage de signaux via l'op\u00e9rateur de flux <code>&gt;&gt;</code> (ex: <code>Chainable(Sin) &gt;&gt; Gain(0.5)</code>), des d\u00e9corateurs <code>@instrument</code> et <code>@effect</code>, et des unit\u00e9s musicales typ\u00e9es (<code>BPM</code>, <code>Ms</code>, <code>Bars</code>, <code>Hz</code>).</li>\n<li><strong>Moteur de Th\u00e9orie Musicale Avanc\u00e9 :</strong> Support natif complet des gammes, accords, progressions et rythmes, s'\u00e9tendant des modes occidentaux classiques aux syst\u00e8mes microtonaux et ethniques tels que les <strong>Ragas</strong> indiens, les <strong>Maqams</strong> arabes et le <strong>Gamelan</strong> indon\u00e9sien. Inclut des g\u00e9n\u00e9rateurs de styles <strong>Jazz</strong>, <strong>EDM</strong> et <strong>Lofi</strong>.</li>\n</ul>", "funny_comments": [{"user": "DJ_StackOverflow", "rating": 5, "text_en": "I spent 12 hours training a neural synth to sound like a perfect acoustic piano, only to realize I could have just loaded a soundfont. 10/10 would waste GPU cycles again.", "text_fr": "J'ai pass\u00e9 12 heures \u00e0 entra\u00eener un synth\u00e9 neuronal \u00e0 sonner comme un vrai piano acoustique, pour r\u00e9aliser ensuite que j'aurais pu juste charger un soundfont. 10/10, je gaspillerai encore mes cycles GPU."}, {"user": "BPM_Police", "rating": 5, "text_en": "Tried to live-code at 300 BPM on the subway. The hot-reload compiled my synth loop, my headphones exploded, and the person sitting next to me asked if I was hacking the government.", "text_fr": "J'ai essay\u00e9 de faire du live-coding \u00e0 300 BPM dans le m\u00e9tro. Le hot-reload a compil\u00e9 ma boucle de synth\u00e9, mon casque a explos\u00e9, et mon voisin m'a demand\u00e9 si j'\u00e9tais en train de pirater le gouvernement."}, {"user": "NullPointerMelody", "rating": 5, "text_en": "Everything is a Value. Including my bank account after buying a new GPU to train custom flute sounds.", "text_fr": "Tout est une Valeur (Value). Y compris mon compte en banque apr\u00e8s avoir achet\u00e9 un nouveau GPU pour entra\u00eener des sons de fl\u00fbte personnalis\u00e9s."}, {"user": "NoMouseComposer", "rating": 5, "text_en": "My MIDI controller is a mechanical keyboard. My drops are typed, not played. The latency is high, but the satisfaction of throwing a SyntaxError at the drop is unmatched.", "text_fr": "Mon contr\u00f4leur MIDI est un clavier m\u00e9canique. Mes drops sont saisis au clavier, pas jou\u00e9s. La latence est \u00e9lev\u00e9e, mais la satisfaction de balancer une SyntaxError au moment du drop est in\u00e9galable."}, {"user": "NoisyNeighbor", "rating": 5, "text_en": "I trained an instrument on my neighbor's leaf blower to create a noise-drone-metal track. Now they think I'm recording them. They are right.", "text_fr": "J'ai entra\u00een\u00e9 un instrument sur le bruit du souffleur de feuilles de mon voisin pour composer un morceau noise-drone-metal. Maintenant il pense que je l'enregistre. Il a raison."}, {"user": "LFO_Lover", "rating": 5, "text_en": "I modulated my synth's filter cutoff with an LFO, which was modulated by another LFO, which was modulated by the stock market index. The drop hit right when my portfolio crashed.", "text_fr": "J'ai modul\u00e9 le cutoff du filtre de mon synth\u00e9 avec un LFO, lui-m\u00eame modul\u00e9 par un autre LFO, lui-m\u00eame modul\u00e9 par l'indice boursier. Le drop a retenti pile au moment o\u00f9 mon portefeuille s'est effondr\u00e9."}, {"user": "TUI_Raver", "rating": 5, "text_en": "Textual TUI for audio live-coding? Yes, because flashing green terminal text is the only visual effect a real cyber-DJ needs.", "text_fr": "Un TUI Textual pour le live-coding audio ? Oui, parce que du texte de terminal vert qui clignote est le seul effet visuel dont un vrai cyber-DJ a besoin."}, {"user": "GamelanGod", "rating": 5, "text_en": "Configured a non-Western scale with 17 microtones, but my brain only registers C, D, and 'out of tune'. Highly educational, though my cat hates it.", "text_fr": "J'ai configur\u00e9 une gamme non-occidentale \u00e0 17 tons microtonaux, mais mon cerveau n'enregistre que le Do, le R\u00e9, et 'compl\u00e8tement faux'. Tr\u00e8s \u00e9ducatif, m\u00eame si mon chat d\u00e9teste."}, {"user": "WavMaster", "rating": 5, "text_en": "A 3-minute song generated a 1.2GB WAV because I forgot to set a reasonable sample rate. Sounds pristine, but my SSD is crying.", "text_fr": "Une chanson de 3 minutes a g\u00e9n\u00e9r\u00e9 un fichier WAV de 1,2 Go parce que j'ai oubli\u00e9 de d\u00e9finir un taux d'\u00e9chantillonnage raisonnable. Le son est cristallin, mais mon SSD pleure."}, {"user": "BugsAsFeatures", "rating": 5, "text_en": "My rendering crashed because of a division by zero in my ADSR envelope. It made a click sound that was actually a perfect kick drum. Bug? No, instant techno producer.", "text_fr": "Mon rendu a plant\u00e9 en raison d'une division par z\u00e9ro dans mon enveloppe ADSR. \u00c7a a produit un clic qui \u00e9tait en fait un kick parfait. Un bug ? Non, producteur techno instantan\u00e9."}], "_source_file": "nasong", "_source_name": "nasong"}, {"name_en": "Nathetris", "name_fr": "Nathetris", "short_description_en": "A feature-rich local multiplayer Tetris remix built in Python, featuring 13 custom tetromino shapes, dynamic gradients, co-op/1v1 split-screen modes, and AI bots.", "short_description_fr": "Un remix enrichi de Tetris en Python avec 13 pi\u00e8ces personnalis\u00e9es, des d\u00e9grad\u00e9s dynamiques, des modes coop\u00e9ratif et 1v1 en \u00e9cran scind\u00e9, ainsi que des bots.", "project_status": "Ended", "project_type": "Personal", "project_showcase_importance": 0, "icon": "res/icons/icon_project_nathetris.png", "links": [{"name_en": "Github", "name_fr": "Github", "url": "https://github.com/nath54/nathetris", "class": "btn-code btn-get btn-action", "icon": "fab fa-github"}, {"name_en": "Windows", "name_fr": "Windows", "url": "https://github.com/nath54/nathetris/releases/download/zip/jeu.zip", "class": "btn-code btn-get btn-action", "icon": "fab fa-windows"}], "app_version": "1.0", "download_size": "48 MB", "tags": ["Python", "Game", "2D", "Pygame", "Arcade"], "gallery": ["res/screenshots/nathetris_1.png", "res/screenshots/nathetris_2.png", "res/screenshots/nathetris_3.png"], "description_en": "<p>Nathetris is a highly customized local multiplayer and single-player Tetris variation developed in Python using Pygame and NumPy. Key Features: 1) Catalog of 13 Tetromino Shapes: Includes standard shapes as well as a 1-block dot, 2-block and 3-block line segments, a corner piece, a 5-block cross, and a 5-block U-shape, completely altering classic strategies. 2) Local Multiplayer Modes: Real-time cooperation (2 players controlling separate blocks on the same grid), cooperative play with a bot, competitive 1v1 split-screen, and competitive play against a bot. 3) Four Coloring Modes: Spawns blocks with fully random colors, shape-bound unique colors, retro high-contrast monochrome (white on black), or a dynamic gradient mode that smoothly transitions colors with each spawned block. 4) Fully Adjustable Rules: Select from three grid sizes (10x18, 15x20, 20x25), four difficulty settings (Easy, Medium, Hard, Hardcore), and four acceleration speeds (None, Slow, Medium, Fast). 5) Hardware Resolution Adaptation: Uses Pygame to read the host display configuration and dynamically scale coordinate systems, providing pixel-perfect menu and board rendering on any aspect ratio.</p>", "description_fr": "<p>Nathetris est une variante hautement personnalisable de Tetris, jouable en solo ou en multijoueur local, d\u00e9velopp\u00e9e en Python avec Pygame et NumPy. Fonctionnalit\u00e9s cl\u00e9s : 1) Catalogue \u00e9tendu \u00e0 13 pi\u00e8ces : Int\u00e8gre les formes classiques ainsi qu'un bloc unique (point), des lignes de 2 ou 3 blocs, un coin \u00e0 3 blocs, une croix \u00e0 5 blocs et une forme en U \u00e0 5 blocs pour renouveler l'approche strat\u00e9gique. 2) Modes multijoueurs en local : Coop\u00e9ration en temps r\u00e9el (deux joueurs contr\u00f4lent deux pi\u00e8ces distinctes sur le m\u00eame plateau), coop\u00e9ration avec un bot d'aide, duel 1v1 en \u00e9cran scind\u00e9 et duel 1v1 contre un bot. 3) Quatre modes de couleurs : Attribution de couleurs enti\u00e8rement al\u00e9atoires, couleurs statiques uniques d\u00e9di\u00e9es \u00e0 chaque forme, monochrome r\u00e9tro (blanc sur noir) et un mode d\u00e9grad\u00e9 dynamique qui fait \u00e9voluer subtilement la couleur \u00e0 chaque nouvelle pi\u00e8ce. 4) Param\u00e8tres personnalisables : Trois tailles de grilles (10x18, 15x20, 20x25), quatre niveaux de difficult\u00e9 (Facile, Moyen, Difficile, Hardcore) et quatre taux d'acc\u00e9l\u00e9ration progressive (Nul, Lent, Moyen, Rapide). 5) Adaptation dynamique \u00e0 l'\u00e9cran : Analyse la r\u00e9solution de l'h\u00f4te au d\u00e9marrage via Pygame pour adapter proportionnellement l'\u00e9chelle des coordonn\u00e9es, garantissant un affichage optimal et sans distorsion.</p>", "funny_comments": [{"user": "StackOverflowSurvivor", "rating": 5, "text_en": "I tried the cooperative mode with my friend. We are no longer on speaking terms, but our grid alignment was mathematically flawless. Highly recommended.", "text_fr": "J'ai test\u00e9 le mode coop\u00e9ratif avec un ami. Nous ne nous parlons plus, mais notre alignement de blocs \u00e9tait math\u00e9matiquement parfait. Je recommande vivement."}, {"user": "PygamePurist", "rating": 4, "text_en": "The single dot block is an absolute miracle sent from the programming heavens. It saved my grid more times than Git has saved my career.", "text_fr": "Le bloc compos\u00e9 d'un seul carr\u00e9 est un miracle absolu envoy\u00e9 du paradis des programmeurs. Il a sauv\u00e9 ma grille plus de fois que Git n'a sauv\u00e9 ma carri\u00e8re."}, {"user": "ChaosMonkey", "rating": 5, "text_en": "Playing Co-op with the bot is like writing code with an intern who has had three cups of coffee and no sleep. Pure, unadulterated chaos.", "text_fr": "Jouer en coop avec le bot \u00e9quivaut \u00e0 \u00e9crire du code avec un stagiaire sous l'effet de trois caf\u00e9s et sans sommeil. Un chaos pur et total."}, {"user": "GradientLover99", "rating": 5, "text_en": "The gradient color mode makes my screen look like a beautiful neon synthwave aesthetic dream, right up until the point where the 5-block cross shape completely ruins my life.", "text_fr": "Le mode d\u00e9grad\u00e9 donne \u00e0 mon \u00e9cran des airs de r\u00eave synthwave n\u00e9on magnifique, jusqu'au moment pr\u00e9cis o\u00f9 la pi\u00e8ce en forme de croix \u00e0 5 blocs vient d\u00e9truire ma vie."}, {"user": "HardwareHacker", "rating": 4, "text_en": "The aspect ratio scaling script is doing some serious dynamic coordinate geometry math just to display falling blocks, and honestly, I respect that level of over-engineering.", "text_fr": "Le script de mise \u00e0 l'\u00e9chelle de l'affichage effectue de la g\u00e9om\u00e9trie de coordonn\u00e9es dynamiques complexe juste pour afficher des blocs qui tombent, et honn\u00eatement, je respecte ce niveau d'ing\u00e9nierie."}, {"user": "HardcoreCasual", "rating": 5, "text_en": "On Hardcore difficulty with maximum acceleration, the blocks fall faster than Python's garbage collector can run. My keyboard is smoking.", "text_fr": "En difficult\u00e9 Hardcore avec acc\u00e9l\u00e9ration maximale, les blocs tombent plus vite que le garbage collector de Python ne s'ex\u00e9cute. Mon clavier fume."}, {"user": "TetrisVeteran", "rating": 5, "text_en": "Standard Tetris has 7 shapes. This game has 13. I spent ten minutes trying to figure out how to rotate a U-shape before realizing my brain does not have the hardware acceleration for this.", "text_fr": "Le Tetris classique a 7 formes. Ce jeu en a 13. J'ai pass\u00e9 dix minutes \u00e0 essayer de comprendre comment faire pivoter un U avant de r\u00e9aliser que mon cerveau n'a pas l'acc\u00e9l\u00e9ration mat\u00e9rielle requise."}, {"user": "GitCommitOrDie", "rating": 4, "text_en": "The menu has an explicit check preventing 1v1 on a 20x25 board. I peeked at the source code and realized the author chose peace and stability over dividing screen widths by zero. Wise choice.", "text_fr": "Le menu contient une v\u00e9rification explicite emp\u00eachant le 1v1 sur un plateau 20x25. J'ai jet\u00e9 un oeil au code source et j'ai compris que l'auteur a pr\u00e9f\u00e9r\u00e9 la paix et la stabilit\u00e9 plut\u00f4t que de diviser les largeurs par z\u00e9ro. Choix sage."}, {"user": "KeyboardMasher", "rating": 5, "text_en": "Player 2 controls are J, K, L, I, and U. It feels like playing a piano concerto while trying to debug a memory leak. 10/10 multiplayer experience.", "text_fr": "Les contr\u00f4les du Joueur 2 sont J, K, L, I et U. On a l'impression de jouer un concerto pour piano tout en essayant de d\u00e9boguer une fuite de m\u00e9moire. Exp\u00e9rience multijoueur 10/10."}, {"user": "CodeSpaghetti", "rating": 5, "text_en": "The README says you can email complaints directly to the creator's personal address. I am going to email him a weekly thank-you letter for making the 1-block dot piece.", "text_fr": "Le README indique que l'on peut envoyer les plaintes directement \u00e0 l'adresse personnelle du cr\u00e9ateur. Je vais lui envoyer un mail de remerciement hebdomadaire pour avoir cr\u00e9\u00e9 la pi\u00e8ce \u00e0 bloc unique."}], "_source_file": "nathetris", "_source_name": "nathetris"}, {"name_en": "Naxel Editor", "name_fr": "Naxel Editor", "short_description_en": "A lightweight 3D voxel ecosystem featuring an expressive JSON-based object format, a serverless web editor, a dynamic JavaScript renderer, and custom light diffusion algorithms.", "short_description_fr": "Un \u00e9cosyst\u00e8me de voxels 3D l\u00e9ger comprenant un format JSON expressif, un \u00e9diteur web sans serveur, une biblioth\u00e8que de rendu JavaScript dynamique et des algorithmes de diffusion de lumi\u00e8re.", "project_status": "Paused", "project_type": "Personal", "project_showcase_importance": 6, "icon": "res/icons/icon_project_naxel_editor.png", "links": [{"name_en": "Github", "name_fr": "Github", "url": "https://github.com/nath54/NaxelEditor", "class": "btn-code btn-get btn-action", "icon": "fab fa-github"}, {"name_en": "Web", "name_fr": "Web", "url": "https://nath54.github.io/NaxelEditor/naxel_editor_webpage/", "class": "btn-code btn-get btn-action", "icon": "fas fa-globe"}], "app_version": "0.9", "download_size": "-", "tags": ["Graphics", "Editor", "3D", "Voxels"], "gallery": ["res/screenshots/naxel_editor_1.png", "res/screenshots/naxel_editor_2.png", "res/screenshots/naxel_editor_3.png"], "description_en": "<p>Naxel Editor is a sophisticated, browser-based 3D voxel modeling and rendering ecosystem designed to maximize creative expressivity while maintaining incredibly compact, highly optimized file sizes. At the heart of the system is the <strong>Naxel JSON specification</strong>, a custom data format that supports high-level procedural primitives (such as spheres, cylinders, lines, rectangles, and polygons), advanced multi-stop color gradients, and color zones.</p>\n<p>The ecosystem consists of three core components:\n1. <strong>Naxel Editor Webpage</strong>: A static, fully serverless web application that enables users to import, edit, visualize, and export Naxel objects directly in the browser. It features a responsive layout with a 3D viewport, a custom palette system, and a 2D slice editor with isometric previews and adjustable ghost layers for seamless workflow efficiency.\n2. <strong>JavaScript Library (<code>lib_naxel</code>)</strong>: A lightweight, self-contained rendering engine designed to dynamically parse and render interactive 3D Naxel objects within any HTML page\u2014perfect for static sites and portfolios (like GitHub Pages).\n3. <strong>Python Renderer</strong>: A backend script capable of generating high-fidelity static images and animated GIFs from Naxel configurations.</p>\n<p>The editor features a custom <strong>Simple Diffusion</strong> lighting algorithm where light behaves as an additive, multi-channel (RGB) multiplier that propagates through empty space and is blocked by opaque voxels, achieving realistic light propagation and soft shadows without heavy GPU requirements.</p>", "description_fr": "<p>Naxel Editor est un \u00e9cosyst\u00e8me sophistiqu\u00e9 de mod\u00e9lisation et de rendu de voxels 3D dans le navigateur, con\u00e7u pour maximiser l'expressivit\u00e9 cr\u00e9ative tout en conservant des fichiers extr\u00eamement compacts et optimis\u00e9s. Au c\u0153ur du syst\u00e8me se trouve la <strong>sp\u00e9cification JSON Naxel</strong>, un format de donn\u00e9es personnalis\u00e9 qui prend en charge des primitives proc\u00e9durales de haut niveau (telles que des sph\u00e8res, des cylindres, des lignes, des rectangles et des polygones), des d\u00e9grad\u00e9s de couleurs complexes et des zones de couleur dynamiques.</p>\n<p>L'\u00e9cosyst\u00e8me se compose de trois \u00e9l\u00e9ments principaux :\n1. <strong>L'\u00e9diteur Naxel Web</strong>: Une application web statique et sans serveur qui permet d'importer, d'\u00e9diter, de visualiser et d'exporter des objets Naxel directement dans le navigateur. Elle int\u00e8gre un viewport 3D r\u00e9actif, un syst\u00e8me de palette personnalis\u00e9e et un \u00e9diteur de tranches 2D avec pr\u00e9visualisations isom\u00e9triques et couches fant\u00f4mes r\u00e9glables.\n2. <strong>La biblioth\u00e8que JavaScript (<code>lib_naxel</code>)</strong>: Un moteur de rendu l\u00e9ger et autonome con\u00e7u pour analyser et afficher dynamiquement des objets Naxel 3D interactifs sur n'importe quelle page HTML, id\u00e9al pour les sites statiques et portfolios (comme GitHub Pages).\n3. <strong>Le moteur de rendu Python</strong>: Un script backend capable de g\u00e9n\u00e9rer des images statiques haute fid\u00e9lit\u00e9 et des GIFs anim\u00e9s \u00e0 partir des configurations Naxel.</p>\n<p>L'\u00e9diteur impl\u00e9mente un algorithme propri\u00e9taire de <strong>diffusion simple de la lumi\u00e8re (Simple Diffusion)</strong>, o\u00f9 la lumi\u00e8re se propage de mani\u00e8re additive dans les espaces vides et est bloqu\u00e9e par les voxels opaques, offrant des jeux de lumi\u00e8re r\u00e9alistes et des ombres douces sans n\u00e9cessiter de ressources GPU massives.</p>", "funny_comments": [{"user": "VoxelViking99", "rating": 5, "text_en": "I spent 3 hours trying to draw a sphere, only to realize the JSON engine could do it with a single line of code. My index finger will never forgive me.", "text_fr": "J'ai pass\u00e9 3 heures \u00e0 essayer de dessiner une sph\u00e8re voxel par voxel, pour r\u00e9aliser que le moteur JSON pouvait le faire en une seule ligne de code. Mon index ne me le pardonnera jamais."}, {"user": "OverflowError", "rating": 4, "text_en": "The Simple Diffusion light algorithm is so simple that my RAM actually understood it. It didn't leak, which is highly suspicious for a JavaScript project.", "text_fr": "L'algorithme de lumi\u00e8re Simple Diffusion est tellement simple que ma RAM l'a r\u00e9ellement compris. Pas de fuite de m\u00e9moire, ce qui est extr\u00eamement suspect pour un projet JavaScript."}, {"user": "Z_Axis_Denialist", "rating": 3, "text_en": "I successfully built a perfect 3D model, but then I switched axes from XY to YZ and entered a parallel dimension where my model is flat and my head hurts.", "text_fr": "J'ai r\u00e9ussi \u00e0 construire un mod\u00e8le 3D parfait, mais j'ai chang\u00e9 d'axe de XY \u00e0 YZ et je suis entr\u00e9 dans une dimension parall\u00e8le o\u00f9 mon mod\u00e8le est plat et j'ai mal \u00e0 la t\u00eate."}, {"user": "JSON_Hoarder", "rating": 5, "text_en": "My voxel model is 500x500x500 but the JSON file is only 1.2 KB because I used three cylinders and a sphere. My hard drive thinks I am a wizard.", "text_fr": "Mon mod\u00e8le voxel fait 500x500x500 mais le fichier JSON ne fait que 1,2 Ko parce que j'ai utilis\u00e9 trois cylindres et une sph\u00e8re. Mon disque dur me prend pour un magicien."}, {"user": "GhostWriter", "rating": 5, "text_en": "The ghost layer feature is amazing! I can see the voxels from the previous slice. Unfortunately, I also started seeing the ghosts of my deleted code branches.", "text_fr": "La fonctionnalit\u00e9 de couche fant\u00f4me est g\u00e9niale ! Je peux voir les voxels de la tranche pr\u00e9c\u00e9dente. Malheureusement, j'ai aussi commenc\u00e9 \u00e0 voir les fant\u00f4mes de mes branches de code supprim\u00e9es."}, {"user": "BugMagnet", "rating": 2, "text_en": "Set the environment sky color to neon pink and the light emission to 9999. I can no longer see my screen, but my room is beautifully illuminated. 10/10 nightlight.", "text_fr": "J'ai r\u00e9gl\u00e9 la couleur du ciel sur rose n\u00e9on et l'\u00e9mission lumineuse sur 9999. Je ne vois plus mon \u00e9cran, mais ma chambre est magnifiquement \u00e9clair\u00e9e. 10/10 pour une veilleuse."}, {"user": "NoGPU_NoProblem", "rating": 5, "text_en": "Runs at 60fps on a school calculator from 2004. Take that, Unreal Engine 5!", "text_fr": "Tourne \u00e0 60 images par seconde sur une calculatrice scolaire de 2004. Prends \u00e7a dans les dents, Unreal Engine 5 !"}, {"user": "ArrayOutOfBounds", "rating": 4, "text_en": "Tried to define a color with RGB values of [999, -50, 42]. The engine clamped it to [255, 0, 42] without crashing. I am offended by how robust this error handling is.", "text_fr": "J'ai essay\u00e9 de d\u00e9finir une couleur avec des valeurs RGB de [999, -50, 42]. Le moteur l'a brid\u00e9e \u00e0 [255, 0, 42] sans crasher. Je suis offens\u00e9 par la robustesse de cette gestion des erreurs."}, {"user": "Sisyphus_Coder", "rating": 1, "text_en": "I built a gorgeous voxel character, clicked Export, and realized my cat had disconnected the internet. Then I remembered it's a serverless static webpage and it worked perfectly offline. I hate that I couldn't be mad.", "text_fr": "J'ai cr\u00e9\u00e9 un superbe personnage voxel, j'ai cliqu\u00e9 sur Exporter et j'ai r\u00e9alis\u00e9 que mon chat avait d\u00e9branch\u00e9 internet. Puis je me suis rappel\u00e9 que c'est un site statique sans serveur et que \u00e7a marchait hors ligne. Je d\u00e9teste ne pas pouvoir \u00eatre en col\u00e8re."}, {"user": "DarkThemeOnly", "rating": 5, "text_en": "The editor has an incredibly sleek dark theme interface. My eyes thanked me, until I turned on the Sun Direction light source and flashbang'd myself.", "text_fr": "L'\u00e9diteur a une interface en th\u00e8me sombre incroyablement \u00e9l\u00e9gante. Mes yeux m'ont remerci\u00e9, jusqu'\u00e0 ce que j'active la source lumineuse Sun Direction et que je me flashbange moi-m\u00eame."}], "_source_file": "naxel_editor", "_source_name": "naxel_editor"}], "cube2.yaml": {"name_en": "Cube2", "name_fr": "Cube2", "short_description_en": "An intense 2D procedurally generated maze game in Pygame where you outrun a cloning shadow, gather keys, and master a grappling hook.", "short_description_fr": "Un jeu d'arcade 2D haletant sous Pygame avec labyrinthes proc\u00e9duraux, o\u00f9 vous fuyez une ombre traqueuse, collectez des cl\u00e9s et ma\u00eetrisez un grappin.", "project_status": "Aborted", "project_type": "Personal", "project_showcase_importance": 2, "icon": "res/icons/icon_project_cube2.png", "links": [{"name_en": "Github", "name_fr": "Github", "url": "https://github.com/nath54/cube2", "class": "btn-code btn-get btn-action", "icon": "fab fa-github"}, {"name_en": "Windows", "name_fr": "Windows", "url": "https://github.com/nath54/cube2/releases/download/2.2/main.zip", "class": "btn-code btn-get btn-action", "icon": "fab fa-windows"}], "app_version": "2.2", "download_size": "31.4 MB", "tags": ["Python", "Game", "2D", "Pygame", "Arcade", "Procedural Generation", "Grappling Hook", "Retro", "Customization"], "gallery": ["res/screenshots/cube2_1.png", "res/screenshots/cube2_2.png", "res/screenshots/cube2_3.png"], "description_en": "<p>Cube2 is a fast-paced 2D arcade-puzzle game built entirely in Python using Pygame. Players navigate randomly generated, color-contrasting mazes with a single goal: reach the exit. But there's a catch\u2014you are chased by a sinister clone (Cube2) that replicates your exact movements with a slight delay, draining your health upon contact. Collect hidden keys to unlock locked exits, evade blinking hazard traps, and survive the collapsing time limit bar at the top of the screen. Reaching Level 10 unlocks a powerful Grappling Hook, allowing high-speed traversal across hallways, provided no walls block your line of sight. Cube2 features a deep progression system with 23 unlockable achievements and over 76 unique player skins divided into color-coded rarity tiers (Common, Rare, Epic, Legendary, Divine), including multi-frame animated skins and rotation mechanics. With 5 difficulty modes (from Very Easy with directional assistance to instant-death Hardcore), an 'Eye-Saver' softer rendering option, custom keyboard mapping, and native joystick support, Cube2 is a complete and highly addictive arcade experience.</p>", "description_fr": "<p>Cube2 est un jeu d'arcade-puzzle 2D effr\u00e9n\u00e9 d\u00e9velopp\u00e9 enti\u00e8rement en Python avec Pygame. Les joueurs naviguent dans des labyrinthes g\u00e9n\u00e9r\u00e9s de mani\u00e8re proc\u00e9durale aux couleurs contrast\u00e9es avec un seul but : atteindre la sortie. Mais attention : vous \u00eates poursuivi par un double mal\u00e9fique (Cube2) qui reproduit exactement vos mouvements avec un l\u00e9ger d\u00e9calage, vidant votre sant\u00e9 s'il vous touche. Collectez des cl\u00e9s cach\u00e9es pour d\u00e9verrouiller la sortie, \u00e9vitez les pi\u00e8ges clignotants et survivez avant que la barre de temps au sommet de l'\u00e9cran ne s'\u00e9puise. Atteindre le niveau 10 d\u00e9bloque un puissant Grappin, permettant de vous propulser \u00e0 grande vitesse dans les couloirs en \u00e9vitant les obstacles directs. Le jeu propose un syst\u00e8me de progression riche avec 23 succ\u00e8s \u00e0 d\u00e9bloquer et plus de 76 skins de joueur uniques r\u00e9partis en raret\u00e9s de couleurs distinctes (Commun, Rare, \u00c9pique, L\u00e9gendaire, Divin), incluant des animations multi-images et des rotations de mouvement. Avec 5 modes de difficult\u00e9 (de Tr\u00e8s Facile avec fl\u00e8ches indicatrices \u00e0 Hardcore avec mort instantan\u00e9e), une option de couleurs douces pour prot\u00e9ger vos yeux, la configuration personnalis\u00e9e des touches et le support manette natif, Cube2 offre une exp\u00e9rience d'arcade compl\u00e8te et addictive.</p>", "funny_comments": [{"user": "ShadowHater99", "rating": 5, "text_en": "Cube2 is like my anxiety: it follows me exactly where I go, but slightly delayed and kills me if I stop moving.", "text_fr": "Cube2 est comme mon anxi\u00e9t\u00e9 : il me suit exactement l\u00e0 o\u00f9 je vais, avec un l\u00e9ger retard, et me tue si j'arr\u00eate de bouger."}, {"user": "SpideySquare", "rating": 4, "text_en": "I unlocked the grappling hook at level 10 and immediately pulled myself straight into a solid wall. 10/10 would die again.", "text_fr": "J'ai d\u00e9bloqu\u00e9 le grappin au niveau 10 et je me suis imm\u00e9diatement propuls\u00e9 dans un mur solide. 10/10, je mourrais \u00e0 nouveau."}, {"user": "CheatCodeEnthusiast", "rating": 5, "text_en": "Pressing C-U-B-E and Enter solved my skill issue by unlocking all 76 skins. My cube is now divine even if my gameplay is absolute trash.", "text_fr": "Taper C-U-B-E et Entr\u00e9e a r\u00e9solu mon manque de talent en d\u00e9bloquant les 76 skins. Mon cube est divin m\u00eame si mon niveau de jeu est \u00e9clat\u00e9."}, {"user": "RageQuitterMax", "rating": 1, "text_en": "Played on Hardcore mode. Breathing too loudly apparently counts as colliding with a wall. My keyboard is now in two pieces.", "text_fr": "J'ai jou\u00e9 en mode Hardcore. Respirer trop fort compte apparemment comme une collision avec un mur. Mon clavier est maintenant en deux morceaux."}, {"user": "NoMoreGlasses", "rating": 5, "text_en": "The 'Couleurs douces' option saved my eyes from the randomized neon hell. My ophthalmologist sends his warmest regards.", "text_fr": "L'option 'Couleurs douces' a sauv\u00e9 mes yeux de l'enfer n\u00e9on al\u00e9atoire. Mon ophtalmologiste vous envoie ses amiti\u00e9s."}, {"user": "TickTockCube", "rating": 4, "text_en": "The top timer bar shrinking makes me sweat more than an actual cardio session. Who knew a white square could cause high blood pressure?", "text_fr": "La barre de temps qui r\u00e9tr\u00e9cit me fait plus transpirer qu'une s\u00e9ance de cardio. Qui savait qu'un carr\u00e9 blanc pouvait causer de l'hypertension ?"
