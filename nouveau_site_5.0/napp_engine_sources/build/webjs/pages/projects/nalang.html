0, 0). Parfait pour \u00e9viter le git blame et les rapports de bogues."}, {"user": "CacheIsKing", "rating": 4, "text_en": "Local Storage falls back to native file writing. Now my settings are saved in a .txt file next to my childhood photos.", "text_fr": "Le stockage local se rabat sur l'\u00e9criture de fichiers natifs. Maintenant, mes param\u00e8tres sont sauvegard\u00e9s dans un fichier .txt \u00e0 c\u00f4t\u00e9 de mes photos d'enfance."}, {"user": "FrenchDev", "rating": 5, "text_en": "The bilingual engine is amazing, but naming a variable 'pain_au_chocolat' throws a compilation error in Toulouse.", "text_fr": "Le moteur bilingue est incroyable, mais nommer une variable 'chocolatine' l\u00e8ve une erreur de compilation \u00e0 Paris."}, {"user": "CompilerOptimist", "rating": 5, "text_en": "0 errors, 1428 warnings. Mostly the compiler asking if I've touched grass recently. 10/10 feature.", "text_fr": "0 erreur, 1428 avertissements. Principalement le compilateur me demandant si j'ai touch\u00e9 de l'herbe r\u00e9cemment. Fonctionnalit\u00e9 10/10."}], "_source_file": "napp_engine_compiler", "_source_name": "napp_engine_compiler"}, "nasong.yaml": {"name_en": "NaSong", "name_fr": "NaSong", "short_description_en": "A Python-based programmatic music synthesizer and sequencer featuring differentiable instruments, an Algo-Rave TUI for live coding, and deep music theory integration.", "short_description_fr": "Un synth\u00e9tiseur et s\u00e9quenceur musical en Python dot\u00e9 d'instruments diff\u00e9rentiables, d'un environnement live-coding TUI (Algo-Rave) et d'un moteur de th\u00e9orie musicale.", "project_status": "Ended", "project_type": "Personal", "project_showcase_importance": 9, "icon": "res/icons/icon_project_nasong.png", "links": [{"name_en": "Github", "name_fr": "Github", "url": "https://github.com/nath54/nasong", "class": "btn-code btn-get btn-action", "icon": "fab fa-github"}], "app_version": "0.1.0", "download_size": "-", "tags": ["Python", "Audio Synthesis", "PyTorch", "Live Coding", "Music Theory", "TUI"], "gallery": [], "description_en": "<p><strong>NaSong</strong> is a highly innovative, modular Python-based music synthesizer, sequencer, and live-coding platform that treats <strong>\"Code as Music\"</strong>. Instead of relying on traditional graphical DAWs with fixed tracks and plugin systems, NaSong allows developers and electronic music composers to build fully custom, mathematically precise, and highly composable audio synthesis graphs entirely in Python.</p>\n<h3>\ud83d\udd0a Key Features &amp; Architectural Capabilities</h3>\n<ul>\n<li><strong>\"Everything is a Value\" Architecture:</strong> At the core of NaSong is the <code>Value</code> system. An audio waveform, an LFO, an ADSR envelope, or a constant value are all modeled as time-varying signal graphs. These graphs leverage fast, vectorized <strong>NumPy</strong> operations (<code>getitem_np</code>) to render complex multi-voice orchestrations in record time.</li>\n<li><strong>Differentiable Audio Synthesis &amp; Deep Learning:</strong> Under the hood, NaSong integrates with <strong>PyTorch</strong> to define trainable instruments. By comparing synthesized waveforms with target audio samples (.wav), the framework uses gradient descent (Adam) and spectral STFT loss to learn optimal synthesizer parameters (such as ADSR envelope values, FM index, or vocal formant frequencies).</li>\n<li><strong>Algo-Rave Terminal User Interface (TUI):</strong> A complete live-coding environment built using <strong>Textual</strong>. It features an integrated code editor with hot-reloading (saving compiles and hot-swaps the audio graph without playback interruption), live BPM/volume controls, and an API documentation browser.</li>\n<li><strong>Advanced Multi-Threaded Audio Engine:</strong> Features a background <code>RenderEngine</code> that computes audio chunks using a priority queue, double-buffering, and version tracking to ensure glitch-free audio playback even during complex real-time script reloads.</li>\n<li><strong>Expressive Domain-Specific Language (DSL):</strong> Offers syntactic sugar for signal chaining via the <code>&gt;&gt;</code> operator (e.g., <code>Chainable(Sin) &gt;&gt; Gain(0.5)</code>), decorators like <code>@instrument</code> and <code>@effect</code>, and typed musical units (<code>BPM</code>, <code>Ms</code>, <code>Bars</code>, <code>Hz</code>).</li>\n<li><strong>Global Music Theory Engine:</strong> Native support for scale systems, chords, progressions, and rhythm patterns, extending from Western modes (major, minor, Phrygian, etc.) to Non-Western traditions like Indian <strong>Ragas</strong>, Arabic <strong>Maqams</strong>, and Indonesian <strong>Gamelan</strong>. Includes pre-built style generators for <strong>Jazz</strong>, <strong>EDM</strong>, and <strong>Lofi</strong>.</li>\n</ul>", "description_fr": "<p><strong>NaSong</strong> est un synth\u00e9tiseur, s\u00e9quenceur et outil de live-coding musical r\u00e9volutionnaire bas\u00e9 sur Python qui applique la philosophie du <strong>\"Code en tant que Musique\"</strong>. Au lieu d'utiliser des stations de travail audio num\u00e9riques (DAW) graphiques traditionnelles, NaSong permet aux d\u00e9veloppeurs et compositeurs de concevoir des graphes de synth\u00e8se audio complexes, math\u00e9matiquement pr\u00e9cis et hautement modulables en \u00e9crivant du code Python.</p>\n<h3>\ud83d\udd0a Fonctionnalit\u00e9s et Architecture Cl\u00e9s</h3>\n<ul>\n<li><strong>Architecture \"Tout est une Valeur\" (Value) :</strong> Le c\u0153ur du syst\u00e8me repose sur des signaux variant dans le temps. Que ce soit une onde sinuso\u00efdale, un LFO, une enveloppe ADSR ou une constante, chaque \u00e9l\u00e9ment est un n\u0153ud de calcul. Les graphes s'appuient sur des op\u00e9rations vectoris\u00e9es <strong>NumPy</strong> (<code>getitem_np</code>) pour un rendu extr\u00eamement rapide.</li>\n<li><strong>Synth\u00e8se Diff\u00e9rentiable et Deep Learning :</strong> NaSong s'int\u00e8gre avec <strong>PyTorch</strong> pour d\u00e9finir des instruments programmables intelligents. En comparant les signaux synth\u00e9tis\u00e9s \u00e0 des \u00e9chantillons audio cibles (.wav), le framework utilise la descente de gradient (Adam) et des pertes spectrales (STFT) pour apprendre les param\u00e8tres optimaux d'enveloppe, d'index FM ou de formants vocaux.</li>\n<li><strong>Interface Terminale Algo-Rave (TUI) :</strong> Un environnement de live-coding immersif d\u00e9velopp\u00e9 avec <strong>Textual</strong>. Il propose un \u00e9diteur int\u00e9gr\u00e9 avec rechargement \u00e0 chaud (la sauvegarde compile et injecte le nouveau graphe sans couper le son), des contr\u00f4les de volume/BPM en temps r\u00e9el, et un explorateur de documentation d'API.</li>\n<li><strong>Moteur Audio Multi-Thread\u00e9 R\u00e9silient :</strong> Le <code>RenderEngine</code> en arri\u00e8re-plan pr\u00e9-calcule les blocs audio via une file d'attente prioritaire, un syst\u00e8me de double-buffering et un suivi des versions pour \u00e9liminer tout artefact sonore ou interruption lors du rechargement de scripts complexes.</li>\n<li><strong>Langage D\u00e9di\u00e9 Expressif (DSL) :</strong> Fournit une syntaxe fluide de cha\u00eenage de signaux via l'op\u00e9rateur de flux <code>&gt;&gt;</code> (ex: <code>Chainable(Sin) &gt;&gt; Gain(0.5)</code>), des d\u00e9corateurs <code>@instrument</code> et <code>@effect</code>, et des unit\u00e9s musicales typ\u00e9es (<code>BPM</code>, <code>Ms</code>, <code>Bars</code>, <code>Hz</code>).</li>\n<li><strong>Moteur de Th\u00e9orie Musicale Avanc\u00e9 :</strong> Support natif complet des gammes, accords, progressions et rythmes, s'\u00e9tendant des modes occidentaux classiques aux syst\u00e8mes microtonaux et ethniques tels que les <strong>Ragas</strong> indiens, les <strong>Maqams</strong> arabes et le <strong>Gamelan</strong> indon\u00e9sien. Inclut des g\u00e9n\u00e9rateurs de styles <strong>Jazz</strong>, <strong>EDM</strong> et <strong>Lofi</strong>.</li>\n</ul>", "funny_comments": [{"user": "DJ_StackOverflow", "rating": 5, "text_en": "I spent 12 hours training a neural synth to sound like a perfect acoustic piano, only to realize I could have just loaded a soundfont. 10/10 would waste GPU cycles again.", "text_fr": "J'ai pass\u00e9 12 heures \u00e0 entra\u00eener un synth\u00e9 neuronal \u00e0 sonner comme un vrai piano acoustique, pour r\u00e9aliser ensuite que j'aurais pu juste charger un soundfont. 10/10, je gaspillerai encore mes cycles GPU."}, {"user": "BPM_Police", "rating": 5, "text_en": "Tried to live-code at 300 BPM on the subway. The hot-reload compiled my synth loop, my headphones exploded, and the person sitting next to me asked if I was hacking the government.", "text_fr": "J'ai essay\u00e9 de faire du live-coding \u00e0 300 BPM dans le m\u00e9tro. Le hot-reload a compil\u00e9 ma boucle de synth\u00e9, mon casque a explos\u00e9, et mon voisin m'a demand\u00e9 si j'\u00e9tais en train de pirater le gouvernement."}, {"user": "NullPointerMelody", "rating": 5, "text_en": "Everything is a Value. Including my bank account after buying a new GPU to train custom flute sounds.", "text_fr": "Tout est une Valeur (Value). Y compris mon compte en banque apr\u00e8s avoir achet\u00e9 un nouveau GPU pour entra\u00eener des sons de fl\u00fbte personnalis\u00e9s."}, {"user": "NoMouseComposer", "rating": 5, "text_en": "My MIDI controller is a mechanical keyboard. My drops are typed, not played. The latency is high, but the satisfaction of throwing a SyntaxError at the drop is unmatched.", "text_fr": "Mon contr\u00f4leur MIDI est un clavier m\u00e9canique. Mes drops sont saisis au clavier, pas jou\u00e9s. La latence est \u00e9lev\u00e9e, mais la satisfaction de balancer une SyntaxError au moment du drop est in\u00e9galable."}, {"user": "NoisyNeighbor", "rating": 5, "text_en": "I trained an instrument on my neighbor's leaf blower to create a noise-drone-metal track. Now they think I'm recording them. They are right.", "text_fr": "J'ai entra\u00een\u00e9 un instrument sur le bruit du souffleur de feuilles de mon voisin pour composer un morceau noise-drone-metal. Maintenant il pense que je l'enregistre. Il a raison."}, {"user": "LFO_Lover", "rating": 5, "text_en": "I modulated my synth's filter cutoff with an LFO, which was modulated by another LFO, which was modulated by the stock market index. The drop hit right when my portfolio crashed.", "text_fr": "J'ai modul\u00e9 le cutoff du filtre de mon synth\u00e9 avec un LFO, lui-m\u00eame modul\u00e9 par un autre LFO, lui-m\u00eame modul\u00e9 par l'indice boursier. Le drop a retenti pile au moment o\u00f9 mon portefeuille s'est effondr\u00e9."}, {"user": "TUI_Raver", "rating": 5, "text_en": "Textual TUI for audio live-coding? Yes, because flashing green terminal text is the only visual effect a real cyber-DJ needs.", "text_fr": "Un TUI Textual pour le live-coding audio ? Oui, parce que du texte de terminal vert qui clignote est le seul effet visuel dont un vrai cyber-DJ a besoin."}, {"user": "GamelanGod", "rating": 5, "text_en": "Configured a non-Western scale with 17 microtones, but my brain only registers C, D, and 'out of tune'. Highly educational, though my cat hates it.", "text_fr": "J'ai configur\u00e9 une gamme non-occidentale \u00e0 17 tons microtonaux, mais mon cerveau n'enregistre que le Do, le R\u00e9, et 'compl\u00e8tement faux'. Tr\u00e8s \u00e9ducatif, m\u00eame si mon chat d\u00e9teste."}, {"user": "WavMaster", "rating": 5, "text_en": "A 3-minute song generated a 1.2GB WAV because I forgot to set a reasonable sample rate. Sounds pristine, but my SSD is crying.", "text_fr": "Une chanson de 3 minutes a g\u00e9n\u00e9r\u00e9 un fichier WAV de 1,2 Go parce que j'ai oubli\u00e9 de d\u00e9finir un taux d'\u00e9chantillonnage raisonnable. Le son est cristallin, mais mon SSD pleure."}, {"user": "BugsAsFeatures", "rating": 5, "text_en": "My rendering crashed because of a division by zero in my ADSR envelope. It made a click sound that was actually a perfect kick drum. Bug? No, instant techno producer.", "text_fr": "Mon rendu a plant\u00e9 en raison d'une division par z\u00e9ro dans mon enveloppe ADSR. \u00c7a a produit un clic qui \u00e9tait en fait un kick parfait. Un bug ? Non, producteur techno instantan\u00e9."}], "_source_file": "nasong", "_source_name": "nasong"}, "nasong": {"name_en": "NaSong", "name_fr": "NaSong", "short_description_en": "A Python-based programmatic music synthesizer and sequencer featuring differentiable instruments, an Algo-Rave TUI for live coding, and deep music theory integration.", "short_description_fr": "Un synth\u00e9tiseur et s\u00e9quenceur musical en Python dot\u00e9 d'instruments diff\u00e9rentiables, d'un environnement live-coding TUI (Algo-Rave) et d'un moteur de th\u00e9orie musicale.", "project_status": "Ended", "project_type": "Personal", "project_showcase_importance": 9, "icon": "res/icons/icon_project_nasong.png", "links": [{"name_en": "Github", "name_fr": "Github", "url": "https://github.com/nath54/nasong", "class": "btn-code btn-get btn-action", "icon": "fab fa-github"}], "app_version": "0.1.0", "download_size": "-", "tags": ["Python", "Audio Synthesis", "PyTorch", "Live Coding", "Music Theory", "TUI"], "gallery": [], "description_en": "<p><strong>NaSong</strong> is a highly innovative, modular Python-based music synthesizer, sequencer, and live-coding platform that treats <strong>\"Code as Music\"</strong>. Instead of relying on traditional graphical DAWs with fixed tracks and plugin systems, NaSong allows developers and electronic music composers to build fully custom, mathematically precise, and highly composable audio synthesis graphs entirely in Python.</p>\n<h3>\ud83d\udd0a Key Features &amp; Architectural Capabilities</h3>\n<ul>\n<li><strong>\"Everything is a Value\" Architecture:</strong> At the core of NaSong is the <code>Value</code> system. An audio waveform, an LFO, an ADSR envelope, or a constant value are all modeled as time-varying signal graphs. These graphs leverage fast, vectorized <strong>NumPy</strong> operations (<code>getitem_np</code>) to render complex multi-voice orchestrations in record time.</li>\n<li><strong>Differentiable Audio Synthesis &amp; Deep Learning:</strong> Under the hood, NaSong integrates with <strong>PyTorch</strong> to define trainable instruments. By comparing synthesized waveforms with target audio samples (.wav), the framework uses gradient descent (Adam) and spectral STFT loss to learn optimal synthesizer parameters (such as ADSR envelope values, FM index, or vocal formant frequencies).</li>\n<li><strong>Algo-Rave Terminal User Interface (TUI):</strong> A complete live-coding environment built using <strong>Textual</strong>. It features an integrated code editor with hot-reloading (saving compiles and hot-swaps the audio graph without playback interruption), live BPM/volume controls, and an API documentation browser.</li>\n<li><strong>Advanced Multi-Threaded Audio Engine:</strong> Features a background <code>RenderEngine</code> that computes audio chunks using a priority queue, double-buffering, and version tracking to ensure glitch-free audio playback even during complex real-time script reloads.</li>\n<li><strong>Expressive Domain-Specific Language (DSL):</strong> Offers syntactic sugar for signal chaining via the <code>&gt;&gt;</code> operator (e.g., <code>Chainable(Sin) &gt;&gt; Gain(0.5)</code>), decorators like <code>@instrument</code> and <code>@effect</code>, and typed musical units (<code>BPM</code>, <code>Ms</code>, <code>Bars</code>, <code>Hz</code>).</li>\n<li><strong>Global Music Theory Engine:</strong> Native support for scale systems, chords, progressions, and rhythm patterns, extending from Western modes (major, minor, Phrygian, etc.) to Non-Western traditions like Indian <strong>Ragas</strong>, Arabic <strong>Maqams</strong>, and Indonesian <strong>Gamelan</strong>. Includes pre-built style generators for <strong>Jazz</strong>, <strong>EDM</strong>, and <strong>Lofi</strong>.</li>\n</ul>", "description_fr": "<p><strong>NaSong</strong> est un synth\u00e9tiseur, s\u00e9quenceur et outil de live-coding musical r\u00e9volutionnaire bas\u00e9 sur Python qui applique la philosophie du <strong>\"Code en tant que Musique\"</strong>. Au lieu d'utiliser des stations de travail audio num\u00e9riques (DAW) graphiques traditionnelles, NaSong permet aux d\u00e9veloppeurs et compositeurs de concevoir des graphes de synth\u00e8se audio complexes, math\u00e9matiquement pr\u00e9cis et hautement modulables en \u00e9crivant du code Python.</p>\n<h3>\ud83d\udd0a Fonctionnalit\u00e9s et Architecture Cl\u00e9s</h3>\n<ul>\n<li><strong>Architecture \"Tout est une Valeur\" (Value) :</strong> Le c\u0153ur du syst\u00e8me repose sur des signaux variant dans le temps. Que ce soit une onde sinuso\u00efdale, un LFO, une enveloppe ADSR ou une constante, chaque \u00e9l\u00e9ment est un n\u0153ud de calcul. Les graphes s'appuient sur des op\u00e9rations vectoris\u00e9es <strong>NumPy</strong> (<code>getitem_np</code>) pour un rendu extr\u00eamement rapide.</li>\n<li><strong>Synth\u00e8se Diff\u00e9rentiable et Deep Learning :</strong> NaSong s'int\u00e8gre avec <strong>PyTorch</strong> pour d\u00e9finir des instruments programmables intelligents. En comparant les signaux synth\u00e9tis\u00e9s \u00e0 des \u00e9chantillons audio cibles (.wav), le framework utilise la descente de gradient (Adam) et des pertes spectrales (STFT) pour apprendre les param\u00e8tres optimaux d'enveloppe, d'index FM ou de formants vocaux.</li>\n<li><strong>Interface Terminale Algo-Rave (TUI) :</strong> Un environnement de live-coding immersif d\u00e9velopp\u00e9 avec <strong>Textual</strong>. Il propose un \u00e9diteur int\u00e9gr\u00e9 avec rechargement \u00e0 chaud (la sauvegarde compile et injecte le nouveau graphe sans couper le son), des contr\u00f4les de volume/BPM en temps r\u00e9el, et un explorateur de documentation d'API.</li>\n<li><strong>Moteur Audio Multi-Thread\u00e9 R\u00e9silient :</strong> Le <code>RenderEngine</code> en arri\u00e8re-plan pr\u00e9-calcule les blocs audio via une file d'attente prioritaire, un syst\u00e8me de double-buffering et un suivi des versions pour \u00e9liminer tout artefact sonore ou interruption lors du rechargement de scripts complexes.</li>\n<li><strong>Langage D\u00e9di\u00e9 Expressif (DSL) :</strong> Fournit une syntaxe fluide de cha\u00eenage de signaux via l'op\u00e9rateur de flux <code>&gt;&gt;</code> (ex: <code>Chainable(Sin) &gt;&gt; Gain(0.5)</code>), des d\u00e9corateurs <code>@instrument</code> et <code>@effect</code>, et des unit\u00e9s musicales typ\u00e9es (<code>BPM</code>, <code>Ms</code>, <code>Bars</code>, <code>Hz</code>).</li>\n<li><strong>Moteur de Th\u00e9orie Musicale Avanc\u00e9 :</strong> Support natif complet des gammes, accords, progressions et rythmes, s'\u00e9tendant des modes occidentaux classiques aux syst\u00e8mes microtonaux et ethniques tels que les <strong>Ragas</strong> indiens, les <strong>Maqams</strong> arabes et le <strong>Gamelan</strong> indon\u00e9sien. Inclut des g\u00e9n\u00e9rateurs de styles <strong>Jazz</strong>, <strong>EDM</strong> et <strong>Lofi</strong>.</li>\n</ul>", "funny_comments": [{"user": "DJ_StackOverflow", "rating": 5, "text_en": "I spent 12 hours training a neural synth to sound like a perfect acoustic piano, only to realize I could have just loaded a soundfont. 10/10 would waste GPU cycles again.", "text_fr": "J'ai pass\u00e9 12 heures \u00e0 entra\u00eener un synth\u00e9 neuronal \u00e0 sonner comme un vrai piano acoustique, pour r\u00e9aliser ensuite que j'aurais pu juste charger un soundfont. 10/10, je gaspillerai encore mes cycles GPU."}, {"user": "BPM_Police", "rating": 5, "text_en": "Tried to live-code at 300 BPM on the subway. The hot-reload compiled my synth loop, my headphones exploded, and the person sitting next to me asked if I was hacking the government.", "text_fr": "J'ai essay\u00e9 de faire du live-coding \u00e0 300 BPM dans le m\u00e9tro. Le hot-reload a compil\u00e9 ma boucle de synth\u00e9, mon casque a explos\u00e9, et mon voisin m'a demand\u00e9 si j'\u00e9tais en train de pirater le gouvernement."}, {"user": "NullPointerMelody", "rating": 5, "text_en": "Everything is a Value. Including my bank account after buying a new GPU to train custom flute sounds.", "text_fr": "Tout est une Valeur (Value). Y compris mon compte en banque apr\u00e8s avoir achet\u00e9 un nouveau GPU pour entra\u00eener des sons de fl\u00fbte personnalis\u00e9s."}, {"user": "NoMouseComposer", "rating": 5, "text_en": "My MIDI controller is a mechanical keyboard. My drops are typed, not played. The latency is high, but the satisfaction of throwing a SyntaxError at the drop is unmatched.", "text_fr": "Mon contr\u00f4leur MIDI est un clavier m\u00e9canique. Mes drops sont saisis au clavier, pas jou\u00e9s. La latence est \u00e9lev\u00e9e, mais la satisfaction de balancer une SyntaxError au moment du drop est in\u00e9galable."}, {"user": "NoisyNeighbor", "rating": 5, "text_en": "I trained an instrument on my neighbor's leaf blower to create a noise-drone-metal track. Now they think I'm recording them. They are right.", "text_fr": "J'ai entra\u00een\u00e9 un instrument sur le bruit du souffleur de feuilles de mon voisin pour composer un morceau noise-drone-metal. Maintenant il pense que je l'enregistre. Il a raison."}, {"user": "LFO_Lover", "rating": 5, "text_en": "I modulated my synth's filter cutoff with an LFO, which was modulated by another LFO, which was modulated by the stock market index. The drop hit right when my portfolio crashed.", "text_fr": "J'ai modul\u00e9 le cutoff du filtre de mon synth\u00e9 avec un LFO, lui-m\u00eame modul\u00e9 par un autre LFO, lui-m\u00eame modul\u00e9 par l'indice boursier. Le drop a retenti pile au moment o\u00f9 mon portefeuille s'est effondr\u00e9."}, {"user": "TUI_Raver", "rating": 5, "text_en": "Textual TUI for audio live-coding? Yes, because flashing green terminal text is the only visual effect a real cyber-DJ needs.", "text_fr": "Un TUI Textual pour le live-coding audio ? Oui, parce que du texte de terminal vert qui clignote est le seul effet visuel dont un vrai cyber-DJ a besoin."}, {"user": "GamelanGod", "rating": 5, "text_en": "Configured a non-Western scale with 17 microtones, but my brain only registers C, D, and 'out of tune'. Highly educational, though my cat hates it.", "text_fr": "J'ai configur\u00e9 une gamme non-occidentale \u00e0 17 tons microtonaux, mais mon cerveau n'enregistre que le Do, le R\u00e9, et 'compl\u00e8tement faux'. Tr\u00e8s \u00e9ducatif, m\u00eame si mon chat d\u00e9teste."}, {"user": "WavMaster", "rating": 5, "text_en": "A 3-minute song generated a 1.2GB WAV because I forgot to set a reasonable sample rate. Sounds pristine, but my SSD is crying.", "text_fr": "Une chanson de 3 minutes a g\u00e9n\u00e9r\u00e9 un fichier WAV de 1,2 Go parce que j'ai oubli\u00e9 de d\u00e9finir un taux d'\u00e9chantillonnage raisonnable. Le son est cristallin, mais mon SSD pleure."}, {"user": "BugsAsFeatures", "rating": 5, "text_en": "My rendering crashed because of a division by zero in my ADSR envelope. It made a click sound that was actually a perfect kick drum. Bug? No, instant techno producer.", "text_fr": "Mon rendu a plant\u00e9 en raison d'une division par z\u00e9ro dans mon enveloppe ADSR. \u00c7a a produit un clic qui \u00e9tait en fait un kick parfait. Un bug ? Non, producteur techno instantan\u00e9."}], "_source_file": "nasong", "_source_name": "nasong"}, "nathetris.yaml": {"name_en": "Nathetris", "name_fr": "Nathetris", "short_description_en": "A feature-rich local multiplayer Tetris remix built in Python, featuring 13 custom tetromino shapes, dynamic gradients, co-op/1v1 split-screen modes, and AI bots.", "short_description_fr": "Un remix enrichi de Tetris en Python avec 13 pi\u00e8ces personnalis\u00e9es, des d\u00e9grad\u00e9s dynamiques, des modes coop\u00e9ratif et 1v1 en \u00e9cran scind\u00e9, ainsi que des bots.", "project_status": "Ended", "project_type": "Personal", "project_showcase_importance": 0, "icon": "res/icons/icon_project_nathetris.png", "links": [{"name_en": "Github", "name_fr": "Github", "url": "https://github.com/nath54/nathetris", "class": "btn-code btn-get btn-action", "icon": "fab fa-github"}, {"name_en": "Windows", "name_fr": "Windows", "url": "https://github.com/nath54/nathetris/releases/download/zip/jeu.zip", "class": "btn-code btn-get btn-action", "icon": "fab fa-windows"}], "app_version": "1.0", "download_size": "48 MB", "tags": ["Python", "Game", "2D", "Pygame", "Arcade"], "gallery": ["res/screenshots/nathetris_1.png", "res/screenshots/nathetris_2.png", "res/screenshots/nathetris_3.png"], "description_en": "<p>Nathetris is a highly customized local multiplayer and single-player Tetris variation developed in Python using Pygame and NumPy. Key Features: 1) Catalog of 13 Tetromino Shapes: Includes standard shapes as well as a 1-block dot, 2-block and 3-block line segments, a corner piece, a 5-block cross, and a 5-block U-shape, completely altering classic strategies. 2) Local Multiplayer Modes: Real-time cooperation (2 players controlling separate blocks on the same grid), cooperative play with a bot, competitive 1v1 split-screen, and competitive play against a bot. 3) Four Coloring Modes: Spawns blocks with fully random colors, shape-bound unique colors, retro high-contrast monochrome (white on black), or a dynamic gradient mode that smoothly transitions colors with each spawned block. 4) Fully Adjustable Rules: Select from three grid sizes (10x18, 15x20, 20x25), four difficulty settings (Easy, Medium, Hard, Hardcore), and four acceleration speeds (None, Slow, Medium, Fast). 5) Hardware Resolution Adaptation: Uses Pygame to read the host display configuration and dynamically scale coordinate systems, providing pixel-perfect menu and board rendering on any aspect ratio.</p>", "description_fr": "<p>Nathetris est une variante hautement personnalisable de Tetris, jouable en solo ou en multijoueur local, d\u00e9velopp\u00e9e en Python avec Pygame et NumPy. Fonctionnalit\u00e9s cl\u00e9s : 1) Catalogue \u00e9tendu \u00e0 13 pi\u00e8ces : Int\u00e8gre les formes classiques ainsi qu'un bloc unique (point), des lignes de 2 ou 3 blocs, un coin \u00e0 3 blocs, une croix \u00e0 5 blocs et une forme en U \u00e0 5 blocs pour renouveler l'approche strat\u00e9gique. 2) Modes multijoueurs en local : Coop\u00e9ration en temps r\u00e9el (deux joueurs contr\u00f4lent deux pi\u00e8ces distinctes sur le m\u00eame plateau), coop\u00e9ration avec un bot d'aide, duel 1v1 en \u00e9cran scind\u00e9 et duel 1v1 contre un bot. 3) Quatre modes de couleurs : Attribution de couleurs enti\u00e8rement al\u00e9atoires, couleurs statiques uniques d\u00e9di\u00e9es \u00e0 chaque forme, monochrome r\u00e9tro (blanc sur noir) et un mode d\u00e9grad\u00e9 dynamique qui fait \u00e9voluer subtilement la couleur \u00e0 chaque nouvelle pi\u00e8ce. 4) Param\u00e8tres personnalisables : Trois tailles de grilles (10x18, 15x20, 20x25), quatre niveaux de difficult\u00e9 (Facile, Moyen, Difficile, Hardcore) et quatre taux d'acc\u00e9l\u00e9ration progressive (Nul, Lent, Moyen, Rapide). 5) Adaptation dynamique \u00e0 l'\u00e9cran : Analyse la r\u00e9solution de l'h\u00f4te au d\u00e9marrage via Pygame pour adapter proportionnellement l'\u00e9chelle des coordonn\u00e9es, garantissant un affichage optimal et sans distorsion.</p>", "funny_comments": [{"user": "StackOverflowSurvivor", "rating": 5, "text_en": "I tried the cooperative mode with my friend. We are no longer on speaking terms, but our grid alignment was mathematically flawless. Highly recommended.", "text_fr": "J'ai test\u00e9 le mode coop\u00e9ratif avec un ami. Nous ne nous parlons plus, mais notre alignement de blocs \u00e9tait math\u00e9matiquement parfait. Je recommande vivement."}, {"user": "PygamePurist", "rating": 4, "text_en": "The single dot block is an absolute miracle sent from the programming heavens. It saved my grid more times than Git has saved my career.", "text_fr": "Le bloc compos\u00e9 d'un seul carr\u00e9 est un miracle absolu envoy\u00e9 du paradis des programmeurs. Il a sauv\u00e9 ma grille plus de fois que Git n'a sauv\u00e9 ma carri\u00e8re."}, {"user": "ChaosMonkey", "rating": 5, "text_en": "Playing Co-op with the bot is like writing code with an intern who has had three cups of coffee and no sleep. Pure, unadulterated chaos.", "text_fr": "Jouer en coop avec le bot \u00e9quivaut \u00e0 \u00e9crire du code avec un stagiaire sous l'effet de trois caf\u00e9s et sans sommeil. Un chaos pur et total."}, {"user": "GradientLover99", "rating": 5, "text_en": "The gradient color mode makes my screen look like a beautiful neon synthwave aesthetic dream, right up until the point where the 5-block cross shape completely ruins my life.", "text_fr": "Le mode d\u00e9grad\u00e9 donne \u00e0 mon \u00e9cran des airs de r\u00eave synthwave n\u00e9on magnifique, jusqu'au moment pr\u00e9cis o\u00f9 la pi\u00e8ce en forme de croix \u00e0 5 blocs vient d\u00e9truire ma vie."}, {"user": "HardwareHacker", "rating": 4, "text_en": "The aspect ratio scaling script is doing some serious dynamic coordinate geometry math just to display falling blocks, and honestly, I respect that level of over-engineering.", "text_fr": "Le script de mise \u00e0 l'\u00e9chelle de l'affichage effectue de la g\u00e9om\u00e9trie de coordonn\u00e9es dynamiques complexe juste pour afficher des blocs qui tombent, et honn\u00eatement, je respecte ce niveau d'ing\u00e9nierie."}, {"user": "HardcoreCasual", "rating": 5, "text_en": "On Hardcore difficulty with maximum acceleration, the blocks fall faster than Python's garbage collector can run. My keyboard is smoking.", "text_fr": "En difficult\u00e9 Hardcore avec acc\u00e9l\u00e9ration maximale, les blocs tombent plus vite que le garbage collector de Python ne s'ex\u00e9cute. Mon clavier fume."}, {"user": "TetrisVeteran", "rating": 5, "text_en": "Standard Tetris has 7 shapes. This game has 13. I spent ten minutes trying to figure out how to rotate a U-shape before realizing my brain does not have the hardware acceleration for this.", "text_fr": "Le Tetris classique a 7 formes. Ce jeu en a 13. J'ai pass\u00e9 dix minutes \u00e0 essayer de comprendre comment faire pivoter un U avant de r\u00e9aliser que mon cerveau n'a pas l'acc\u00e9l\u00e9ration mat\u00e9rielle requise."}, {"user": "GitCommitOrDie", "rating": 4, "text_en": "The menu has an explicit check preventing 1v1 on a 20x25 board. I peeked at the source code and realized the author chose peace and stability over dividing screen widths by zero. Wise choice.", "text_fr": "Le menu contient une v\u00e9rification explicite emp\u00eachant le 1v1 sur un plateau 20x25. J'ai jet\u00e9 un oeil au code source et j'ai compris que l'auteur a pr\u00e9f\u00e9r\u00e9 la paix et la stabilit\u00e9 plut\u00f4t que de diviser les largeurs par z\u00e9ro. Choix sage."}, {"user": "KeyboardMasher", "rating": 5, "text_en": "Player 2 controls are J, K, L, I, and U. It feels like playing a piano concerto while trying to debug a memory leak. 10/10 multiplayer experience.", "text_fr": "Les contr\u00f4les du Joueur 2 sont J, K, L, I et U. On a l'impression de jouer un concerto pour piano tout en essayant de d\u00e9boguer une fuite de m\u00e9moire. Exp\u00e9rience multijoueur 10/10."}, {"user": "CodeSpaghetti", "rating": 5, "text_en": "The README says you can email complaints directly to the creator's personal address. I am going to email him a weekly thank-you letter for making the 1-block dot piece.", "text_fr": "Le README indique que l'on peut envoyer les plaintes directement \u00e0 l'adresse personnelle du cr\u00e9ateur. Je vais lui envoyer un mail de remerciement hebdomadaire pour avoir cr\u00e9\u00e9 la pi\u00e8ce \u00e0 bloc unique."}], "_source_file": "nathetris", "_source_name": "nathetris"}, "nathetris": {"name_en": "Nathetris", "name_fr": "Nathetris", "short_description_en": "A feature-rich local multiplayer Tetris remix built in Python, featuring 13 custom tetromino shapes, dynamic gradients, co-op/1v1 split-screen modes, and AI bots.", "short_description_fr": "Un remix enrichi de Tetris en Python avec 13 pi\u00e8ces personnalis\u00e9es, des d\u00e9grad\u00e9s dynamiques, des modes coop\u00e9ratif et 1v1 en \u00e9cran scind\u00e9, ainsi que des bots.", "project_status": "Ended", "project_type": "Personal", "project_showcase_importance": 0, "icon": "res/icons/icon_project_nathetris.png", "links": [{"name_en": "Github", "name_fr": "Github", "url": "https://github.com/nath54/nathetris", "class": "btn-code btn-get btn-action", "icon": "fab fa-github"}, {"name_en": "Windows", "name_fr": "Windows", "url": "https://github.com/nath54/nathetris/releases/download/zip/jeu.zip", "class": "btn-code btn-get btn-action", "icon": "fab fa-windows"}], "app_version": "1.0", "download_size": "48 MB", "tags": ["Python", "Game", "2D", "Pygame", "Arcade"], "gallery": ["res/screenshots/nathetris_1.png", "res/screenshots/nathetris_2.png", "res/screenshots/nathetris_3.png"], "description_en": "<p>Nathetris is a highly customized local multiplayer and single-player Tetris variation developed in Python using Pygame and NumPy. Key Features: 1) Catalog of 13 Tetromino Shapes: Includes standard shapes as well as a 1-block dot, 2-block and 3-block line segments, a corner piece, a 5-block cross, and a 5-block U-shape, completely altering classic strategies. 2) Local Multiplayer Modes: Real-time cooperation (2 players controlling separate blocks on the same grid), cooperative play with a bot, competitive 1v1 split-screen, and competitive play against a bot. 3) Four Coloring Modes: Spawns blocks with fully random colors, shape-bound unique colors, retro high-contrast monochrome (white on black), or a dynamic gradient mode that smoothly transitions colors with each spawned block. 4) Fully Adjustable Rules: Select from three grid sizes (10x18, 15x20, 20x25), four difficulty settings (Easy, Medium, Hard, Hardcore), and four acceleration speeds (None, Slow, Medium, Fast). 5) Hardware Resolution Adaptation: Uses Pygame to read the host display configuration and dynamically scale coordinate systems, providing pixel-perfect menu and board rendering on any aspect ratio.</p>", "description_fr": "<p>Nathetris est une variante hautement personnalisable de Tetris, jouable en solo ou en multijoueur local, d\u00e9velopp\u00e9e en Python avec Pygame et NumPy. Fonctionnalit\u00e9s cl\u00e9s : 1) Catalogue \u00e9tendu \u00e0 13 pi\u00e8ces : Int\u00e8gre les formes classiques ainsi qu'un bloc unique (point), des lignes de 2 ou 3 blocs, un coin \u00e0 3 blocs, une croix \u00e0 5 blocs et une forme en U \u00e0 5 blocs pour renouveler l'approche strat\u00e9gique. 2) Modes multijoueurs en local : Coop\u00e9ration en temps r\u00e9el (deux joueurs contr\u00f4lent deux pi\u00e8ces distinctes sur le m\u00eame plateau), coop\u00e9ration avec un bot d'aide, duel 1v1 en \u00e9cran scind\u00e9 et duel 1v1 contre un bot. 3) Quatre modes de couleurs : Attribution de couleurs enti\u00e8rement al\u00e9atoires, couleurs statiques uniques d\u00e9di\u00e9es \u00e0 chaque forme, monochrome r\u00e9tro (blanc sur noir) et un mode d\u00e9grad\u00e9 dynamique qui fait \u00e9voluer subtilement la couleur \u00e0 chaque nouvelle pi\u00e8ce. 4) Param\u00e8tres personnalisables : Trois tailles de grilles (10x18, 15x20, 20x25), quatre niveaux de difficult\u00e9 (Facile, Moyen, Difficile, Hardcore) et quatre taux d'acc\u00e9l\u00e9ration progressive (Nul, Lent, Moyen, Rapide). 5) Adaptation dynamique \u00e0 l'\u00e9cran : Analyse la r\u00e9solution de l'h\u00f4te au d\u00e9marrage via Pygame pour adapter proportionnellement l'\u00e9chelle des coordonn\u00e9es, garantissant un affichage optimal et sans distorsion.</p>", "funny_comments": [{"user": "StackOverflowSurvivor", "rating": 5, "text_en": "I tried the cooperative mode with my friend. We are no longer on speaking terms, but our grid alignment was mathematically flawless. Highly recommended.", "text_fr": "J'ai test\u00e9 le mode coop\u00e9ratif avec un ami. Nous ne nous parlons plus, mais notre alignement de blocs \u00e9tait math\u00e9matiquement parfait. Je recommande vivement."}, {"user": "PygamePurist", "rating": 4, "text_en": "The single dot block is an absolute miracle sent from the programming heavens. It saved my grid more times than Git has saved my career.", "text_fr": "Le bloc compos\u00e9 d'un seul carr\u00e9 est un miracle absolu envoy\u00e9 du paradis des programmeurs. Il a sauv\u00e9 ma grille plus de fois que Git n'a sauv\u00e9 ma carri\u00e8re."}, {"user": "ChaosMonkey", "rating": 5, "text_en": "Playing Co-op with the bot is like writing code with an intern who has had three cups of coffee and no sleep. Pure, unadulterated chaos.", "text_fr": "Jouer en coop avec le bot \u00e9quivaut \u00e0 \u00e9crire du code avec un stagiaire sous l'effet de trois caf\u00e9s et sans sommeil. Un chaos pur et total."}, {"user": "GradientLover99", "rating": 5, "text_en": "The gradient color mode makes my screen look like a beautiful neon synthwave aesthetic dream, right up until the point where the 5-block cross shape completely ruins my life.", "text_fr": "Le mode d\u00e9grad\u00e9 donne \u00e0 mon \u00e9cran des airs de r\u00eave synthwave n\u00e9on magnifique, jusqu'au moment pr\u00e9cis o\u00f9 la pi\u00e8ce en forme de croix \u00e0 5 blocs vient d\u00e9truire ma vie."}, {"user": "HardwareHacker", "rating": 4, "text_en": "The aspect ratio scaling script is doing some serious dynamic coordinate geometry math just to display falling blocks, and honestly, I respect that level of over-engineering.", "text_fr": "Le script de mise \u00e0 l'\u00e9chelle de l'affichage effectue de la g\u00e9om\u00e9trie de coordonn\u00e9es dynamiques complexe juste pour afficher des blocs qui tombent, et honn\u00eatement, je respecte ce niveau d'ing\u00e9nierie."}, {"user": "HardcoreCasual", "rating": 5, "text_en": "On Hardcore difficulty with maximum acceleration, the blocks fall faster than Python's garbage collector can run. My keyboard is smoking.", "text_fr": "En difficult\u00e9 Hardcore avec acc\u00e9l\u00e9ration maximale, les blocs tombent plus vite que le garbage collector de Python ne s'ex\u00e9cute. Mon clavier fume."}, {"user": "TetrisVeteran", "rating": 5, "text_en": "Standard Tetris has 7 shapes. This game has 13. I spent ten minutes trying to figure out how to rotate a U-shape before realizing my brain does not have the hardware acceleration for this.", "text_fr": "Le Tetris classique a 7 formes. Ce jeu en a 13. J'ai pass\u00e9 dix minutes \u00e0 essayer de comprendre comment faire pivoter un U avant de r\u00e9aliser que mon cerveau n'a pas l'acc\u00e9l\u00e9ration mat\u00e9rielle requise."}, {"user": "GitCommitOrDie", "rating": 4, "text_en": "The menu has an explicit check preventing 1v1 on a 20x25 board. I peeked at the source code and realized the author chose peace and stability over dividing screen widths by zero. Wise choice.", "text_fr": "Le menu contient une v\u00e9rification explicite emp\u00eachant le 1v1 sur un plateau 20x25. J'ai jet\u00e9 un oeil au code source et j'ai compris que l'auteur a pr\u00e9f\u00e9r\u00e9 la paix et la stabilit\u00e9 plut\u00f4t que de diviser les largeurs par z\u00e9ro. Choix sage."}, {"user": "KeyboardMasher", "rating": 5, "text_en": "Player 2 controls are J, K, L, I, and U. It feels like playing a piano concerto while trying to debug a memory leak. 10/10 multiplayer experience.", "text_fr": "Les contr\u00f4les du Joueur 2 sont J, K, L, I et U. On a l'impression de jouer un concerto pour piano tout en essayant de d\u00e9boguer une fuite de m\u00e9moire. Exp\u00e9rience multijoueur 10/10."}, {"user": "CodeSpaghetti", "rating": 5, "text_en": "The README says you can email complaints directly to the creator's personal address. I am going to email him a weekly thank-you letter for making the 1-block dot piece.", "text_fr": "Le README indique que l'on peut envoyer les plaintes directement \u00e0 l'adresse personnelle du cr\u00e9ateur. Je vais lui envoyer un mail de remerciement hebdomadaire pour avoir cr\u00e9\u00e9 la pi\u00e8ce \u00e0 bloc unique."}], "_source_file": "nathetris", "_source_name": "nathetris"}, "naxel_editor.yaml": {"name_en": "Naxel Editor", "name_fr": "Naxel Editor", "short_description_en": "A lightweight 3D voxel ecosystem featuring an expressive JSON-based object format, a serverless web editor, a dynamic JavaScript renderer, and custom light diffusion algorithms.", "short_description_fr": "Un \u00e9cosyst\u00e8me de voxels 3D l\u00e9ger comprenant un format JSON expressif, un \u00e9diteur web sans serveur, une biblioth\u00e8que de rendu JavaScript dynamique et des algorithmes de diffusion de lumi\u00e8re.", "project_status": "Paused", "project_type": "Personal", "project_showcase_importance": 6, "icon": "res/icons/icon_project_naxel_editor.png", "links": [{"name_en": "Github", "name_fr": "Github", "url": "https://github.com/nath54/NaxelEditor", "class": "btn-code btn-get btn-action", "icon": "fab fa-github"}, {"name_en": "Web", "name_fr": "Web", "url": "https://nath54.github.io/NaxelEditor/naxel_editor_webpage/", "class": "btn-code btn-get btn-action", "icon": "fas fa-globe"}], "app_version": "0.9", "download_size": "-", "tags": ["Graphics", "Editor", "3D", "Voxels"], "gallery": ["res/screenshots/naxel_editor_1.png", "res/screenshots/naxel_editor_2.png", "res/screenshots/naxel_editor_3.png"], "description_en": "<p>Naxel Editor is a sophisticated, browser-based 3D voxel modeling and rendering ecosystem designed to maximize creative expressivity while maintaining incredibly compact, highly optimized file sizes. At the heart of the system is the <strong>Naxel JSON specification</strong>, a custom data format that supports high-level procedural primitives (such as spheres, cylinders, lines, rectangles, and polygons), advanced multi-stop color gradients, and color zones.</p>\n<p>The ecosystem consists of three core components:\n1. <strong>Naxel Editor Webpage</strong>: A static, fully serverless web application that enables users to import, edit, visualize, and export Naxel objects directly in the browser. It features a responsive layout with a 3D viewport, a custom palette system, and a 2D slice editor with isometric previews and adjustable ghost layers for seamless workflow efficiency.\n2. <strong>JavaScript Library (<code>lib_naxel</code>)</strong>: A lightweight, self-contained rendering engine designed to dynamically parse and render interactive 3D Naxel objects within any HTML page\u2014perfect for static sites and portfolios (like GitHub Pages).\n3. <strong>Python Renderer</strong>: A backend script capable of generating high-fidelity static images and animated GIFs from Naxel configurations.</p>\n<p>The editor features a custom <strong>Simple Diffusion</strong> lighting algorithm where light behaves as an additive, multi-channel (RGB) multiplier that propagates through empty space and is blocked by opaque voxels, achieving realistic light propagation and soft shadows without heavy GPU requirements.</p>", "description_fr": "<p>Naxel Editor est un \u00e9cosyst\u00e8me sophistiqu\u00e9 de mod\u00e9lisation et de rendu de voxels 3D dans le navigateur, con\u00e7u pour maximiser l'expressivit\u00e9 cr\u00e9ative tout en conservant des fichiers extr\u00eamement compacts et optimis\u00e9s. Au c\u0153ur du syst\u00e8me se trouve la <strong>sp\u00e9cification JSON Naxel</strong>, un format de donn\u00e9es personnalis\u00e9 qui prend en charge des primitives proc\u00e9durales de haut niveau (telles que des sph\u00e8res, des cylindres, des lignes, des rectangles et des polygones), des d\u00e9grad\u00e9s de couleurs complexes et des zones de couleur dynamiques.</p>\n<p>L'\u00e9cosyst\u00e8me se compose de trois \u00e9l\u00e9ments principaux :\n1. <strong>L'\u00e9diteur Naxel Web</strong>: Une application web statique et sans serveur qui permet d'importer, d'\u00e9diter, de visualiser et d'exporter des objets Naxel directement dans le navigateur. Elle int\u00e8gre un viewport 3D r\u00e9actif, un syst\u00e8me de palette personnalis\u00e9e et un \u00e9diteur de tranches 2D avec pr\u00e9visualisations isom\u00e9triques et couches fant\u00f4mes r\u00e9glables.\n2. <strong>La biblioth\u00e8que JavaScript (<code>lib_naxel</code>)</strong>: Un moteur de rendu l\u00e9ger et autonome con\u00e7u pour analyser et afficher dynamiquement des objets Naxel 3D interactifs sur n'importe quelle page HTML, id\u00e9al pour les sites statiques et portfolios (comme GitHub Pages).\n3. <strong>Le moteur de rendu Python</strong>: Un script backend capable de g\u00e9n\u00e9rer des images statiques haute fid\u00e9lit\u00e9 et des GIFs anim\u00e9s \u00e0 partir des configurations Naxel.</p>\n<p>L'\u00e9diteur impl\u00e9mente un algorithme propri\u00e9taire de <strong>diffusion simple de la lumi\u00e8re (Simple Diffusion)</strong>, o\u00f9 la lumi\u00e8re se propage de mani\u00e8re additive dans les espaces vides et est bloqu\u00e9e par les voxels opaques, offrant des jeux de lumi\u00e8re r\u00e9alistes et des ombres douces sans n\u00e9cessiter de ressources GPU massives.</p>", "funny_comments": [{"user": "VoxelViking99", "rating": 5, "text_en": "I spent 3 hours trying to draw a sphere, only to realize the JSON engine could do it with a single line of code. My index finger will never forgive me.", "text_fr": "J'ai pass\u00e9 3 heures \u00e0 essayer de dessiner une sph\u00e8re voxel par voxel, pour r\u00e9aliser que le moteur JSON pouvait le faire en une seule ligne de code. Mon index ne me le pardonnera jamais."}, {"user": "OverflowError", "rating": 4, "text_en": "The Simple Diffusion light algorithm is so simple that my RAM actually understood it. It didn't leak, which is highly suspicious for a JavaScript project.", "text_fr": "L'algorithme de lumi\u00e8re Simple Diffusion est tellement simple que ma RAM l'a r\u00e9ellement compris. Pas de fuite de m\u00e9moire, ce qui est extr\u00eamement suspect pour un projet JavaScript."}, {"user": "Z_Axis_Denialist", "rating": 3, "text_en": "I successfully built a perfect 3D model, but then I switched axes from XY to YZ and entered a parallel dimension where my model is flat and my head hurts.", "text_fr": "J'ai r\u00e9ussi \u00e0 construire un mod\u00e8le 3D parfait, mais j'ai chang\u00e9 d'axe de XY \u00e0 YZ et je suis entr\u00e9 dans une dimension parall\u00e8le o\u00f9 mon mod\u00e8le est plat et j'ai mal \u00e0 la t\u00eate."}, {"user": "JSON_Hoarder", "rating": 5, "text_en": "My voxel model is 500x500x500 but the JSON file is only 1.2 KB because I used three cylinders and a sphere. My hard drive thinks I am a wizard.", "text_fr": "Mon mod\u00e8le voxel fait 500x500x500 mais le fichier JSON ne fait que 1,2 Ko parce que j'ai utilis\u00e9 trois cylindres et une sph\u00e8re. Mon disque dur me prend pour un magicien."}, {"user": "GhostWriter", "rating": 5, "text_en": "The ghost layer feature is amazing! I can see the voxels from the previous slice. Unfortunately, I also started seeing the ghosts of my deleted code branches.", "text_fr": "La fonctionnalit\u00e9 de couche fant\u00f4me est g\u00e9niale ! Je peux voir les voxels de la tranche pr\u00e9c\u00e9dente. Malheureusement, j'ai aussi commenc\u00e9 \u00e0 voir les fant\u00f4mes de mes branches de code supprim\u00e9es."}, {"user": "BugMagnet", "rating": 2, "text_en": "Set the environment sky color to neon pink and the light emission to 9999. I can no longer see my screen, but my room is beautifully illuminated. 10/10 nightlight.", "text_fr": "J'ai r\u00e9gl\u00e9 la couleur du ciel sur rose n\u00e9on et l'\u00e9mission lumineuse sur 9999. Je ne vois plus mon \u00e9cran, mais ma chambre est magnifiquement \u00e9clair\u00e9e. 10/10 pour une veilleuse."}, {"user": "NoGPU_NoProblem", "rating": 5, "text_en": "Runs at 60fps on a school calculator from 2004. Take that, Unreal Engine 5!", "text_fr": "Tourne \u00e0 60 images par seconde sur une calculatrice scolaire de 2004. Prends \u00e7a dans les dents, Unreal Engine 5 !"}, {"user": "ArrayOutOfBounds", "rating": 4, "text_en": "Tried to define a color with RGB values of [999, -50, 42]. The engine clamped it to [255, 0, 42] without crashing. I am offended by how robust this error handling is.", "text_fr": "J'ai essay\u00e9 de d\u00e9finir une couleur avec des valeurs RGB de [999, -50, 42]. Le moteur l'a brid\u00e9e \u00e0 [255, 0, 42] sans crasher. Je suis offens\u00e9 par la robustesse de cette gestion des erreurs."}, {"user": "Sisyphus_Coder", "rating": 1, "text_en": "I built a gorgeous voxel character, clicked Export, and realized my cat had disconnected the internet. Then I remembered it's a serverless static webpage and it worked perfectly offline. I hate that I couldn't be mad.", "text_fr": "J'ai cr\u00e9\u00e9 un superbe personnage voxel, j'ai cliqu\u00e9 sur Exporter et j'ai r\u00e9alis\u00e9 que mon chat avait d\u00e9branch\u00e9 internet. Puis je me suis rappel\u00e9 que c'est un site statique sans serveur et que \u00e7a marchait hors ligne. Je d\u00e9teste ne pas pouvoir \u00eatre en col\u00e8re."}, {"user": "DarkThemeOnly", "rating": 5, "text_en": "The editor has an incredibly sleek dark theme interface. My eyes thanked me, until I turned on the Sun Direction light source and flashbang'd myself.", "text_fr": "L'\u00e9diteur a une interface en th\u00e8me sombre incroyablement \u00e9l\u00e9gante. Mes yeux m'ont remerci\u00e9, jusqu'\u00e0 ce que j'active la source lumineuse Sun Direction et que je me flashbange moi-m\u00eame."}], "_source_file": "naxel_editor", "_source_name": "naxel_editor"}, "naxel_editor": {"name_en": "Naxel Editor", "name_fr": "Naxel Editor", "short_description_en": "A lightweight 3D voxel ecosystem featuring an expressive JSON-based object format, a serverless web editor, a dynamic JavaScript renderer, and custom light diffusion algorithms.", "short_description_fr": "Un \u00e9cosyst\u00e8me de voxels 3D l\u00e9ger comprenant un format JSON expressif, un \u00e9diteur web sans serveur, une biblioth\u00e8que de rendu JavaScript dynamique et des algorithmes de diffusion de lumi\u00e8re.", "project_status": "Paused", "project_type": "Personal", "project_showcase_importance": 6, "icon": "res/icons/icon_project_naxel_editor.png", "links": [{"name_en": "Github", "name_fr": "Github", "url": "https://github.com/nath54/NaxelEditor", "class": "btn-code btn-get btn-action", "icon": "fab fa-github"}, {"name_en": "Web", "name_fr": "Web", "url": "https://nath54.github.io/NaxelEditor/naxel_editor_webpage/", "class": "btn-code btn-get btn-action", "icon": "fas fa-globe"}], "app_version": "0.9", "download_size": "-", "tags": ["Graphics", "Editor", "3D", "Voxels"], "gallery": ["res/screenshots/naxel_editor_1.png", "res/screenshots/naxel_editor_2.png", "res/screenshots/naxel_editor_3.png"], "description_en": "<p>Naxel Editor is a sophisticated, browser-based 3D voxel modeling and rendering ecosystem designed to maximize creative expressivity while maintaining incredibly compact, highly optimized file sizes. At the heart of the system is the <strong>Naxel JSON specification</strong>, a custom data format that supports high-level procedural primitives (such as spheres, cylinders, lines, rectangles, and polygons), advanced multi-stop color gradients, and color zones.</p>\n<p>The ecosystem consists of three core components:\n1. <strong>Naxel Editor Webpage</strong>: A static, fully serverless web application that enables users to import, edit, visualize, and export Naxel objects directly in the browser. It features a responsive layout with a 3D viewport, a custom palette system, and a 2D slice editor with isometric previews and adjustable ghost layers for seamless workflow efficiency.\n2. <strong>JavaScript Library (<code>lib_naxel</code>)</strong>: A lightweight, self-contained rendering engine designed to dynamically parse and render interactive 3D Naxel objects within any HTML page\u2014perfect for static sites and portfolios (like GitHub Pages).\n3. <strong>Python Renderer</strong>: A backend script capable of generating high-fidelity static images and animated GIFs from Naxel configurations.</p>\n<p>The editor features a custom <strong>Simple Diffusion</strong> lighting algorithm where light behaves as an additive, multi-channel (RGB) multiplier that propagates through empty space and is blocked by opaque voxels, achieving realistic light propagation and soft shadows without heavy GPU requirements.</p>", "description_fr": "<p>Naxel Editor est un \u00e9cosyst\u00e8me sophistiqu\u00e9 de mod\u00e9lisation et de rendu de voxels 3D dans le navigateur, con\u00e7u pour maximiser l'expressivit\u00e9 cr\u00e9ative tout en conservant des fichiers extr\u00eamement compacts et optimis\u00e9s. Au c\u0153ur du syst\u00e8me se trouve la <strong>sp\u00e9cification JSON Naxel</strong>, un format de donn\u00e9es personnalis\u00e9 qui prend en charge des primitives proc\u00e9durales de haut niveau (telles que des sph\u00e8res, des cylindres, des lignes, des rectangles et des polygones), des d\u00e9grad\u00e9s de couleurs complexes et des zones de couleur dynamiques.</p>\n<p>L'\u00e9cosyst\u00e8me se compose de trois \u00e9l\u00e9ments principaux :\n1. <strong>L'\u00e9diteur Naxel Web</strong>: Une application web statique et sans serveur qui permet d'importer, d'\u00e9diter, de visualiser et d'exporter des objets Naxel directement dans le navigateur. Elle int\u00e8gre un viewport 3D r\u00e9actif, un syst\u00e8me de palette personnalis\u00e9e et un \u00e9diteur de tranches 2D avec pr\u00e9visualisations isom\u00e9triques et couches fant\u00f4mes r\u00e9glables.\n2. <strong>La biblioth\u00e8que JavaScript (<code>lib_naxel</code>)</strong>: Un moteur de rendu l\u00e9ger et autonome con\u00e7u pour analyser et afficher dynamiquement des objets Naxel 3D interactifs sur n'importe quelle page HTML, id\u00e9al pour les sites statiques et portfolios (comme GitHub Pages).\n3. <strong>Le moteur de rendu Python</strong>: Un script backend capable de g\u00e9n\u00e9rer des images statiques haute fid\u00e9lit\u00e9 et des GIFs anim\u00e9s \u00e0 partir des configurations Naxel.</p>\n<p>L'\u00e9diteur impl\u00e9mente un algorithme propri\u00e9taire de <strong>diffusion simple de la lumi\u00e8re (Simple Diffusion)</strong>, o\u00f9 la lumi\u00e8re se propage de mani\u00e8re additive dans les espaces vides et est bloqu\u00e9e par les voxels opaques, offrant des jeux de lumi\u00e8re r\u00e9alistes et des ombres douces sans n\u00e9cessiter de ressources GPU massives.</p>", "funny_comments": [{"user": "VoxelViking99", "rating": 5, "text_en": "I spent 3 hours trying to draw a sphere, only to realize the JSON engine could do it with a single line of code. My index finger will never forgive me.", "text_fr": "J'ai pass\u00e9 3 heures \u00e0 essayer de dessiner une sph\u00e8re voxel par voxel, pour r\u00e9aliser que le moteur JSON pouvait le faire en une seule ligne de code. Mon index ne me le pardonnera jamais."}, {"user": "OverflowError", "rating": 4, "text_en": "The Simple Diffusion light algorithm is so simple that my RAM actually understood it. It didn't leak, which is highly suspicious for a JavaScript project.", "text_fr": "L'algorithme de lumi\u00e8re Simple Diffusion est tellement simple que ma RAM l'a r\u00e9ellement compris. Pas de fuite de m\u00e9moire, ce qui est extr\u00eamement suspect pour un projet JavaScript."}, {"user": "Z_Axis_Denialist", "rating": 3, "text_en": "I successfully built a perfect 3D model, but then I switched axes from XY to YZ and entered a parallel dimension where my model is flat and my head hurts.", "text_fr": "J'ai r\u00e9ussi \u00e0 construire un mod\u00e8le 3D parfait, mais j'ai chang\u00e9 d'axe de XY \u00e0 YZ et je suis entr\u00e9 dans une dimension parall\u00e8le o\u00f9 mon mod\u00e8le est plat et j'ai mal \u00e0 la t\u00eate."}, {"user": "JSON_Hoarder", "rating": 5, "text_en": "My voxel model is 500x500x500 but the JSON file is only 1.2 KB because I used three cylinders and a sphere. My hard drive thinks I am a wizard.", "text_fr": "Mon mod\u00e8le voxel fait 500x500x500 mais le fichier JSON ne fait que 1,2 Ko parce que j'ai utilis\u00e9 trois cylindres et une sph\u00e8re. Mon disque dur me prend pour un magicien."}, {"user": "GhostWriter", "rating": 5, "text_en": "The ghost layer feature is amazing! I can see the voxels from the previous slice. Unfortunately, I also started seeing the ghosts of my deleted code branches.", "text_fr": "La fonctionnalit\u00e9 de couche fant\u00f4me est g\u00e9niale ! Je peux voir les voxels de la tranche pr\u00e9c\u00e9dente. Malheureusement, j'ai aussi commenc\u00e9 \u00e0 voir les fant\u00f4mes de mes branches de code supprim\u00e9es."}, {"user": "BugMagnet", "rating": 2, "text_en": "Set the environment sky color to neon pink and the light emission to 9999. I can no longer see my screen, but my room is beautifully illuminated. 10/10 nightlight.", "text_fr": "J'ai r\u00e9gl\u00e9 la couleur du ciel sur rose n\u00e9on et l'\u00e9mission lumineuse sur 9999. Je ne vois plus mon \u00e9cran, mais ma chambre est magnifiquement \u00e9clair\u00e9e. 10/10 pour une veilleuse."}, {"user": "NoGPU_NoProblem", "rating": 5, "text_en": "Runs at 60fps on a school calculator from 2004. Take that, Unreal Engine 5!", "text_fr": "Tourne \u00e0 60 images par seconde sur une calculatrice scolaire de 2004. Prends \u00e7a dans les dents, Unreal Engine 5 !"}, {"user": "ArrayOutOfBounds", "rating": 4, "text_en": "Tried to define a color with RGB values of [999, -50, 42]. The engine clamped it to [255, 0, 42] without crashing. I am offended by how robust this error handling is.", "text_fr": "J'ai essay\u00e9 de d\u00e9finir une couleur avec des valeurs RGB de [999, -50, 42]. Le moteur l'a brid\u00e9e \u00e0 [255, 0, 42] sans crasher. Je suis offens\u00e9 par la robustesse de cette gestion des erreurs."}, {"user": "Sisyphus_Coder", "rating": 1, "text_en": "I built a gorgeous voxel character, clicked Export, and realized my cat had disconnected the internet. Then I remembered it's a serverless static webpage and it worked perfectly offline. I hate that I couldn't be mad.", "text_fr": "J'ai cr\u00e9\u00e9 un superbe personnage voxel, j'ai cliqu\u00e9 sur Exporter et j'ai r\u00e9alis\u00e9 que mon chat avait d\u00e9branch\u00e9 internet. Puis je me suis rappel\u00e9 que c'est un site statique sans serveur et que \u00e7a marchait hors ligne. Je d\u00e9teste ne pas pouvoir \u00eatre en col\u00e8re."}, {"user": "DarkThemeOnly", "rating": 5, "text_en": "The editor has an incredibly sleek dark theme interface. My eyes thanked me, until I turned on the Sun Direction light source and flashbang'd myself.", "text_fr": "L'\u00e9diteur a une interface en th\u00e8me sombre incroyablement \u00e9l\u00e9gante. Mes yeux m'ont remerci\u00e9, jusqu'\u00e0 ce que j'active la source lumineuse Sun Direction et que je me flashbange moi-m\u00eame."}], "_source_file": "naxel_editor", "_source_name": "naxel_editor"}}}, "current_page": "nalang", "language": "en", "app_theme": "light"}, {"storage": {"mode": "local", "id": "nath54_website"}});
