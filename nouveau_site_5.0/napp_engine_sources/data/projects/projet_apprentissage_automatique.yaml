description_en: |
  This project is dedicated to solving the **Rakuten France Multimodal Product Data Classification Challenge**, provided by the Rakuten Institute of Technology. The main objective is to automatically classify e-commerce product listings into their correct category (product type code) using both textual descriptions (titles and product descriptions) and product images.

  Key Features and Methodology:
  - **Multimodal Architectures**: Integrates textual features (via TF-IDF, bag-of-embeddings, GRU, or transformer backbones like CamemBERT/BERT/E5) with visual features (via ResNet50, Vision Transformer (ViT), GoogLeNet, or EfficientNet-B3).
  - **Robust Preprocessing Pipeline**: Advanced text cleaning (HTML entity decoding, accent/diacritic removal, custom stop words filtering) combined with intelligent image cropping to discard uninformative white borders.
  - **Handling Imbalance**: Implements specialized class imbalance techniques including Focal Loss, Class Balanced Loss, and training-data stratification/resampling.
  - **Advanced Optimization**: Utilizes advanced augmentations (RandAugment, ColorJitter, Synonym Replacement) and custom learning rate schedules.
  - **Hierarchical Classification**: A 2-stage hierarchical classifier wrapper that groups similar product classes together to improve final granular predictions.
  - **Ensemble Model**: Combines XGBoost models trained on TF-IDF textual representations with deep multimodal PyTorch models using weighted predictions.
description_fr: |
  Ce projet est dédié à la résolution du **défi de classification multimodale de données de produits Rakuten France**, proposé par le Rakuten Institute of Technology. L'objectif principal est de classifier automatiquement les annonces de produits e-commerce dans leur catégorie correcte en utilisant à la fois des descriptions textuelles (titres et descriptions de produits) et des images.

  Fonctionnalités clés et méthodologie :
  - **Architectures multimodales** : Intègre des caractéristiques textuelles (via TF-IDF, sac d'embeddings, GRU ou squelettes de transformers comme CamemBERT/BERT/E5) avec des caractéristiques visuelles (via ResNet50, Vision Transformer (ViT), GoogLeNet ou EfficientNet-B3).
  - **Pipeline de prétraitement robuste** : Nettoyage avancé du texte (décodage d'entités HTML, suppression des accents/diacritics, filtrage personnalisé des mots vides) combiné à un rognage intelligent des images pour éliminer les bordures blanches inutiles.
  - **Gestion du déséquilibre** : Implémente des techniques spécialisées pour le déséquilibre des classes, y compris la Focal Loss, la Class Balanced Loss, et la stratification/le rééchantillonnage des données d'entraînement.
  - **Optimisation avancée** : Utilise des augmentations avancées (RandAugment, ColorJitter, Synonym Replacement) et des planificateurs de taux d'apprentissage personnalisés.
  - **Classification hiérarchique** : Un wrapper de classifieur hiérarchique en 2 étapes qui regroupe les classes de produits similaires pour améliorer les prédictions finales granulaires.
  - **Modèle d'ensemble** : Combine les modèles XGBoost entraînés sur des représentations textuelles TF-IDF avec des modèles PyTorch multimodaux profonds en utilisant des prédictions pondérées.
