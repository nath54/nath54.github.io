description_en: |
  RISCV-Compiler is a premium, high-performance compilation suite that compiles **COREC** (COmputed RECurrences)—a specialized multi-dimensional array recurrence Domain-Specific Language (DSL)—into native **64-bit RISC-V assembly** code. It bridges high-level mathematical recurrence logic with bare-metal machine-level instructions.

  Key Technical Elements:
  - **Lexical and Syntactic Frontend**: Developed in C/C++ using Flex (Lex) and Bison (Yacc) to parse high-level COREC code with strict syntax checks and compile it into an intermediate three-address representation.
  - **Custom Intermediate Code (IR)**: Translates multi-dimensional array operations, recursive calls, and localized scoping rules into a custom-designed three-address intermediate instruction set.
  - **Advanced Backend Translator**: A robust and fully-featured Python compiler backend featuring over 3,700 lines of code. It acts as an IR analyzer, a test-suite emulator, and an assembly code emitter.
  - **Simulation & Native Assemblies**: Emits optimized assemblies for two target targets: RARS (RISC-V Assistant, Assembler, and Runtime Simulator) with custom syscall mapping, and native Linux Kernel environments for physical RISC-V devices.
  - **Embedded Safety Mechanics**: Implements active boundary checks, heap and stack memory tracking, division-by-zero safeguards, and robust error management directly within the compiled assembly code.
description_fr: |
  RISCV-Compiler est une suite de compilation haute performance et haut de gamme qui compile **COREC** (COmputed RECurrences) — un langage dédié (DSL) spécialisé dans les récurrences de tableaux multidimensionnels — en code **assembleur RISC-V 64 bits** natif. Il relie la logique mathématique des récurrences de haut niveau aux instructions machine bas niveau.

  Éléments techniques clés :
  - **Frontend Lexical et Syntaxique** : Développé en C/C++ en utilisant Flex (Lex) et Bison (Yacc) afin d'analyser le code COREC de haut niveau avec des vérifications de syntaxe strictes pour le compiler en code intermédiaire à trois adresses.
  - **Code Intermédiaire (IR) Dédié** : Traduit les opérations sur tableaux multidimensionnels, les appels récursifs et les règles de portée locale en un jeu d'instructions intermédiaires à trois adresses conçu sur mesure.
  - **Traducteur Backend Avancé** : Un traducteur backend robuste écrit en Python de plus de 3 700 lignes de code, agissant comme analyseur d'IR, émulateur de suite de tests et émetteur de code assembleur.
  - **Cibles de Simulation et Natives** : Génère deux versions d'assembleur optimisées : une pour RARS (simulateur) avec mappage des appels système, et une pour les noyaux Linux natifs sur des processeurs RISC-V physiques.
  - **Mécanismes de Sécurité Embarqués** : Intègre des vérifications actives des limites de tableaux, un suivi de la mémoire tas (heap) et pile (stack), des protections contre les divisions par zéro et une gestion robuste des erreurs au cœur de l'assembleur généré.
