description_en: "Cube2 is a fast-paced 2D arcade-puzzle game built entirely in Python using Pygame. Players navigate randomly generated, color-contrasting mazes with a single goal: reach the exit. But there's a catch—you are chased by a sinister clone (Cube2) that replicates your exact movements with a slight delay, draining your health upon contact. Collect hidden keys to unlock locked exits, evade blinking hazard traps, and survive the collapsing time limit bar at the top of the screen. Reaching Level 10 unlocks a powerful Grappling Hook, allowing high-speed traversal across hallways, provided no walls block your line of sight. Cube2 features a deep progression system with 23 unlockable achievements and over 76 unique player skins divided into color-coded rarity tiers (Common, Rare, Epic, Legendary, Divine), including multi-frame animated skins and rotation mechanics. With 5 difficulty modes (from Very Easy with directional assistance to instant-death Hardcore), an 'Eye-Saver' softer rendering option, custom keyboard mapping, and native joystick support, Cube2 is a complete and highly addictive arcade experience."
description_fr: "Cube2 est un jeu d'arcade-puzzle 2D effréné développé entièrement en Python avec Pygame. Les joueurs naviguent dans des labyrinthes générés de manière procédurale aux couleurs contrastées avec un seul but : atteindre la sortie. Mais attention : vous êtes poursuivi par un double maléfique (Cube2) qui reproduit exactement vos mouvements avec un léger décalage, vidant votre santé s'il vous touche. Collectez des clés cachées pour déverrouiller la sortie, évitez les pièges clignotants et survivez avant que la barre de temps au sommet de l'écran ne s'épuise. Atteindre le niveau 10 débloque un puissant Grappin, permettant de vous propulser à grande vitesse dans les couloirs en évitant les obstacles directs. Le jeu propose un système de progression riche avec 23 succès à débloquer et plus de 76 skins de joueur uniques répartis en raretés de couleurs distinctes (Commun, Rare, Épique, Légendaire, Divin), incluant des animations multi-images et des rotations de mouvement. Avec 5 modes de difficulté (de Très Facile avec flèches indicatrices à Hardcore avec mort instantanée), une option de couleurs douces pour protéger vos yeux, la configuration personnalisée des touches et le support manette natif, Cube2 offre une expérience d'arcade complète et addictive."
