short_description_en: "A feature-rich local multiplayer Tetris remix built in Python, featuring 13 custom tetromino shapes, dynamic gradients, co-op/1v1 split-screen modes, and AI bots."
short_description_fr: "Un remix enrichi de Tetris en Python avec 13 pièces personnalisées, des dégradés dynamiques, des modes coopératif et 1v1 en écran scindé, ainsi que des bots."
