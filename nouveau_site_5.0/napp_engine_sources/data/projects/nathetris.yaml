description_en: "Nathetris is a highly customized local multiplayer and single-player Tetris variation developed in Python using Pygame and NumPy. Key Features: 1) Catalog of 13 Tetromino Shapes: Includes standard shapes as well as a 1-block dot, 2-block and 3-block line segments, a corner piece, a 5-block cross, and a 5-block U-shape, completely altering classic strategies. 2) Local Multiplayer Modes: Real-time cooperation (2 players controlling separate blocks on the same grid), cooperative play with a bot, competitive 1v1 split-screen, and competitive play against a bot. 3) Four Coloring Modes: Spawns blocks with fully random colors, shape-bound unique colors, retro high-contrast monochrome (white on black), or a dynamic gradient mode that smoothly transitions colors with each spawned block. 4) Fully Adjustable Rules: Select from three grid sizes (10x18, 15x20, 20x25), four difficulty settings (Easy, Medium, Hard, Hardcore), and four acceleration speeds (None, Slow, Medium, Fast). 5) Hardware Resolution Adaptation: Uses Pygame to read the host display configuration and dynamically scale coordinate systems, providing pixel-perfect menu and board rendering on any aspect ratio."
description_fr: "Nathetris est une variante hautement personnalisable de Tetris, jouable en solo ou en multijoueur local, développée en Python avec Pygame et NumPy. Fonctionnalités clés : 1) Catalogue étendu à 13 pièces : Intègre les formes classiques ainsi qu'un bloc unique (point), des lignes de 2 ou 3 blocs, un coin à 3 blocs, une croix à 5 blocs et une forme en U à 5 blocs pour renouveler l'approche stratégique. 2) Modes multijoueurs en local : Coopération en temps réel (deux joueurs contrôlent deux pièces distinctes sur le même plateau), coopération avec un bot d'aide, duel 1v1 en écran scindé et duel 1v1 contre un bot. 3) Quatre modes de couleurs : Attribution de couleurs entièrement aléatoires, couleurs statiques uniques dédiées à chaque forme, monochrome rétro (blanc sur noir) et un mode dégradé dynamique qui fait évoluer subtilement la couleur à chaque nouvelle pièce. 4) Paramètres personnalisables : Trois tailles de grilles (10x18, 15x20, 20x25), quatre niveaux de difficulté (Facile, Moyen, Difficile, Hardcore) et quatre taux d'accélération progressive (Nul, Lent, Moyen, Rapide). 5) Adaptation dynamique à l'écran : Analyse la résolution de l'hôte au démarrage via Pygame pour adapter proportionnellement l'échelle des coordonnées, garantissant un affichage optimal et sans distorsion."
